<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Производство день за днём</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --card2:#f7f8fa; --line:#e6e9ef; --line2:#d8dde6;
  --text:#1c2230; --text2:#5b6576; --text3:#98a1b1;
  --brand:#e2462c; --brand2:#ff7a45; --brandBg:rgba(226,70,44,.09);
  --green:#1fa971; --greenBg:rgba(31,169,113,.1); --amber:#e89a12; --amberBg:rgba(232,154,18,.12);
  --blue:#3b7cf6; --blueBg:rgba(59,124,246,.1); --red:#e5484d; --redBg:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.04);
  --side:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── AUTH ── */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(226,70,44,.35)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.1}
.brand-tag{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.02em}
.auth h2{font-size:20px;font-weight:800;margin:26px 0 6px}
.auth p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5}
.tabs{display:flex;background:var(--card2);border-radius:11px;padding:4px;margin:24px 0 18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--text2);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.fg{margin-bottom:13px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fi{width:100%;padding:11px 13px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--brand)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none;line-height:1.45}
.msg.err{display:block;background:var(--redBg);color:var(--red)}
.msg.ok{display:block;background:var(--greenBg);color:var(--green)}
.link{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:var(--card);border-color:var(--line2);color:var(--text)}
.btn-s:hover{border-color:var(--text3)}
.btn-d{background:var(--redBg);color:var(--red)}
.btn-w{width:100%}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

/* ── LAYOUT ── */
.app{display:none;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.side .brand{padding:20px 18px 18px}
.nav{flex:1;overflow-y:auto;padding:4px 10px}
.nav-g{font-size:10.5px;font-weight:800;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--text2);font-weight:600;cursor:pointer;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--brandBg);color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--redBg);color:var(--red);border-radius:6px;padding:1px 6px;font-weight:800}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.me-name{font-weight:700;font-size:13px;line-height:1.2}
.me-role{font-size:11px;color:var(--text3)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top .sp{flex:1}
.burger{display:none}
.mode{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
.mode.demo{background:var(--amberBg);color:var(--amber)}
.mode.live{background:var(--greenBg);color:var(--green)}
.content{padding:4px 28px 40px;max-width:1400px;width:100%}

/* ── PERIOD ── */
.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card)}
.range{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:3px 8px}
.range input{border:0;background:none;outline:none;padding:4px 2px;font-weight:600;font-size:12.5px}
.range span{color:var(--text3)}

/* ── CARDS ── */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-t{font-weight:800;font-size:15px}
.card-s{font-size:12px;color:var(--text3);font-weight:600}
.card-h .sp{flex:1}
.kpi .kl{font-size:12px;color:var(--text2);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:8px 0 6px;white-space:nowrap}
.kpi .kv small{font-size:13px;color:var(--text3);font-weight:700;letter-spacing:0}
.kd{font-size:11.5px;font-weight:700}
.kd.up{color:var(--green)} .kd.down{color:var(--red)} .kd.flat{color:var(--text3)}
.kpi.accent{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.kpi.accent .kl,.kpi.accent .kv small,.kpi.accent .kd{color:rgba(255,255,255,.88)}
.g2{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.row-gap{margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg text{font-family:Manrope,sans-serif}

/* hbars */
.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.hb-top b{font-weight:700}
.hb-top span{color:var(--text2);font-weight:600;white-space:nowrap}
.track{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}

/* weekday */
.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wk .b{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--brandBg);transition:height .3s}
.wk .b.top{background:var(--brand)}
.wk small{font-size:11px;color:var(--text3);font-weight:700}

/* donut */
.donut{display:flex;align-items:center;gap:16px}
.dl{flex:1;min-width:0}
.dl div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.dl i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dl span{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{font-weight:800}

/* shift */
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sh{background:var(--card2);border-radius:12px;padding:13px}
.sh .n{font-size:12px;font-weight:700;color:var(--text2)}
.sh .v{font-size:19px;font-weight:800;margin:4px 0 2px}
.sh .d{font-size:11.5px;color:var(--text3);font-weight:600}

/* tables */
.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;padding:11px 14px;background:var(--card2);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr:hover td{background:var(--card2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.t-green{background:var(--greenBg);color:var(--green)} .t-red{background:var(--redBg);color:var(--red)}
.t-amber{background:var(--amberBg);color:var(--amber)} .t-blue{background:var(--blueBg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--text2)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog .track{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.sel{padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-weight:600;font-size:12.5px;outline:none}
.empty{text-align:center;padding:40px 10px;color:var(--text3);font-weight:600}
.muted{color:var(--text3)}
.hint{font-size:12.5px;color:var(--text2);line-height:1.55}
.hint code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:60;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.modal-c{background:var(--card);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-c h3{font-size:18px;font-weight:800;margin-bottom:18px;display:flex;align-items:center}
.modal-c h3 .sp{flex:1}
.modal-f{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--text);color:var(--card);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;transition:transform .3s;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--card);font-size:12px;font-weight:600;padding:8px 10px;border-radius:9px;z-index:98;display:none;line-height:1.5;white-space:nowrap}
.scrim{display:none}

@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.g2,.g3,.g11{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{transform:translateX(-100%)} .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0} .burger{display:flex}
  .top{padding:12px 16px 10px} .top h1{font-size:19px} .content{padding:4px 16px 30px}
  .kpis{grid-template-columns:repeat(2,1fr)} .range{margin-left:0;width:100%;justify-content:center}
  .shifts{grid-template-columns:1fr} .top .hide-m{display:none}
}
</style>
</head>
<body>

<!-- ═══ AUTH ═══ -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">ПД</div><div><div class="brand-name">Производство день за днём</div><div class="brand-tag">выпуск · планы · качество</div></div></div>
    <div id="authBody"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">ПД</div><div><div class="brand-name">Производство день за днём</div><div class="brand-tag" id="orgName"></div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="av" id="meAv">?</div>
      <div style="flex:1;min-width:0"><div class="me-name" id="meName"></div><div class="me-role" id="meRole"></div></div>
      <button class="icon-btn" title="Выйти" onclick="logout()"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn burger" onclick="toggleSide(true)"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="pageTitle">Дашборд</h1>
      <div class="sp"></div>
      <span class="mode" id="modeTag"></span>
      <select class="sel hide-m" id="roleSwitch" style="display:none" onchange="demoRole(this.value)" title="Посмотреть интерфейс глазами роли"></select>
      <button class="btn btn-p" id="quickAdd" onclick="openOutputModal()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-m">Внести выпуск</span></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-c">
    <h3><span id="mTitle"></span><span class="sp"></span><button class="icon-btn" onclick="closeModal()">✕</button></h3>
    <form id="mForm" onsubmit="event.preventDefault();document.getElementById('mSave').click()"><div id="mBody"></div></form>
    <div class="modal-f"><button class="btn btn-s" onclick="closeModal()">Отмена</button><button class="btn btn-p" id="mSave">Сохранить</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
// ═════════════════════════════════════════════
//  CONFIG — тот же Firebase, что у FinFlow (упрощённый открытый режим,
//  для демо без коммерческих данных). Если база недоступна —
//  можно открыть локальное демо.
// ═════════════════════════════════════════════
const FB_CONFIG = {

  authDomain: "family-budget-32149.firebaseapp.com",
  databaseURL: "https://family-budget-32149-default-rtdb.europe-west1.firebasedatabase.app",

};
const ROOT = 'prod'; // всё приложение живёт в ветке /prod, FinFlow не затрагивается

// ═════════════════════════════════════════════
//  ROLES
// ═════════════════════════════════════════════
const ROLES = {
  admin:        {n:'Администратор',  lvl:4, d:'Всё + сотрудники и доступы'},
  technologist: {n:'Технолог',       lvl:3, d:'Заказы, линии, продукция, склад, выпуск'},
  master:       {n:'Мастер смены',   lvl:3, d:'Выпуск, заказы, склад'},
  operator:     {n:'Оператор',       lvl:1, d:'Только внесение выпуска за смену'},
  viewer:       {n:'Наблюдатель',    lvl:0, d:'Только просмотр'},
};
const can = a => { const l = ROLES[state.me.role]?.lvl ?? 0; return a==='admin' ? l>=4 : a==='edit' ? l>=3 : a==='output' ? l>=1 : true; };

const ICONS = {
  dash:'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z',
  output:'M2 20h20M4 20V9l5 3V9l5 3V9l5 3V4h2v16',
  quality:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',
  orders:'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M8 11h8M8 15h5',
  stock:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
  lines:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
  reports:'M3 3v18h18M7 15l4-4 3 3 5-6',
  staff:'M16 20v-1a4 4 0 00-4-4H6a4 4 0 00-4 4v1M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM22 20v-1a4 4 0 00-3-3.9M16 4.2a3.5 3.5 0 010 6.6',
  settings:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z',
};
const icon = k => `<svg class="i" viewBox="0 0 24 24"><path d="${ICONS[k]}"/></svg>`;

const SECTIONS = [
  {g:'Производство'},

// ═════════════════════════════════════════════
//  STATE & HELPERS
// ═════════════════════════════════════════════
let DB = {lines:[],products:[],orders:[],stock:[],output:[],members:[],settings:{}};
const state = {sec:'dashboard', me:{id:'',name:'',email:'',role:'viewer'}, mode:'demo', org:null, preset:'month', from:'', to:'', lineF:'', groupBy:'product'};
let auth=null, fdb=null, orgRef=null;

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = n => Math.round(n||0).toLocaleString('ru-RU');
const P = (n,d=1) => (isFinite(n)?n:0).toFixed(d).replace('.',',')+'%';
const short = n => n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'М':n>=1e3?Math.round(n/1e3)+'к':Math.round(n)+'';
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd = s => { const [a,b,c]=s.split('-'); return new Date(+a,b-1,+c); };
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const span = (a,b) => Math.round((pd(b)-pd(a))/864e5)+1;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MON = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fdate = s => { const d=pd(s); return d.getDate()+' '+MON[d.getMonth()]; };
const byId = (arr,id) => arr.find(x=>x.id===id);
const lineName = id => byId(DB.lines,id)?.name || '—';
const prodName = id => byId(DB.products,id)?.name || '—';
const COLORS = ['#e2462c','#3b7cf6','#1fa971','#e89a12','#8b5cf6','#ec4899','#14b8a6','#64748b'];
const avColor = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function toggleSide(o){ $('#side').classList.toggle('open',o); $('#scrim').classList.toggle('open',o); }

// tooltip
document.addEventListener('mousemove',e=>{
  const el=e.target.closest?.('[data-tip]'); const tip=$('#tip');
  if(!el){ tip.style.display='none'; return; }
  tip.innerHTML=el.dataset.tip; tip.style.display='block';
  const w=tip.offsetWidth; tip.style.left=Math.min(e.clientX+14, innerWidth-w-8)+'px'; tip.style.top=(e.clientY+14)+'px';
});

// ═════════════════════════════════════════════
//  PERIOD
// ═════════════════════════════════════════════
const PRESETS = [['today','Сегодня'],['yesterday','Вчера'],['week','7 дней'],['month','Этот месяц'],['prevmonth','Прошлый месяц'],['quarter','Квартал'],['year','Год']];
function setPreset(p){
  const t=new Date(); let f=t, to=t;
  if(p==='yesterday'){ f=to=addD(t,-1); }
  if(p==='week'){ f=addD(t,-6); }
  if(p==='month'){ f=new Date(t.getFullYear(),t.getMonth(),1); }
  if(p==='prevmonth'){ f=new Date(t.getFullYear(),t.getMonth()-1,1); to=new Date(t.getFullYear(),t.getMonth(),0); }
  if(p==='quarter'){ f=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1); }
  if(p==='year'){ f=new Date(t.getFullYear(),0,1); }
  state.preset=p; state.from=iso(f); state.to=iso(to); render();
}
function setRange(f,t){ if(f) state.from=f; if(t) state.to=t; if(state.from>state.to) [state.from,state.to]=[state.to,state.from]; state.preset=''; render(); }
function periodBar(){
  return `<div class="period">${PRESETS.map(([k,l])=>`<button class="chip ${state.preset===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}
  <div class="range"><input type="date" value="${state.from}" onchange="setRange(this.value)"><span>—</span><input type="date" value="${state.to}" onchange="setRange(null,this.value)"></div></div>`;
}
const inRange = (f,t) => DB.output.filter(r=>r.date>=f && r.date<=t);
function prevRange(){ const n=span(state.from,state.to); const t=addD(pd(state.from),-1); return [iso(addD(t,-(n-1))), iso(t)]; }

// ═════════════════════════════════════════════
//  METRICS
// ═════════════════════════════════════════════
function planDay(dateStr){
  const wd = pd(dateStr).getDay(); const days = DB.settings.workDays || [1,2,3,4,5];
  if(!days.includes(wd)) return 0;
  const k = DB.settings.planFactor ?? 0.85;
  return DB.lines.filter(l=>!state.lineF||l.id===state.lineF).reduce((s,l)=>s+(+l.cap||0)*(+l.shifts||1)*k,0);
}
function planRange(f,t){ let s=0; for(let d=pd(f); iso(d)<=t; d=addD(d,1)) s+=planDay(iso(d)); return s; }
function metrics(recs,f,t){
  const good=recs.reduce((s,r)=>s+(+r.good||0),0), defect=recs.reduce((s,r)=>s+(+r.defect||0),0);
  const down=recs.reduce((s,r)=>s+(+r.downtime||0),0), setup=recs.reduce((s,r)=>s+(+r.setup||0),0);
  const shiftsN=new Set(recs.map(r=>r.date+'|'+r.shift+'|'+r.lineId)).size;
  const shiftMin=(DB.settings.shiftHours||8)*60;
  const plan=planRange(f,t);
  return {good,defect,down,setup,shiftsN,plan,
    planPct: plan? good/plan*100 : 0,
    defPct: good+defect? defect/(good+defect)*100 : 0,
    perShift: shiftsN? good/shiftsN : 0,
    setupPct: shiftsN? setup/(shiftsN*shiftMin)*100 : 0,
    avail: shiftsN? (1-(down+setup)/(shiftsN*shiftMin))*100 : 0};
}
function delta(cur,prev,lowerBetter){
  if(!prev) return `<div class="kd flat">нет данных за пред. период</div>`;
  const d=(cur-prev)/prev*100; const good = lowerBetter ? d<0 : d>0;
  if(Math.abs(d)<0.5) return `<div class="kd flat">≈ как в пред. периоде</div>`;
  return `<div class="kd ${good?'up':'down'}">${d>0?'▲':'▼'} ${P(Math.abs(d),0)} к пред. периоду</div>`;
}
function orderDone(o){ return DB.output.filter(r=>r.orderId===o.id).reduce((s,r)=>s+(+r.good||0),0); }
function orderStatus(o){ const d=orderDone(o); if(d>=o.qty) return 'done'; if(o.due<iso(new Date())) return 'overdue'; return d>0?'work':'new'; }
function orderStats(){ const s={done:0,overdue:0,work:0,new:0}; DB.orders.forEach(o=>s[orderStatus(o)]++); return s; }
const OST = {done:['Выполнен','t-green'],overdue:['Просрочен','t-red'],work:['В работе','t-blue'],new:['Новый','t-gray']};

// ═════════════════════════════════════════════
//  CHARTS
// ═════════════════════════════════════════════
function buckets(f,t){
  const n=span(f,t), mode=n<=62?'day':n<=400?'week':'month', out=[]; let cur=null;
  for(let d=pd(f); iso(d)<=t; d=addD(d,1)){
    const s=iso(d); let key,label;
    if(mode==='day'){ key=s; label=n<=14?WD[(d.getDay()+6)%7]+' '+d.getDate():String(d.getDate()); }
    else if(mode==='week'){ const m=addD(d,-((d.getDay()+6)%7)); key=iso(m); label=fdate(key); }
    else { key=s.slice(0,7); label=MON[d.getMonth()]; }
    if(!cur||cur.key!==key){ cur={key,label,from:s,to:s,good:0,defect:0,plan:0}; out.push(cur); }
    cur.to=s; cur.plan+=planDay(s);
  }
  const map={}; out.forEach(b=>{ for(let d=pd(b.from); iso(d)<=b.to; d=addD(d,1)) map[iso(d)]=b; });
  filtered(inRange(f,t)).forEach(r=>{ const b=map[r.date]; if(b){ b.good+=+r.good||0; b.defect+=+r.defect||0; } });
  return {mode,data:out};
}
function barChart(el,{data,mode}){
  const W=Math.max(el.clientWidth,280), H=270, pl=44, pr=8, pt=12, pb=28, iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(1,...data.map(d=>Math.max(d.good+d.defect,d.plan)))*1.1;
  const y=v=>pt+ih-(v/max)*ih, bw=iw/data.length, gap=Math.min(bw*.28,10), step=Math.ceil(data.length/(iw/44));
  let s=`<svg width="${W}" height="${H}">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--text3)" font-weight="600">${short(v)}</text>`; }
  data.forEach((d,i)=>{
    const x=pl+i*bw+gap/2, w=Math.max(bw-gap,1), yg=y(d.good), yd=y(d.good+d.defect);
    s+=`<rect x="${x}" y="${yg}" width="${w}" height="${pt+ih-yg}" rx="${Math.min(3,w/3)}" fill="var(--brand)"/>`;
    if(d.defect) s+=`<rect x="${x}" y="${yd}" width="${w}" height="${yg-yd}" fill="var(--amber)"/>`;
    if(i%step===0) s+=`<text x="${x+w/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">${esc(d.label)}</text>`;
    const period = d.from===d.to ? fdate(d.from) : fdate(d.from)+' — '+fdate(d.to);
    s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="<b>${period}</b><br>Годные: ${N(d.good)} шт<br>Брак: ${N(d.defect)} шт<br>План: ${N(d.plan)} шт${d.plan?' · '+P(d.good/d.plan*100,0):''}"/>`;
  });
  const pts=data.map((d,i)=>`${pl+i*bw+bw/2},${y(d.plan)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55" style="pointer-events:none"/>`;
  el.innerHTML=s+'</svg>';
}
function donut(parts){
  const total=parts.reduce((s,p)=>s+p.v,0); if(!total) return `<div class="empty">Брака нет — отлично</div>`;
  const r=62, c=2*Math.PI*r; let off=0;
  const segs=parts.map((p,i)=>{ const len=p.v/total*c; const seg=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="${esc(p.k)}: ${N(p.v)} шт"/>`; off+=len; return seg; }).join('');
  return `<div class="donut"><svg width="160" height="160" style="flex-shrink:0">${segs}<text x="80" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">${short(total)}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">шт брака</text></svg>
  <div class="dl">${parts.map((p,i)=>`<div><i style="background:${COLORS[i%COLORS.length]}"></i><span>${esc(p.k)}</span><b>${P(p.v/total*100,0)}</b></div>`).join('')}</div></div>`;
}
const groupSum = (recs,keyFn,valFn=r=>+r.defect||0) => { const m={}; recs.forEach(r=>{ const k=keyFn(r); m[k]=(m[k]||0)+valFn(r); }); return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v); };
const filtered = recs => state.lineF ? recs.filter(r=>r.lineId===state.lineF) : recs;
function lineFilter(){ return `<select class="sel" onchange="state.lineF=this.value;render()"><option value="">Все линии</option>${DB.lines.map(l=>`<option value="${l.id}" ${state.lineF===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`; }

// ═════════════════════════════════════════════
//  DASHBOARD
// ═════════════════════════════════════════════
function renderDashboard(){
  const recs=filtered(inRange(state.from,state.to)), [pf,pt]=prevRange(), prev=filtered(inRange(pf,pt));
  const m=metrics(recs,state.from,state.to), pm=metrics(prev,pf,pt), os=orderStats();
  const target=DB.settings.setupTarget??5;
  const kpi=(cls,l,v,u,d,tip='')=>`<div class="card kpi ${cls}" ${tip?`data-tip="${tip}"`:''}><div class="kl">${l}</div><div class="kv">${v} <small>${u}</small></div>${d}</div>`;

  // by line
  const lineRows=DB.lines.filter(l=>!state.lineF||l.id===state.lineF).map(l=>{
    const lr=recs.filter(r=>r.lineId===l.id), g=lr.reduce((s,r)=>s+(+r.good||0),0);
    let pl=0; for(let d=pd(state.from); iso(d)<=state.to; d=addD(d,1)){ const wd=d.getDay(); if((DB.settings.workDays||[1,2,3,4,5]).includes(wd)) pl+=l.cap*l.shifts*(DB.settings.planFactor??.85); }
    const pct=pl?g/pl*100:0;
    return `<div class="hb"><div class="hb-top"><b>${esc(l.name)}</b><span>${N(g)} шт · ${P(pct,0)}</span></div><div class="track"><div class="fill" style="width:${Math.min(pct,100)}%;background:${pct>=100?'var(--green)':pct>=85?'var(--brand)':'var(--amber)'}"></div></div></div>`;
  }).join('') || `<div class="empty">Нет линий</div>`;

  // weekdays (average per working day with records)
  const wd=Array(7).fill(0).map(()=>({s:0,days:new Set()}));
  recs.forEach(r=>{ const i=(pd(r.date).getDay()+6)%7; wd[i].s+=+r.good||0; wd[i].days.add(r.date); });
  const wavg=wd.map(x=>x.days.size?x.s/x.days.size:0), wmax=Math.max(1,...wavg);
  const wk=wavg.map((v,i)=>`<div data-tip="${WD[i]}: в среднем ${N(v)} шт/день"><div class="b ${v===wmax&&v>0?'top':''}" style="height:${v/wmax*100}%"></div><small>${WD[i]}</small></div>`).join('');

  // shifts
  const shN=Math.max(...DB.lines.map(l=>+l.shifts||1),1);
  const sh=[1,2,3].slice(0,Math.max(shN,2)).map(s=>{ const sr=recs.filter(r=>+r.shift===s); const g=sr.reduce((a,r)=>a+(+r.good||0),0), d=sr.reduce((a,r)=>a+(+r.defect||0),0);
    return `<div class="sh"><div class="n">${s}-я смена</div><div class="v">${N(g)}</div><div class="d">брак ${P(g+d?d/(g+d)*100:0)} · ${new Set(sr.map(r=>r.date+r.lineId)).size} смен</div></div>`; }).join('');

  // top products
  const top=groupSum(recs,r=>r.productId,r=>+r.good||0).slice(0,6).map(({k,v})=>{
    const pr=byId(DB.products,k), rr=recs.filter(r=>r.productId===k), d=rr.reduce((a,r)=>a+(+r.defect||0),0);
    return `<tr><td><b>${esc(pr?.name||'—')}</b><div class="muted" style="font-size:12px">${esc(pr?.client||'')}</div></td><td class="num">${N(v)}</td><td class="num">${P(v+d?d/(v+d)*100:0)}</td></tr>`; }).join('');

  // orders at risk
  const risk=DB.orders.filter(o=>['overdue','work','new'].includes(orderStatus(o))).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(o=>{
    const d=orderDone(o), pct=Math.min(d/o.qty*100,100), st=OST[orderStatus(o)];
    return `<tr><td><b>${esc(o.no)}</b><div class="muted" style="font-size:12px">${esc(prodName(o.productId))}</div></td><td><div class="prog"><div class="track"><div class="fill" style="width:${pct}%;background:var(--brand)"></div></div><span style="font-size:12px;font-weight:700">${P(pct,0)}</span></div></td><td>${fdate(o.due)}</td><td><span class="tag ${st[1]}">${st[0]}</span></td></tr>`; }).join('');

  $('#content').innerHTML = periodBar() + `
  <div class="grid kpis">
    ${kpi('accent','Выпуск годных',N(m.good),'шт',delta(m.good,pm.good))}
    ${kpi('','Выполнение плана',P(m.planPct,0),'',`<div class="kd flat">план ${N(m.plan)} шт</div>`)}
    ${kpi('','Брак',P(m.defPct),'',delta(m.defPct,pm.defPct,true),'Доля брака от всего отпечатанного')}
    ${kpi('','Переналадка',P(m.setupPct),'',`<div class="kd ${m.setupPct<=target?'up':'down'}">цель ≤ ${target}% · ${N(m.setup/60)} ч</div>`,'Время переналадок от общего фонда времени смен')}
    ${kpi('','Простои',N(m.down/60),'ч',delta(m.down,pm.down,true),'Аварийные и организационные простои (без переналадок)')}
    ${kpi('','Выработка за смену',N(m.perShift),'шт',delta(m.perShift,pm.perShift),'Годные шт на одну отработанную смену линии')}
  </div>
  <div class="card row-gap">
    <div class="card-h"><div><div class="card-t">Выпуск за период</div><div class="card-s" id="bkMode"></div></div><div class="sp"></div>
      <div class="legend"><span><i style="background:var(--brand)"></i>Годные</span><span><i style="background:var(--amber)"></i>Брак</span><span><i style="background:none;border-top:2px dashed var(--text3);border-radius:0;height:0;width:14px"></i>План</span></div>${lineFilter()}</div>
    <div class="chart" id="mainChart"></div>
  </div>
  <div class="grid g3 row-gap">
    <div class="card"><div class="card-h"><div class="card-t">Линии · выполнение плана</div></div>${lineRows}</div>
    <div class="card"><div class="card-h"><div class="card-t">Брак по причинам</div></div>${donut(groupSum(recs,r=>r.reason||'Не указана').filter(x=>x.v>0).slice(0,6))}</div>
    <div class="card"><div class="card-h"><div><div class="card-t">По дням недели</div><div class="card-s">средний выпуск за рабочий день</div></div></div><div class="wk">${wk}</div></div>
  </div>
  <div class="grid g11 row-gap">
    <div class="card"><div class="card-h"><div class="card-t">Топ продукции</div></div>${top?`<div class="tw"><table><tr><th>Продукция</th><th class="num">Годные</th><th class="num">Брак</th></tr>${top}</table></div>`:'<div class="empty">Нет выпуска за период</div>'}</div>
    <div class="card"><div class="card-h"><div class="card-t">Заказы в работе</div><div class="sp"></div>${os.overdue?`<span class="tag t-red">${os.overdue} просрочено</span>`:''}<button class="btn btn-s btn-sm" onclick="go('orders')">Все заказы</button></div>${risk?`<div class="tw"><table><tr><th>Заказ</th><th>Готовность</th><th>Срок</th><th>Статус</th></tr>${risk}</table></div>`:'<div class="empty">Активных заказов нет</div>'}</div>
  </div>
  <div class="card"><div class="card-h"><div class="card-t">По сменам</div></div><div class="shifts">${sh}</div></div>`;

  const b=buckets(state.from,state.to);
  $('#bkMode').textContent={day:'по дням',week:'по неделям',month:'по месяцам'}[b.mode];
  barChart($('#mainChart'),b);
}

// ═════════════════════════════════════════════
//  OUTPUT JOURNAL
// ═════════════════════════════════════════════
function renderOutput(){
  const recs=filtered(inRange(state.from,state.to)).sort((a,b)=>b.date.localeCompare(a.date)||b.shift-a.shift||(b.ts||0)-(a.ts||0));
  const m=metrics(recs,state.from,state.to), shown=recs.slice(0,300);
  $('#content').innerHTML = periodBar() + `
  <div class="toolbar">${lineFilter()}<span class="muted" style="font-weight:600">${recs.length} записей · ${N(m.good)} годных · брак ${P(m.defPct)}</span><div class="sp"></div>
    ${can('output')?`<button class="btn btn-p" onclick="openOutputModal()">+ Внести выпуск</button>`:''}</div>
  <div class="card">${shown.length?`<div class="tw" style="margin-top:-18px;border-top:0"><table>
    <tr><th>Дата</th><th>Смена</th><th>Линия</th><th>Продукция</th><th>Заказ</th><th class="num">Годные</th><th class="num">Брак</th><th>Причина</th><th class="num">Переналадка</th><th class="num">Простой</th><th>Оператор</th><th></th></tr>
    ${shown.map(r=>`<tr><td>${fdate(r.date)}</td><td>${r.shift}</td><td>${esc(lineName(r.lineId))}</td><td>${esc(prodName(r.productId))}</td><td>${esc(byId(DB.orders,r.orderId)?.no||'—')}</td>

function renderQuality(){
  const recs=filtered(inRange(state.from,state.to)), m=metrics(recs,state.from,state.to);
  const byLine=DB.lines.map(l=>{ const lr=recs.filter(r=>r.lineId===l.id); const g=lr.reduce((a,r)=>a+(+r.good||0),0), d=lr.reduce((a,r)=>a+(+r.defect||0),0); return {l,g,d,p:g+d?d/(g+d)*100:0}; });
  const maxP=Math.max(1,...byLine.map(x=>x.p));
  const byProd=groupSum(recs,r=>r.productId).filter(x=>x.v>0).slice(0,10).map(({k,v})=>{ const rr=recs.filter(r=>r.productId===k); const g=rr.reduce((a,r)=>a+(+r.good||0),0); const top=groupSum(rr,r=>r.reason||'—')[0]; return `<tr><td>${esc(prodName(k))}</td><td class="num">${N(v)}</td><td class="num"><b>${P(v/(g+v)*100)}</b></td><td class="muted">${esc(top?.k||'')}</td></tr>`; }).join('');
  const target=DB.settings.defectTarget??2;
  $('#content').innerHTML = periodBar() + `<div class="toolbar">${lineFilter()}</div>
  <div class="grid kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="card kpi accent"><div class="kl">Брак</div><div class="kv">${P(m.defPct)}</div><div class="kd">цель ≤ ${target}%</div></div>
    <div class="card kpi"><div class="kl">Брак, шт</div><div class="kv">${N(m.defect)}</div><div class="kd flat">из ${N(m.good+m.defect)} отпечатанных</div></div>
    <div class="card kpi"><div class="kl">Потери выпуска</div><div class="kv">${N(m.defect/Math.max(m.perShift,1)*10)/10} <small>смен</small></div><div class="kd flat">столько смен ушло в брак</div></div>
    <div class="card kpi"><div class="kl">Доступность линий</div><div class="kv">${P(m.avail,0)}</div><div class="kd flat">без простоев и переналадок</div></div>
  </div>
  <div class="grid g11 row-gap">
    <div class="card"><div class="card-h"><div class="card-t">Причины брака</div></div>${donut(groupSum(recs,r=>r.reason||'Не указана').filter(x=>x.v>0).slice(0,8))}</div>
    <div class="card"><div class="card-h"><div class="card-t">Брак по линиям</div></div>${byLine.map(x=>`<div class="hb"><div class="hb-top"><b>${esc(x.l.name)}</b><span>${N(x.d)} шт · ${P(x.p)}</span></div><div class="track"><div class="fill" style="width:${x.p/maxP*100}%;background:${x.p>target?'var(--red)':'var(--green)'}"></div></div></div>`).join('')}</div>
  </div>
  <div class="card"><div class="card-h"><div class="card-t">Продукция с наибольшим браком</div></div>${byProd?`<div class="tw"><table><tr><th>Продукция</th><th class="num">Брак, шт</th><th class="num">Доля</th><th>Главная причина</th></tr>${byProd}</table></div>`:'<div class="empty">Брака нет</div>'}</div>`;
}

// ═════════════════════════════════════════════
//  REPORTS
// ═════════════════════════════════════════════
const GROUPS = {product:['Продукция',r=>prodName(r.productId)],line:['Линия',r=>lineName(r.lineId)],operator:['Оператор',r=>r.operator||'—'],order:['Заказ',r=>byId(DB.orders,r.orderId)?.no||'Без заказа'],day:['День',r=>r.date],shift:['Смена',r=>r.shift+'-я смена']};
function reportRows(){
  const recs=filtered(inRange(state.from,state.to)), fn=GROUPS[state.groupBy][1], m={};
  recs.forEach(r=>{ const k=fn(r); const x=m[k]||(m[k]={k,good:0,defect:0,setup:0,down:0,shifts:new Set()}); x.good+=+r.good||0; x.defect+=+r.defect||0; x.setup+=+r.setup||0; x.down+=+r.downtime||0; x.shifts.add(r.date+r.shift+r.lineId); });
  return Object.values(m).sort((a,b)=>state.groupBy==='day'?b.k.localeCompare(a.k):b.good-a.good);
}
function renderReports(){
  const rows=reportRows(), tot=rows.reduce((a,r)=>({good:a.good+r.good,defect:a.defect+r.defect,setup:a.setup+r.setup,down:a.down+r.down}),{good:0,defect:0,setup:0,down:0});
  $('#content').innerHTML = periodBar() + `<div class="toolbar"><span class="fl" style="margin:0">Группировать по</span><select class="sel" onchange="state.groupBy=this.value;render()">${Object.entries(GROUPS).map(([k,[l]])=>`<option value="${k}" ${state.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>${lineFilter()}<div class="sp"></div><button class="btn btn-s" onclick="exportCSV()">⬇ Выгрузить CSV (Excel)</button></div>
  <div class="card">${rows.length?`<div class="tw" style="margin-top:-18px;border-top:0"><table><tr><th>${GROUPS[state.groupBy][0]}</th><th class="num">Смен</th><th class="num">Годные</th><th class="num">Брак</th><th class="num">Брак %</th><th class="num">Переналадка, ч</th><th class="num">Простои, ч</th><th class="num">Выработка/смену</th></tr>
  ${rows.map(r=>`<tr><td><b>${esc(state.groupBy==='day'?fdate(r.k):r.k)}</b></td><td class="num">${r.shifts.size}</td><td class="num">${N(r.good)}</td><td class="num">${N(r.defect)}</td><td class="num">${P(r.good+r.defect?r.defect/(r.good+r.defect)*100:0)}</td><td class="num">${(r.setup/60).toFixed(1)}</td><td class="num">${(r.down/60).toFixed(1)}</td><td class="num">${N(r.good/Math.max(r.shifts.size,1))}</td></tr>`).join('')}
  <tr><td><b>Итого</b></td><td></td><td class="num"><b>${N(tot.good)}</b></td><td class="num"><b>${N(tot.defect)}</b></td><td class="num"><b>${P(tot.good+tot.defect?tot.defect/(tot.good+tot.defect)*100:0)}</b></td><td class="num"><b>${(tot.setup/60).toFixed(1)}</b></td><td class="num"><b>${(tot.down/60).toFixed(1)}</b></td><td></td></tr></table></div>`:'<div class="empty">Нет данных за период</div>'}</div>`;

const Store = {
  path(col,id){ return `${ROOT}/data/${col}/${id}`; },
  async add(col,obj){ obj.id=obj.id||uid(); return this.put(col,obj); },
  async put(col,obj){
    if(state.mode==='fb') return fdb.ref(this.path(col,obj.id)).set(JSON.parse(JSON.stringify(obj)));
    const i=DB[col].findIndex(x=>x.id===obj.id); if(i>=0) DB[col][i]=obj; else DB[col].push(obj); demoSave(); render();
  },
  async del(col,id){
    if(state.mode==='fb') return fdb.ref(this.path(col,id)).remove();
    DB[col]=DB[col].filter(x=>x.id!==id); demoSave(); render();
  },
  async settings(s){
    if(state.mode==='fb') return fdb.ref(`${ROOT}/data/settings`).set(s);
    DB.settings=s; demoSave(); $('#orgName').textContent=s.orgName; render();
  },
  async user(u,delId){
    if(state.mode==='fb') return u?fdb.ref(`${ROOT}/users/${u.id}`).set(u):fdb.ref(`${ROOT}/users/${delId}`).remove();
    if(u){ const i=DB.members.findIndex(m=>m.id===u.id); if(i>=0) DB.members[i]=u; else DB.members.push(u); } else DB.members=DB.members.filter(m=>m.id!==delId);
    demoSave(); render();
  },
};

//  DEMO DATA — пример производства
// ═════════════════════════════════════════════
const DEFAULT_SETTINGS = {orgName:'Моё производство', planFactor:.85, shiftHours:8, setupTarget:5, defectTarget:2, workDays:[1,2,3,4,5],
  defectReasons:['Смещение печати (приводка)','Непропечатка','Потёки / размытие краски','Включения, пыль','Дефект тары от поставщика','Цвет вне допуска','Царапины при съёме']};
function genDemo(){
  let seed=11; const rnd=()=>(seed=seed*16807%2147483647)/2147483647, pick=a=>a[Math.floor(rnd()*a.length)];
  const lines=[
    {id:'L1',name:'Kammann K15',type:'Шелкография, 1–6 цветов',cap:7000,shifts:3},
    {id:'L2',name:'Линия 2 · Офсет',type:'Сухой офсет, до 8 цветов',cap:14000,shifts:2},
    {id:'L3',name:'Линия 3 · Термотрансфер',type:'Термотрансфер',cap:5500,shifts:2},
    {id:'L4',name:'Линия 4 · Тампопечать',type:'Тампопечать (крышки)',cap:9000,shifts:1}];
  const products=[
    {id:'P1',name:'Ведро 10 л «Эко Фасад»',client:'ХимПром',tare:'Ведро 10 л',lineId:'L1',setupNorm:90},
    {id:'P2',name:'Ведро 5 л «Грунт Про»',client:'ХимПром',tare:'Ведро 5 л',lineId:'L1',setupNorm:75},
    {id:'P3',name:'Ведро 20 л «Штукатурка»',client:'БудМикс',tare:'Ведро 20 л',lineId:'L1',setupNorm:100},
    {id:'P4',name:'Банка 0,9 л «Эмаль ПФ»',client:'ЛакоКрас',tare:'Банка 0,9 л',lineId:'L2',setupNorm:60},
    {id:'P5',name:'Банка 2,7 л «Эмаль ПФ»',client:'ЛакоКрас',tare:'Банка 2,7 л',lineId:'L2',setupNorm:60},
    {id:'P6',name:'Стакан 0,5 л «Паста томатная»',client:'АгроФуд',tare:'Стакан 0,5 л',lineId:'L2',setupNorm:45},
    {id:'P7',name:'Ведро 3 л «Майонез Домашний»',client:'АгроФуд',tare:'Ведро 3 л',lineId:'L3',setupNorm:40},
    {id:'P8',name:'Контейнер 1 л «Мёд Карпат»',client:'Бортник',tare:'Контейнер 1 л',lineId:'L3',setupNorm:35},
    {id:'P9',name:'Крышка 82 мм «АгроФуд»',client:'АгроФуд',tare:'Крышка 82 мм',lineId:'L4',setupNorm:25}];
  const ops=['Иванов А.','Петренко О.','Коваль М.','Сидорук В.','Мельник Т.','Бондар Р.','Шевчук Л.'];
  const reasons=DEFAULT_SETTINGS.defectReasons, rw=[30,18,15,12,10,9,6];
  const reason=()=>{ let x=rnd()*100; for(let i=0;i<rw.length;i++){ if((x-=rw[i])<0) return reasons[i]; } return reasons[0]; };
  const today=new Date(), T=iso(today), orders=[], output=[];
  // orders: rolling, per product
  for(let i=0;i<14;i++){ const p=products[i%products.length], start=addD(today,-70+i*5), due=addD(start,18+Math.floor(rnd()*14));
    orders.push({id:'O'+i,no:'З-'+(101+i),productId:p.id,qty:0,due:iso(due),created:iso(start),note:''}); }
  const cur={}; // current product per line
  for(let d=addD(today,-180); iso(d)<=T; d=addD(d,1)){
    const s=iso(d), wd=d.getDay(); if(wd===0) continue; if(wd===6&&rnd()<.5) continue;
    lines.forEach(l=>{
      const nSh=wd===6?1:l.shifts, age=(today-d)/864e5, learn=Math.min(1,.86+ (180-age)/180*.14); // лёгкий рост к сегодняшнему дню
      for(let sh=1; sh<=nSh; sh++){
        if(s===T && sh>1) continue;
        const cand=products.filter(p=>p.lineId===l.id); let setup=0;
        if(!cur[l.id]||rnd()<.5){ const np=pick(cand); if(np.id!==cur[l.id]) setup=Math.round(np.setupNorm*(.8+rnd()*(.5+age/180*1.8))); cur[l.id]=np.id; }
        const brk=rnd()<.035, down=brk?120+Math.round(rnd()*200):Math.round(rnd()*rnd()*70);
        const avail=Math.max(0,1-(setup+down)/480);
        const good=Math.round(l.cap*avail*(.8+rnd()*.2)*learn);
        const defect=Math.round(good*(.006+rnd()*rnd()*.05));
        const o=orders.find(o=>o.productId===cur[l.id]&&o.created<=s&&s<=o.due);
        output.push({id:'R'+output.length,date:s,shift:sh,lineId:l.id,productId:cur[l.id],orderId:o?o.id:'',good,defect,reason:defect?reason():'',setup,downtime:down,operator:pick(ops),ts:d.getTime()+sh});
      }
    });
  }
  orders.forEach((o,i)=>{ const done=output.filter(r=>r.orderId===o.id).reduce((a,r)=>a+r.good,0); o.qty=Math.max(5000,Math.round(done*(o.due<T?(i%4===0?1.08:.97):1.25+rnd()*.5)/1000)*1000); });
  const stock=[
    ['Краски','Краска УФ, чёрная','кг',38,20],['Краски','Краска УФ, белая кроющая','кг',64,40],['Краски','Краска УФ, Pantone 185 C','кг',6,10],['Краски','Краска УФ, Pantone 300 C','кг',14,10],['Краски','Офсетная краска, CMYK (комплект)','компл.',5,4],
    ['Расходники','Растворитель / смывка','л',42,30],['Расходники','Трафаретная сетка 120 нит.','м²',9,12],['Расходники','Ракель 75 Shore','м',18,10],['Расходники','Термотрансферная плёнка','рул.',11,8],
    ['Тара (нераскрашенная)','Ведро 10 л, белое','шт',18400,15000],['Тара (нераскрашенная)','Ведро 5 л, белое','шт',9200,12000],['Тара (нераскрашенная)','Банка 0,9 л','шт',41000,25000],['Тара (нераскрашенная)','Крышка 82 мм','шт',66000,40000]
  ].map(([cat,name,unit,qty,min],i)=>({id:'S'+i,cat,name,unit,qty,min}));
  const members=[{id:'admin',login:'admin',name:'Администратор',password:'1234',role:'admin'},{id:'olga',login:'olga',name:'Ольга Петренко',password:'1234',role:'master'},{id:'andriy',login:'andriy',name:'Андрей Иванов',password:'1234',role:'operator'},{id:'marina',login:'marina',name:'Марина Коваль',password:'1234',role:'technologist'}];
  return {lines,products,orders,stock,output,members,settings:{...DEFAULT_SETTINGS}};
}

}
const amsg=t=>{ const m=$('#aMsg'); if(m){ m.textContent=t; m.className='msg err'; } };
const cleanLogin=v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
function doLogin(){
  const l=cleanLogin($('#aLogin').value), u=_users[l];
  if(!u||String(u.password)!==$('#aPass').value) return amsg('Неверный логин или пароль');
  try{ localStorage.setItem('pdd_session',l); }catch(e){}
  openData(l);
}
async function doSetup(){
  const orgName=$('#sOrgN').value.trim()||'Моё производство', name=$('#sName').value.trim(), login=cleanLogin($('#sLogin').value), pass=$('#sPass').value;
  if(!name||!login) return amsg('Заполните имя и логин (латиница, цифры)');
  if(pass.length<4) return amsg('Пароль минимум 4 символа');
  try{ $('#aBtn').disabled=true;
    await fdb.ref(`${ROOT}/users/${login}`).set({id:login,login,name,password:pass,role:'admin'});
    await fdb.ref(`${ROOT}/data/settings`).set({...DEFAULT_SETTINGS,orgName});
    try{ localStorage.setItem('pdd_session',login); }catch(e){}
    openData(login);
  }catch(e){ amsg('Ошибка записи: '+e.message); $('#aBtn').disabled=false; }
}
function openData(login){
  state.mode='fb'; state.org=ROOT; let first=true;
  if(orgRef) orgRef.off();
  orgRef=fdb.ref(ROOT);
  orgRef.on('value',snap=>{
    const v=snap.val()||{}, d=v.data||{}, arr=o=>Object.entries(o||{}).map(([id,x])=>({...x,id}));
    const me=v.users?.[login]; if(!me){ toast('Пользователь удалён'); logout(); return; }
    DB={lines:arr(d.lines),products:arr(d.products),orders:arr(d.orders),stock:arr(d.stock),output:arr(d.output),
        members:arr(v.users),settings:{...DEFAULT_SETTINGS,...(d.settings||{})}};
    state.me={id:login,name:me.name,email:login,role:me.role};
    if(first){ first=false; enterApp(); }
    else { $('#meName').textContent=me.name; $('#meRole').textContent=ROLES[me.role]?.n||''; $('#orgName').textContent=DB.settings.orgName; if(!$('#modal').classList.contains('open')) render(); }
  },err=>{ authScreen('offline','Нет доступа к базе: '+err.message); });
}
async function seedLive(){
  if(!confirm('Заполнить базу примером (линии, продукция, склад, 6 месяцев выпуска)?')) return;
  const g=genDemo(), up={}, o=x=>Object.fromEntries(x.map(i=>[i.id,i]));
  ['lines','products','orders','stock','output'].forEach(c=>up[c]=o(g[c]));
  await fdb.ref(`${ROOT}/data`).update(up); toast('Пример загружен');
}
async function clearLive(){
  if(!confirm('Удалить ВСЕ данные: выпуск, заказы, склад, линии и продукцию? Пользователи и настройки останутся.')) return;
  if(prompt('Для подтверждения напишите: УДАЛИТЬ')!=='УДАЛИТЬ') return;
  await fdb.ref(`${ROOT}/data`).update({lines:null,products:null,orders:null,stock:null,output:null}); toast('Данные очищены');
}
function logout(){
  try{ localStorage.removeItem('pdd_session'); }catch(e){}
  if(orgRef){ orgRef.off(); orgRef=null; }
  $('#app').style.display='none';
  if(fdb) authScreen(Object.keys(_users).length?'login':'setup'); else authScreen('demo');
}
async function connect(){
  authScreen('loading');
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fdb=firebase.database(); auth=firebase.auth();
    // анонимный вход, как в FinFlow (если правила базы требуют auth != null)
    if(!auth.currentUser) await Promise.race([auth.signInAnonymously().catch(e=>console.warn('anon auth:',e.message)),wait(6000)]);
    const snap=await Promise.race([fdb.ref(ROOT+'/users').once('value'),wait(9000).then(()=>{ throw new Error('База не ответила за 9 секунд.'); })]);
    _users=snap.val()||{};
    fdb.ref(ROOT+'/users').on('value',x=>{ _users=x.val()||{}; });
    if(!Object.keys(_users).length) return authScreen('setup');
    let sess=null; try{ sess=localStorage.getItem('pdd_session'); }catch(e){}
    if(sess&&_users[sess]) return openData(sess);
    authScreen('login');
  }catch(e){ fdb=null; authScreen('offline',e.message); }
}

// ═════════════════════════════════════════════
//  BOOT
// ═════════════════════════════════════════════
(function boot(){
  if(!window.firebase||!FB_CONFIG.apiKey){ authScreen('demo'); return; }
  connect();
})();
</script>
</body>
