<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Производство день за днём</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --card2:#f7f8fa; --line:#e6e9ef; --line2:#d8dde6;
  --text:#1c2230; --text2:#5b6576; --text3:#98a1b1;
  --brand:#e2462c; --brand2:#ff7a45; --brandBg:rgba(226,70,44,.09);
  --green:#1fa971; --greenBg:rgba(31,169,113,.1); --amber:#e89a12; --amberBg:rgba(232,154,18,.12);
  --blue:#3b7cf6; --blueBg:rgba(59,124,246,.1); --red:#e5484d; --redBg:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.04);
  --side:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(226,70,44,.35)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.15}
.brand-tag{font-size:11px;color:var(--text3);font-weight:600}
.auth h2{font-size:20px;font-weight:800;margin:26px 0 6px}
.auth p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5}
.fg{margin-bottom:13px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fi{width:100%;padding:10px 12px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--brand)}
.fi:disabled{background:var(--card2);color:var(--text2)}
textarea.fi{resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none;line-height:1.45}
.msg.err{display:block;background:var(--redBg);color:var(--red)}
.link{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:var(--card);border-color:var(--line2);color:var(--text)}
.btn-s:hover{border-color:var(--text3)}
.btn-d{background:var(--redBg);color:var(--red)}
.btn-g{background:var(--greenBg);color:var(--green)}
.btn-w{width:100%}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

.app{display:none;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.side .brand{padding:18px 16px 14px}
.nav{flex:1;overflow-y:auto;padding:2px 10px}
.nav-g{font-size:10.5px;font-weight:800;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;padding:13px 10px 5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:var(--text2);font-weight:600;cursor:pointer;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--brandBg);color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--redBg);color:var(--red);border-radius:6px;padding:1px 6px;font-weight:800}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.me-name{font-weight:700;font-size:13px;line-height:1.2}
.me-role{font-size:11px;color:var(--text3)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top .sp{flex:1}
.burger{display:none}
.mode{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
.mode.demo{background:var(--amberBg);color:var(--amber)}
.mode.live{background:var(--greenBg);color:var(--green)}
.content{padding:4px 28px 40px;max-width:1500px;width:100%}

.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card)}
.range{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:3px 8px}
.range input{border:0;background:none;outline:none;padding:4px 2px;font-weight:600;font-size:12.5px}
.range span{color:var(--text3)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-t{font-weight:800;font-size:15px}
.card-s{font-size:12px;color:var(--text3);font-weight:600}
.card-h .sp,.toolbar .sp{flex:1}
.kpi .kl{font-size:12px;color:var(--text2);font-weight:700}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:8px 0 6px;white-space:nowrap}
.kpi .kv small{font-size:13px;color:var(--text3);font-weight:700;letter-spacing:0}
.kd{font-size:11.5px;font-weight:700}
.kd.up{color:var(--green)} .kd.down{color:var(--red)} .kd.flat{color:var(--text3)}
.kpi.accent{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.kpi.accent .kl,.kpi.accent .kv small,.kpi.accent .kd{color:rgba(255,255,255,.9)}
.g2{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.row-gap{margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.hb-top b{font-weight:700}
.hb-top span{color:var(--text2);font-weight:600;white-space:nowrap}
.track{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px}
.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wk .b{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--brandBg)}
.wk .b.top{background:var(--brand)}
.wk small{font-size:11px;color:var(--text3);font-weight:700}
.donut{display:flex;align-items:center;gap:16px}
.dl{flex:1;min-width:0}
.dl div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.dl i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dl span{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{font-weight:800}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sh{background:var(--card2);border-radius:12px;padding:13px}
.sh .n{font-size:12px;font-weight:700;color:var(--text2)}
.sh .v{font-size:19px;font-weight:800;margin:4px 0 2px}
.sh .d{font-size:11.5px;color:var(--text3);font-weight:600}

.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.tw.flush{margin-top:-18px;border-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;background:var(--card2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr:hover td{background:var(--card2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:800;background:var(--card2)}
.ed td{padding:6px 7px;vertical-align:middle}
.ed .fi{padding:7px 8px;font-size:13px;border-radius:8px;min-width:64px}
.ed select.fi{min-width:200px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-green{background:var(--greenBg);color:var(--green)} .t-red{background:var(--redBg);color:var(--red)}
.t-amber{background:var(--amberBg);color:var(--amber)} .t-blue{background:var(--blueBg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--text2)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog .track{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-weight:600;font-size:12.5px;outline:none}
.empty{text-align:center;padding:36px 10px;color:var(--text3);font-weight:600}
.muted{color:var(--text3)}
.hint{font-size:12.5px;color:var(--text2);line-height:1.55}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15);margin-right:6px;flex-shrink:0}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-style:normal;font-weight:800;color:rgba(0,0,0,.55)}
.stn{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--text);color:var(--card);align-items:center;justify-content:center;font-weight:800;font-size:12px}
.note{background:var(--amberBg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:800}
.log{max-height:420px;overflow:auto}
.log div{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.log div small{display:block;color:var(--text3);font-weight:700;font-size:11px}
.log div.meet{background:var(--blueBg);border-radius:8px;padding:9px 10px;border:0;margin:4px 0}

/* gantt */
.gantt{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.g-in{position:relative}
.g-head,.g-row{display:flex}
.g-lab{position:sticky;left:0;z-index:4;width:160px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:9px 12px;font-weight:700;font-size:12.5px;line-height:1.25}
.g-lab small{display:block;color:var(--text3);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lab{overflow:hidden}
.g-days{position:relative;flex-shrink:0}
.g-day{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--text3);font-weight:800;text-align:center;padding-top:5px;line-height:1.2}
.g-day.we{background:var(--card2)}
.g-day.td{color:var(--brand)}
.g-row{height:58px;border-top:1px solid var(--line)}
.g-bar{position:absolute;top:8px;height:34px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:800;padding:3px 7px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);line-height:1.3;z-index:1}
.g-bar small{display:block;font-weight:600;opacity:.9;font-size:10.5px}
.g-bar.conf{outline:2px solid var(--red);outline-offset:1px}
.g-bar.late{box-shadow:inset 0 -3px 0 var(--red),0 1px 3px rgba(0,0,0,.25)}
.g-bar.done{opacity:.55}
.g-ghost{position:absolute;top:46px;height:6px;border-radius:3px;border:1.5px dashed var(--text3);opacity:.8}
.app.full .side{transform:translateX(-100%)} .app.full .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
.app.full .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.app.full .main{margin-left:0} .app.full .burger{display:flex} .app.full .content{max-width:none;padding:4px 18px 40px}
.qt td{vertical-align:middle} .qt td:nth-child(2){white-space:normal;min-width:280px} .qt td:nth-child(2) b{font-size:13px} .qt td:nth-child(8){white-space:normal;min-width:120px} .qt td:nth-child(9){white-space:normal;min-width:150px} .qt td:nth-child(9) .tag{margin:1px 0} .qt tr.q-line td{background:var(--card2);padding:9px 12px;border-top:2px solid var(--line2)} .qt tr.q-run td:first-child{box-shadow:inset 4px 0 0 var(--blue)} .qt tr.q-done{opacity:.5}
.q-arr{white-space:nowrap} .q-arr .btn{padding:3px 8px;margin-right:3px;font-size:13px} .q-arr .btn:disabled{opacity:.25}
.sg td{vertical-align:top;font-size:12px;padding:6px 8px;border-left:1px solid var(--line)} .sg th{border-left:1px solid var(--line)} .sg th.c{text-align:center}
.sg tr.sg-last td{border-bottom:2px solid var(--line2)} .sg-date{font-weight:800;white-space:nowrap;background:var(--card2);font-size:12.5px!important;line-height:1.5} .sg-today td.sg-date,.sg-today td.sg-line{color:var(--brand)}
.sg-line{font-weight:700;white-space:nowrap} .sg-pc{min-width:230px} .sg-fc{min-width:200px;background:rgba(31,169,113,.035)}
.sg-off{background:repeating-linear-gradient(135deg,rgba(120,130,150,.13) 0 4px,transparent 4px 8px);color:var(--text3);text-align:center;vertical-align:middle!important}
.sg-p,.sg-fr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer;padding:2px 0;border-radius:5px} .sg-p:hover,.sg-fr:hover{background:var(--card2)}
.sg-p .sw,.sg-fr .sw{width:8px;height:8px;margin:0;align-self:center} .sg-n{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sg-p small{width:100%;color:var(--text3);padding-left:14px}
.sg-dn{color:var(--red);font-weight:700;cursor:pointer;padding:2px 0} .sg-f.pend{border:1.5px dashed var(--amber);border-radius:7px;padding:3px 5px;margin-bottom:3px;background:var(--amberBg)}
.sg-pl{color:var(--amber);font-weight:700;margin-top:2px} .sg-miss{color:var(--red);font-weight:700} .sg-pct{font-weight:800;margin-top:3px;font-size:11.5px} .sg-pct.ok{color:var(--green)} .sg-pct.mid{color:var(--amber)} .sg-pct.bad{color:var(--red)}
.dc-day{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)} .dc-day:first-child{margin-top:0;border-top:0;padding-top:0} .dc-day.today .dc-dh b{color:var(--brand)}
.dc-dh{font-size:14px;margin-bottom:4px} .dc-ticks{position:relative;height:16px;margin-left:170px;font-size:10.5px;color:var(--text3);font-weight:700}
.dc-ticks span{position:absolute;transform:translateX(-50%)} .dc-ticks span:first-child{transform:none} .dc-ticks span:last-child{transform:translateX(-100%)}
.dc-line{display:flex;align-items:stretch;border-top:1px solid var(--line)} .dc-lab{width:170px;flex-shrink:0;font-size:12.5px;font-weight:800;padding-right:8px} .dc-lab>div{height:34px;display:flex;align-items:center;gap:6px} .dc-lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .dc-lab i{margin-left:auto;font-style:normal;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em} .dc-lab>div+div{border-top:1px dashed var(--line)}
.dc-tracks{flex:1;min-width:0} .dc-tr{position:relative;height:34px} .dc-tr+.dc-tr{border-top:1px dashed var(--line)}
.dc-seg{position:absolute;top:4px;height:26px;border-radius:5px;overflow:hidden;font-size:11px;font-weight:700;color:#fff;padding:0 5px;line-height:26px;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);z-index:1}
.dc-seg.s{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px)} .dc-seg.p{background:#98a1b1;color:#fff}
.dc-seg.pend{opacity:.6;outline:2px dashed var(--amber);outline-offset:-2px}
.dc-off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(120,130,150,.2) 0 3px,transparent 3px 7px)}
.dc-down{position:absolute;top:2px;bottom:2px;background:rgba(229,72,77,.18);border:1px solid rgba(229,72,77,.5);border-radius:4px;font-size:10.5px;color:var(--red);font-weight:700;padding:0 4px;line-height:28px;overflow:hidden;white-space:nowrap}
.dc-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.ex-head,.ex-row{display:grid;grid-template-columns:1fr 80px 124px 130px 36px;gap:6px;align-items:center} .ex-row{margin-bottom:6px} .ex-head{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;margin-bottom:4px}

let DB = emptyDB();
function emptyDB(){ const d={members:[],settings:{},approved:{}}; COLS.forEach(c=>d[c]=[]); return d; }
const state = {sec:'dashboard', me:{id:'',name:'',role:'viewer'}, mode:'demo', preset:'month', from:'', to:'', lineF:'', groupBy:'project',
  planMonth:'', planTab:'live', planView:'rows', stockTab:'raw', rawCat:'', scnId:'', q:'', draft:null, back:null};
let auth=null, fdb=null, orgRef=null;

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const P = (n,d=1) => (isFinite(n)?n:0).toFixed(d).replace('.',',')+'%';
const short = n => n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'М':n>=1e3?Math.round(n/1e3)+'к':Math.round(n)+'';

const QU = (n,u) => u==='шт'?N(n):Q(n);
const money = n => (+n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(DB.settings.currency||'€');

const pd = s => { const [a,b,c]=s.split('-'); return new Date(+a,b-1,+c); };
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const span = (a,b) => Math.round((pd(b)-pd(a))/864e5)+1;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone = o => o===undefined?undefined:JSON.parse(JSON.stringify(o));
const A = x => Array.isArray(x) ? x.filter(v=>v!=null) : x ? Object.values(x) : [];
const H = 3600e3;
const tms = s => new Date(s).getTime();
const toDT = ms => { const d=new Date(ms); return iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fdate = s => { const d=pd(s); return d.getDate()+' '+MON[d.getMonth()]; };
const fdt = ms => { const d=new Date(ms); return d.getDate()+' '+MON[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const fts = ts => { const d=new Date(ts), t=iso(new Date()); return (iso(d)===t?'сегодня':fdate(iso(d)))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

const projName = id => byId(DB.projects,id)?.name || '—';
const rawName = id => byId(DB.raw,id)?.name || '—';
const COLORS = ['#e2462c','#3b7cf6','#1fa971','#e89a12','#8b5cf6','#ec4899','#14b8a6','#64748b','#0ea5e9','#a16207'];
const hashC = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const avColor = hashC;
const pColor = p => p?.color || hashC(p?.id||'x');
const planHours = (p,qty) => p ? (+p.setupMin||0)/60 + (+qty||0)/Math.max(1,(+p.speed||1)*60) : 0;
const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

// ── Ввод с клавиатуры: изменения в полях даты/времени применяются, когда ввод закончен (Tab, Enter, клик в другое место)
(function(){
  const DT='input[type=date],input[type=datetime-local],input[type=time]';
  const pend=new WeakSet(), lastKey=new WeakMap(); let replay=false, down=null;
  const isDT=t=>t&&t.matches&&t.matches(DT);
  function flush(t){ if(!pend.has(t)) return; pend.delete(t); replay=true; try{ t.dispatchEvent(new Event('change',{bubbles:true})); } finally{ replay=false; } }
  // запоминаем, на какую кнопку нажали — если перерисовка экрана её уберёт, нажмём её заново
  document.addEventListener('mousedown',e=>{ const el=e.target.closest&&e.target.closest('[onclick],button'); down=el?{el,key:el.id||el.getAttribute('onclick'),t:Date.now()}:null; },true);
  function reclick(){ const d=down; if(!d||Date.now()-d.t>1500||d.el.isConnected||!d.key) return; down=null;
    const nb=document.getElementById(d.key)||[...document.querySelectorAll('[onclick]')].find(x=>x.getAttribute('onclick')===d.key); if(nb) nb.click(); }
  document.addEventListener('keydown',e=>{ const t=e.target; if(!isDT(t)) return; lastKey.set(t,Date.now()); if(e.key==='Enter'&&pend.has(t)){ e.preventDefault(); flush(t); } },true);
  document.addEventListener('change',e=>{ const t=e.target; if(replay) return;
    if(isDT(t)&&Date.now()-(lastKey.get(t)||0)<3000){ e.stopImmediatePropagation(); pend.add(t); return; } // набор с клавиатуры — ждём окончания
    setTimeout(reclick,0); },true);
  document.addEventListener('focusout',e=>{ const t=e.target; if(isDT(t)&&pend.has(t)){ flush(t); setTimeout(reclick,0); } },true);
  // числа: запятая = точка, пробелы и лишние символы убираем
  document.addEventListener('input',e=>{ const t=e.target; if(!t.hasAttribute||!t.hasAttribute('data-num')) return;
    let v=t.value.replace(/[\s ]/g,'').replace(/,/g,'.').replace(/[^0-9.\-]/g,''); const i=v.indexOf('.'); if(i>=0) v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,''); v=v.replace(/(?!^)-/g,'');
    if(v!==t.value){ const pos=t.selectionStart-(t.value.length-v.length); t.value=v; try{ t.setSelectionRange(Math.max(0,pos),Math.max(0,pos)); }catch(_){} } },true);
})();

function unitCost(kind,id,seen=new Set()){
  if(kind==='raw') return +byId(DB.raw,id)?.cost||0;
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return 0;
  const ns=new Set(seen); ns.add(id);
  return A(s.items).reduce((a,it)=>a+(+it.qty||0)*unitCost(it.kind,it.id,ns),0)/(+s.yield||1);
}
function expand(kind,id,qty,acc={},seen=new Set()){
  if(!id) return acc;
  if(kind==='raw'){ acc[id]=(acc[id]||0)+qty; return acc; }
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return acc;
  const ns=new Set(seen); ns.add(id); const f=qty/(+s.yield||1);
  A(s.items).forEach(it=>expand(it.kind,it.id,(+it.qty||0)*f,acc,ns));
  return acc;
}
function semiContains(semiId,target,seen=new Set()){
  const s=byId(DB.semis,semiId); if(!s||seen.has(semiId)) return false; seen.add(semiId);
  return A(s.items).some(it=>it.kind==='semi'&&(it.id===target||semiContains(it.id,target,seen)));
}
// потребность проекта: сырьё (через рецептуры станций) + тара 1 шт на изделие
function projectReq(p,qty,withTare=true){
  const acc={};
  A(p.stations).forEach(st=>{ if(st.semiId&&+st.norm) expand('semi',st.semiId,(+st.norm)*qty/1e6,acc); });
  if(withTare&&p.tareId) acc[p.tareId]=(acc[p.tareId]||0)+qty;
  return acc;
}
const stationKg = (norm,qty) => (+norm||0)*(+qty||0)/1e6;
function projectCost1000(p){ return A(p.stations).reduce((a,st)=>a+stationKg(st.norm,1000)*unitCost('semi',st.semiId),0); }
function projectKg1000(p){ return A(p.stations).reduce((a,st)=>a+stationKg(st.norm,1000),0); }
const semiName = id => byId(DB.semis,id)?.name || '—';
const semiColor = id => byId(DB.semis,id)?.color || '#ddd';
function stationDots(p){ return `<span class="dots">${A(p.stations).map((st,i)=>`<i style="background:${semiColor(st.semiId)}" data-tip="${i+1}: ${esc(semiName(st.semiId))}"></i>`).join('')}</span>`; }

//  METRICS — план берётся из утверждённого плана месяца, иначе из мощности линий

function planDay(ds,lineId){
  const ap=DB.approved?.[ds.slice(0,7)], lf=lineId||state.lineF;
  if(ap&&A(ap.items).length){
    const d0=pd(ds).getTime(), d1=d0+864e5; let s=0;
    A(ap.items).forEach(it=>{ if(lf&&it.lineId!==lf) return; const segs=A(it.segs).filter(x=>x.k==='r'), tot=segs.reduce((a,x)=>a+(x.b-x.a),0);
      if(tot) segs.forEach(x=>{ s+=(+it.qty||0)*Math.max(0,Math.min(x.b,d1)-Math.max(x.a,d0))/tot; });
      else { const a=tms(it.start), b=a+(+it.hours||0)*H, ov=Math.max(0,Math.min(b,d1)-Math.max(a,d0)); if(ov&&+it.hours) s+=(+it.qty||0)*ov/((+it.hours)*H); } });
    return s;
  }
  const wd=pd(ds).getDay(); if(!(DB.settings.workDays||[1,2,3,4,5]).includes(wd)) return 0;
  const k=DB.settings.planFactor??0.85;
  return DB.lines.filter(l=>!lf||l.id===lf).reduce((s,l)=>s+(+l.cap||0)*(+l.shifts||1)*k,0);
}
function planRange(f,t,lineId){ let s=0; for(let d=pd(f); iso(d)<=t; d=addD(d,1)) s+=planDay(iso(d),lineId); return s; }
function metrics(recs,f,t){
  const good=recs.reduce((s,r)=>s+(+r.good||0),0), defect=recs.reduce((s,r)=>s+(+r.defect||0),0);
  const down=recs.reduce((s,r)=>s+(+r.downtime||0),0), setup=recs.reduce((s,r)=>s+(+r.setup||0),0);
  const smap={}; recs.forEach(r=>{ const k=r.date+'|'+r.shift+'|'+r.lineId; smap[k]=Math.max(smap[k]||0,+r.shiftMin||(DB.settings.shiftHours||8)*60); }); const shiftsN=Object.keys(smap).length, totMin=Object.values(smap).reduce((a,b)=>a+b,0), plan=planRange(f,t);
  return {good,defect,down,setup,shiftsN,plan, planPct:plan?good/plan*100:0, defPct:good+defect?defect/(good+defect)*100:0,
    perShift:shiftsN?good/shiftsN:0, setupPct:shiftsN?setup/totMin*100:0, avail:shiftsN?(1-(down+setup)/totMin)*100:0};
}
function delta(cur,prev,lowerBetter){
  if(!prev) return `<div class="kd flat">нет данных за пред. период</div>`;
  const d=(cur-prev)/prev*100, good=lowerBetter?d<0:d>0;
  if(Math.abs(d)<0.5) return `<div class="kd flat">≈ как в пред. периоде</div>`;
  return `<div class="kd ${good?'up':'down'}">${d>0?'▲':'▼'} ${P(Math.abs(d),0)} к пред. периоду</div>`;
}

//  SCHEDULER — календарь линий: смены, дни, простои; паузы — только вручную
// ═════════════════════════════════════════════
const hm = s => { const [h,m]=String(s||'0:0').split(':').map(Number); return (h||0)*60+(m||0); };
const LIVE = {id:'live'};
const ctxItems = ctx => ctx&&ctx.items ? ctx.items : DB.plan;
const ctxDowns = ctx => ctx&&ctx.downs ? ctx.downs : DB.downs;
function shiftSchemes(){ const s=A(DB.settings.shiftSchemes).filter(x=>x&&A(x.shifts).length); return s.length?s:DEFAULT_SETTINGS.shiftSchemes; }
function lineScheme(lineId){ const l=byId(DB.lines,lineId), sc=shiftSchemes(); return sc.find(x=>x.id===l?.scheme)||sc[0]; }
function lineShiftDefs(lineId){ return A(lineScheme(lineId).shifts).map((s,i)=>({...s,n:i+1})); }
function lineCfg(lineId,ctx){
  const l=byId(DB.lines,lineId)||{}, ov=ctx&&ctx.lineShifts?A(ctx.lineShifts[lineId]):[];
  const all=lineShiftDefs(lineId).map(s=>s.n), sh=(ov.length?ov:A(l.workShifts)).map(Number).filter(n=>all.includes(n));
  return {shifts:sh.length?sh:all, days:A(l.workDays).length?A(l.workDays).map(Number):[0,1,2,3,4,5,6], restart:+l.restartMin||0};
}
const shiftLabel = (lineId,ctx) => { const c=lineCfg(lineId,ctx), all=lineShiftDefs(lineId).length; return `${lineScheme(lineId).name} · ${c.shifts.length===all?(all===1?'1 смена':'все '+all+' смены'):c.shifts.length===1?'только '+c.shifts[0]+'-я смена':'смены '+c.shifts.join('+')}`; };
function lineWindows(lineId,from,to,ctx){
  const cfg=lineCfg(lineId,ctx), w=[], d=new Date(from); d.setHours(0,0,0,0); d.setDate(d.getDate()-1);
  for(; d.getTime()<to; d.setDate(d.getDate()+1)){
    if(!cfg.days.includes(d.getDay())) continue;
    const base=d.getTime();
    lineShiftDefs(lineId).forEach(s=>{ if(!cfg.shifts.includes(+s.n)) return; const a=base+hm(s.from)*60e3; let b=base+hm(s.to)*60e3; if(b<=a) b+=864e5; w.push([a,b]); });
  }
  w.sort((x,y)=>x[0]-y[0]); const m=[];
  w.forEach(x=>{ const l=m[m.length-1]; if(l&&x[0]<=l[1]) l[1]=Math.max(l[1],x[1]); else m.push([x[0],x[1]]); });
  let res=m;
  ctxDowns(ctx).filter(dn=>dn.lineId===lineId).forEach(dn=>{ const da=tms(dn.start), db=tms(dn.end), nx=[];
    res.forEach(([a,b])=>{ if(db<=a||da>=b){ nx.push([a,b]); return; } if(da>a) nx.push([a,da]); if(db<b) nx.push([db,b]); }); res=nx; });
  return res.filter(([a,b])=>b>from&&a<to);
}
const _sch = new Map();
const PAUSE_KINDS=['Обед','Уборка','Пересменка','Подсчёт материалов','Мойка / промывка','Смена цвета'];
// рабочие окна линии по сменам (не склеиваем — нужны начала смен), минус простои
function shiftWins(lineId,from,to,ctx){
  const cfg=lineCfg(lineId,ctx), w=[], d=new Date(from); d.setHours(0,0,0,0); d.setDate(d.getDate()-1);
  for(; d.getTime()<to; d.setDate(d.getDate()+1)){
    if(!cfg.days.includes(d.getDay())) continue; const base=d.getTime();
    lineShiftDefs(lineId).forEach(s=>{ if(!cfg.shifts.includes(+s.n)) return; const a=base+hm(s.from)*60e3; let b=base+hm(s.to)*60e3; if(b<=a) b+=864e5; w.push([a,b,a]); });
  }
  w.sort((x,y)=>x[0]-y[0]); let res=w;
  ctxDowns(ctx).filter(dn=>dn.lineId===lineId).forEach(dn=>{ const da=tms(dn.start), db=tms(dn.end), nx=[];
    res.forEach(([a,b,s0])=>{ if(db<=a||da>=b){ nx.push([a,b,s0]); return; } if(da>a) nx.push([a,da,s0]); if(db<b) nx.push([db,b,-1]); }); res=nx; });

// Позиция плана: первичная наладка → работа (кол-во / скорость). Никаких автоматических добавок:
// паузы (обед, уборка, пересменка, подсчёт…) технолог добавляет сам в деталях позиции.
//   • с временем (12:00) — в это время; «каждую смену» — каждый день в это время
//   • без времени, «каждую смену» — в начале каждой смены, в которую идёт работа
//   • без времени, разово — в конце позиции

          const lim=Math.min(wb,occ.length?occ[0].at:wb), cur=need[0], d=Math.min(cur.m,(lim-a)/60e3);

const itemSegs = (it,ctx) => it.fixed ? A(it.segs).map(s=>[+s.a,+s.b,s.k,s.l||'']) : sched(it,ctx).segs;
const itemStart = (it,ctx) => it.fixed ? (+it.startMs||tms(it.start)) : sched(it,ctx).start;

// очередь линии: каждый следующий проект стартует, когда закончился предыдущий (или не раньше заданного времени)

function monthGeo(){ const [y,m]=state.planMonth.split('-').map(Number), days=new Date(y,m,0).getDate(), t0=new Date(y,m-1,1).getTime(), t1=new Date(y,m,1).getTime(), HW=2, DW=48; return {y,m,days,t0,t1,HW,DW,W:days*DW}; }

// сдвигает позиции линии вперёд, если они налезают друг на друга

function compactLine(items,lineId,ctx){

    if(k&&Math.abs(tms(it.start)-prevEnd)>60e3&&endMs(it,ctx)>Date.now()){ it.start=toDT(prevEnd); changed.push(it); }

}
function overlapsCount(items,ctx){ let n=0; DB.lines.forEach(l=>{ let pe=0; items.filter(i=>i.lineId===l.id).sort((a,b)=>itemStart(a,ctx)-itemStart(b,ctx)).forEach(it=>{ if(pe&&itemStart(it,ctx)<pe-60e3&&endMs(it,ctx)>Date.now()) n++; pe=Math.max(pe,endMs(it,ctx)); }); }); return n; }
function lineEnd(lineId,exceptId,ctx){ const its=ctxItems(ctx).filter(i=>i.lineId===lineId&&i.id!==exceptId); return its.length?Math.max(...its.map(i=>endMs(i,ctx))):null; }
function orderFinish(o,ctx){ const its=ctxItems(ctx).filter(i=>i.orderId===o.id); return its.length?Math.max(...its.map(i=>endMs(i,ctx))):null; }
function itemFact(it){
  const all=DB.output.filter(r=>r.planItemId===it.id), rs=all.filter(r=>r.approved!==false), st=rs.map(r=>tms(r.startAt)).filter(isFinite), en=rs.map(r=>tms(r.endAt)).filter(isFinite);
  return {good:rs.reduce((a,r)=>a+(+r.good||0),0),defect:rs.reduce((a,r)=>a+(+r.defect||0),0),pending:all.filter(r=>r.approved===false).reduce((a,r)=>a+(+r.good||0),0),start:st.length?Math.min(...st):null,end:en.length?Math.max(...en):null,recs:rs};
}
const runFor = it => DB.runs.find(r=>r.planItemId===it.id);
function itemStatus(it,ctx,chk){
  const f=itemFact(it), q=+it.qty||0, now=Date.now(), a=itemStart(it,ctx), b=endMs(it,ctx), o=byId(DB.orders,it.orderId), late=!!(o&&b>pd(o.due).getTime()+864e5);
  const segs=itemSegs(it,ctx).filter(x=>x[2]==='r'), tot=segs.reduce((s,x)=>s+(x[1]-x[0]),0), el=segs.reduce((s,x)=>s+Math.max(0,Math.min(now,x[1])-x[0]),0), exp=tot?q*el/tot:0;

  else if(q&&f.good>=q*0.98) st=['Выполнено','t-green'];
  else if(now>=b&&f.good>=q*0.85) st=['Нет тех. отчёта','t-amber'];
  else if(now<a) st=chk&&chk.lacks&&chk.lacks.length?['Ждёт сырьё','t-amber']:['Ожидает','t-gray'];

}

//  MATERIALS — резерв сырья: выпущенное без тех. отчёта + оставшийся объём позиций плана
// ═════════════════════════════════════════════
let _res=null;
function reservedCached(){ if(!_res) _res=reservedByRaw(); return _res; }
function activePlanReq(ctx){
  const today=iso(new Date()), made={};
  DB.output.forEach(o=>{ if(o.planItemId) made[o.planItemId]=(made[o.planItemId]||0)+(+o.good||0)+(+o.defect||0); });
  return ctxItems(ctx).map(it=>{ const p=byId(DB.projects,it.projectId); if(!p) return null; const run=runFor(it); if(run&&run.writtenOff) return null;
    const done=made[it.id]||0, ended=endMs(it,ctx)<Date.now(); if(ended&&done>0) return null;
    const rest=Math.max(0,(+it.qty||0)-done); if(rest<=0) return null;
    const s=iso(new Date(itemStart(it,ctx))); return {it,p,d:s<today?today:s,overdue:ended,rest,req:projectReq(p,rest)}; })
    .filter(Boolean).sort((x,y)=>x.d.localeCompare(y.d)||String(x.it.start).localeCompare(String(y.it.start)));
}
function demandForecast(ctx){
  const rows={}, res=reservedCached();
  DB.raw.forEach(r=>rows[r.id]={r,stock:+r.qty||0,reserved:res[r.id]||0,need:0,incoming:0,events:[]});
  activePlanReq(ctx).forEach(({it,d,req})=>Object.entries(req).forEach(([rid,q])=>{ if(rows[rid]){ rows[rid].need+=q; rows[rid].events.push({d,q:-q,it}); } }));
  DB.supplies.filter(s=>s.status!=='received').forEach(s=>{ if(rows[s.rawId]){ rows[s.rawId].incoming+=+s.qty||0; rows[s.rawId].events.push({d:s.date,q:+s.qty||0}); } });
  Object.values(rows).forEach(x=>{
    x.events.sort((a,b)=>a.d.localeCompare(b.d)||b.q-a.q);
    let bal=x.stock-x.reserved; x.deficitDate=bal<-1e-6?iso(new Date()):null; x.maxLack=bal<0?-bal:0;
    x.events.forEach(e=>{ bal+=e.q; if(bal<-1e-6){ if(!x.deficitDate) x.deficitDate=e.d; x.maxLack=Math.max(x.maxLack,-bal); } });
    x.end=bal;
  });
  return rows;
}
function planMaterialCheck(ctx){
  const sup=DB.supplies.filter(s=>s.status!=='received'), used={...reservedCached()}, res={};
  const supBy=(rid,d)=>sup.filter(s=>s.rawId===rid&&s.date<=d).reduce((a,s)=>a+(+s.qty||0),0);
  activePlanReq(ctx).forEach(({it,d,req})=>{
    const lacks=[];
    Object.entries(req).forEach(([rid,need])=>{
      const base=(+byId(DB.raw,rid)?.qty||0)-(used[rid]||0);
      if(base+supBy(rid,d)<need-1e-6){
        const when=[...new Set(sup.filter(s=>s.rawId===rid).map(s=>s.date))].sort().find(dd=>base+supBy(rid,dd)>=need-1e-6)||null;
        lacks.push({rid,need,lack:need-base-supBy(rid,d),when});
      }
      used[rid]=(used[rid]||0)+need;
    });
    res[it.id]={lacks,ready:lacks.length?(lacks.every(l=>l.when)?lacks.map(l=>l.when).sort().pop():null):d};
  });
  return res;
}
function matTag(chk){
  if(!chk) return '<span class="tag t-gray">выполнено</span>';
  if(!chk.lacks.length) return '<span class="tag t-green">сырьё есть</span>';
  const tip=chk.lacks.map(l=>`${esc(rawName(l.rid))}: не хватает ${QU(l.lack,byId(DB.raw,l.rid)?.unit)} ${esc(byId(DB.raw,l.rid)?.unit||'')}${l.when?' (поставка '+fdate(l.when)+')':''}`).join('<br>');
  return chk.ready?`<span class="tag t-amber" data-tip="${tip}">дефицит · будет ${fdate(chk.ready)}</span>`:`<span class="tag t-red" data-tip="${tip}">дефицит · нет поставки</span>`;
}

function buckets(f,t){
  const n=span(f,t), mode=n<=62?'day':n<=400?'week':'month', out=[]; let cur=null;
  for(let d=pd(f); iso(d)<=t; d=addD(d,1)){
    const s=iso(d); let key,label;
    if(mode==='day'){ key=s; label=n<=14?WD[(d.getDay()+6)%7]+' '+d.getDate():String(d.getDate()); }
    else if(mode==='week'){ const m=addD(d,-((d.getDay()+6)%7)); key=iso(m); label=fdate(key); }
    else { key=s.slice(0,7); label=MON[d.getMonth()]; }
    if(!cur||cur.key!==key){ cur={key,label,from:s,to:s,good:0,defect:0,plan:0}; out.push(cur); }
    cur.to=s; cur.plan+=planDay(s);
  }
  const map={}; out.forEach(b=>{ for(let d=pd(b.from); iso(d)<=b.to; d=addD(d,1)) map[iso(d)]=b; });
  filtered(inRange(f,t)).forEach(r=>{ const b=map[r.date]; if(b){ b.good+=+r.good||0; b.defect+=+r.defect||0; } });
  return {mode,data:out};
}
function barChart(el,{data}){
  const W=Math.max(el.clientWidth,280), Hh=270, pl=44, pr=8, pt=12, pb=28, iw=W-pl-pr, ih=Hh-pt-pb;

  const y=v=>pt+ih-(v/max)*ih, bw=iw/data.length, gap=Math.min(bw*.28,10), step=Math.ceil(data.length/(iw/44));
  let s=`<svg width="${W}" height="${Hh}">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--text3)" font-weight="600">${short(v)}</text>`; }
  data.forEach((d,i)=>{
    const x=pl+i*bw+gap/2, w=Math.max(bw-gap,1), yg=y(d.good), yd=y(d.good+d.defect);
    s+=`<rect x="${x}" y="${yg}" width="${w}" height="${pt+ih-yg}" rx="${Math.min(3,w/3)}" fill="var(--brand)"/>`;
    if(d.defect) s+=`<rect x="${x}" y="${yd}" width="${w}" height="${yg-yd}" fill="var(--amber)"/>`;
    if(i%step===0) s+=`<text x="${x+w/2}" y="${Hh-9}" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">${esc(d.label)}</text>`;
    const period=d.from===d.to?fdate(d.from):fdate(d.from)+' — '+fdate(d.to);
    s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="<b>${period}</b><br>Годные: ${N(d.good)} шт<br>Брак: ${N(d.defect)} шт<br>План: ${N(d.plan)} шт${d.plan?' · '+P(d.good/d.plan*100,0):''}"/>`;
  });
  s+=`<polyline points="${data.map((d,i)=>`${pl+i*bw+bw/2},${y(d.plan)}`).join(' ')}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55" style="pointer-events:none"/>`;

function donut(parts,unit='шт брака'){
  const total=parts.reduce((s,p)=>s+p.v,0); if(!total) return `<div class="empty">Нет данных</div>`;

  return `<div class="donut"><svg width="160" height="160" style="flex-shrink:0">${segs}<text x="80" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">${short(total)}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">${unit}</text></svg>
  <div class="dl">${parts.map((p,i)=>`<div><i style="background:${COLORS[i%COLORS.length]}"></i><span>${esc(p.k)}</span><b>${P(p.v/total*100,0)}</b></div>`).join('')}</div></div>`;
}

function semiItemPick(i,v){
  if(v==='__newraw'){ openRawModal(null,r=>{ state.draft.items[i]={kind:'raw',id:r.id,qty:state.draft.items[i].qty||''}; render(); }); return; }
  const [kind,id]=v.split(':'); state.draft.items[i]={...state.draft.items[i],kind:kind||'raw',id:id||''}; renderSemiEdit();
}
function d_item(i,k,v){ state.draft.items[i][k]=v===''?'':+v; renderSemiEdit(); }
function d_itemAdd(){ state.draft.items.push({kind:'raw',id:'',qty:''}); renderSemiEdit(); }
function d_itemDel(i){ state.draft.items.splice(i,1); renderSemiEdit(); }
function dupSemi(){ const d=clone(state.draft); d.id=null; d.name+=' (копия)'; d.history=[]; d.ver=1; state.draft=d; renderSemiEdit(); toast('Создана копия — сохраните её'); }
function semiBack(){ const b=state.back; state.back=null; state.draft=b.draft; state.sec='projectEdit'; render(); }
async function saveSemi(){
  const d=state.draft, items=d.items.filter(it=>it.id&&+it.qty>0).map(it=>({kind:it.kind,id:it.id,qty:+it.qty}));
  if(!d.name.trim()) return toast('Введите название');
  if(!items.length) return toast('Добавьте хотя бы один ингредиент с количеством');
  const old=d.id?byId(DB.semis,d.id):null;
  const rec={...d,id:d.id||uid(),name:d.name.trim(),yield:+d.yield||1,items,updated:iso(new Date()),ver:old?.ver||1,history:A(old?.history)};
  if(old&&(JSON.stringify(A(old.items))!==JSON.stringify(items)||+old.yield!==rec.yield)){
    rec.history=[...A(old.history),{ver:old.ver||1,date:old.updated||iso(new Date()),by:old.by||'',yield:old.yield,items:A(old.items)}].slice(-20);
    rec.ver=(old.ver||1)+1;
  }
  rec.by=state.me.name;
  await Store.put('semis',rec);
  toast(old&&rec.ver>(old.ver||1)?`Сохранено как версия v${rec.ver}`:'Рецептура сохранена');
  if(state.back?.sec==='projectEdit'){ const b=state.back; if(b.station!=null&&b.draft.stations[b.station]) b.draft.stations[b.station].semiId=rec.id; state.back=null; state.draft=b.draft; state.sec='projectEdit'; render(); }
  else { state.draft=clone(rec); render(); }
}

function runOutputs(r){ const linked=DB.output.filter(o=>o.runId&&o.runId===r.id); if(linked.length||r.cancelled) return linked; const ids=A(r.outputIds); return DB.output.filter(o=>ids.includes(o.id)&&!liveRun(o.runId)); }
function runPlanRaw(r){ // плановый расход сырья по нормам: станции + тара
  const q=(+r.qtyGood||0)+(+r.qtyDefect||0), acc={};
  A(r.stations).forEach(st=>{ const kg=stationKg(st.norm,q); Object.entries(st.rawPerKg||{}).forEach(([rid,per])=>acc[rid]=(acc[rid]||0)+per*kg); });
  if(r.tareId) acc[r.tareId]=(acc[r.tareId]||0)+q;
  return acc;
}
function runTotals(r){
  const q=(+r.qtyGood||0)+(+r.qtyDefect||0), plan=runPlanRaw(r), fact=r.rawFact||{}; let cp=0, cf=0, kgP=0, kgF=0, filled=0;
  Object.keys({...plan,...fact}).forEach(rid=>{ const raw=byId(DB.raw,rid), c=+raw?.cost||0, p=plan[rid]||0, f=fact[rid]; cp+=p*c; if(raw?.unit==='кг'||raw?.unit==='л'){ kgP+=p; }

}

function runRecalc(d){

const canApprove = () => ['admin','technologist'].includes(state.me.role);
const outOk = r => r.approved!==false;
const nv = v => { const x=+String(v??'').replace(/\s/g,'').replace(',','.'); return isFinite(x)?x:0; };
function plRange(){ const t=new Date(); if(!state.plFrom) state.plFrom=iso(addD(t,-1)); if(!state.plTo) state.plTo=iso(addD(t,10)); if(state.plTo<state.plFrom) state.plTo=state.plFrom; return {a:pd(state.plFrom).getTime(), b:pd(state.plTo).getTime()+864e5}; }
function plDays(){ const r=[]; for(let d=pd(state.plFrom); iso(d)<=state.plTo&&r.length<62; d=addD(d,1)) r.push(iso(d)); return r; }
const dayStartMin = () => hm(A(shiftSchemes()[0].shifts)[0]?.from||'07:00');
const dayStartLabel = () => { const m=dayStartMin(); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const lineQueue = lineId => DB.plan.filter(i=>i.lineId===lineId).sort((x,y)=>seqOf(x)-seqOf(y)||itemStart(x,LIVE)-itemStart(y,LIVE));
function itemRisk(it,chk){
  const o=byId(DB.orders,it.orderId), a=itemStart(it,LIVE), e=endMs(it,LIVE), x=itemStatus(it,LIVE,chk), s=sched(it,LIVE), out=[];
  if(!s.ok) out.push(['Не помещается','t-red','не хватает рабочего времени линии в ближайшие недели']);
  if(o&&e>pd(o.due).getTime()+864e5) out.push(['Не успеваем к отгрузке','t-red',`окончание ${fdt(e)}<br>срок отгрузки ${fdate(o.due)}`]);
  if(chk&&chk.lacks.length&&(!chk.ready||pd(chk.ready).getTime()>a)) out.push([chk.ready?'Сырьё позже старта':'Нет сырья',chk.ready?'t-amber':'t-red',chk.ready?`старт ${fdt(a)}, сырьё будет ${fdate(chk.ready)}`:'поставка не запланирована']);
  if(/Отстаём|Не добрали/.test(x.st[0])) out.push([x.st[0],'t-red','по подтверждённому факту']);
  return out;
}
// сохранить изменения очереди: пересчитать цепочку на линиях и записать только изменившиеся позиции
async function qCommit(work,lineIds,extra=[],log){
  const wctx={id:'tmp'+uid(),items:work}; [...new Set(lineIds)].forEach(l=>relineChain(work,l,wctx));
  const ch=work.filter(w=>{ const o=byId(DB.plan,w.id); return !o||JSON.stringify(o)!==JSON.stringify(w); });
  const txt=typeof log==='function'?log(work,wctx):log;
  await Store.batch([...ch.map(x=>({col:'plan',obj:x})),...extra,...(txt?[logEntry(txt)]:[])]);
  return ch;
}
async function qRelineAll(){ const work=DB.plan.map(clone), ch=await qCommit(work,DB.lines.map(l=>l.id),[],'Очередь выстроена заново на всех линиях'); toast('Готово'+(ch.length?` · обновлено позиций ${ch.length}`:'')); }

// ─── 1. очередь по линиям
function planQueue(chk){
  const {a:from}=plRange(), now=Date.now(), ce=can('edit');
  const rows=DB.lines.map(l=>{
    const all=lineQueue(l.id), li=all.filter(i=>endMs(i,LIVE)>=from);
    const last=all[all.length-1];
    const head=`<tr class="q-line"><td colspan="10"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:14px">${esc(l.name)}</b><span class="muted">${esc(shiftLabel(l.id,LIVE))}</span><span class="muted">· в очереди ${li.filter(i=>endMs(i,LIVE)>now).length}${last?` · линия занята до ${fdt(endMs(last,LIVE))}`:''}</span><div style="flex:1"></div>${ce?`<button class="btn btn-s btn-sm" onclick="openQAdd('${l.id}')">+ Проект</button>`:''}</div></td></tr>`;
    const body=li.map(it=>{
      const k=all.indexOf(it), prev=all[k-1], next=all[k+1], p=byId(DB.projects,it.projectId), o=byId(DB.orders,it.orderId), a=itemStart(it,LIVE), e=endMs(it,LIVE), started=a<=now;
      const canUp=ce&&!started&&prev&&itemStart(prev,LIVE)>now, canDn=ce&&!started&&next;
      const f=itemFact(it), q=+it.qty||0, risk=itemRisk(it,chk[it.id]), s=sched(it,LIVE);
      return `<tr class="${ce?'click':''} ${started&&e>now?'q-run':''} ${e<=now?'q-done':''}" onclick="if(!event.target.closest('button'))openQItem('${it.id}')">
        <td class="q-arr">${ce?`<button class="btn btn-s btn-sm" ${canUp?'':'disabled'} onclick="qMove('${it.id}',-1)" title="Выше в очереди">↑</button><button class="btn btn-s btn-sm" ${canDn?'':'disabled'} onclick="qMove('${it.id}',1)" title="Ниже в очереди">↓</button>`:''}</td>
        <td><div style="display:flex;gap:8px;align-items:center"><span class="sw" style="background:${pColor(p)};flex-shrink:0"></span><div><b>${esc(p?.name||'—')}</b><small class="muted" style="display:block">${esc(p?.client||'')}${s.pause?` · паузы ${minTxt(s.pause)}`:''}${started&&e>now?' · <b style="color:var(--blue)">в работе</b>':''}</small></div></div></td>
        <td>${o?esc(o.no):'<span class="muted">—</span>'}</td>
        <td class="num"><b>${N(q)}</b><small class="muted" style="display:block">факт ${N(f.good)}${q?' · '+P(f.good/q*100,0):''}${f.pending?` · ⏳ ${N(f.pending)}`:''}</small></td>
        <td>${fdt(a)}</td>
        <td>${fdt(e)}<small class="muted" style="display:block">${Q((e-a)/H,1)} ч · наладка ${minTxt(s.setup)}</small></td>
        <td>${o?fdate(o.due):'<span class="muted">—</span>'}</td>
        <td>${matTag(chk[it.id])}</td>
        <td>${risk.length?risk.map(r=>`<span class="tag ${r[1]}" data-tip="${r[2]}">${r[0]}</span>`).join(' '):(e<=now?'<span class="tag t-gray">завершён</span>':'<span class="tag t-green">в срок</span>')}</td>
        <td>${ce&&!started?`<button class="btn btn-d btn-sm" onclick="delPlanItem('${it.id}')" title="Удалить из плана">🗑</button>`:''}</td></tr>`;
    }).join('')||`<tr><td colspan="10" class="muted" style="padding:10px 14px">Очередь пуста</td></tr>`;
    return head+body;
  }).join('');
  return `<div class="tw flush"><table class="qt"><tr><th style="width:74px"></th><th>Проект</th><th>Заказ</th><th class="num">Кол-во</th><th>Начало</th><th>Конец</th><th>Срок отгрузки</th><th>Сырьё</th><th>Риск</th><th style="width:44px"></th></tr>${rows}</table></div>`;
}
async function qMove(id,dir){
  const it=byId(DB.plan,id); if(!it) return;
  const work=DB.plan.map(clone), li=work.filter(i=>i.lineId===it.lineId).sort((a,b)=>seqOf(a)-seqOf(b)||tms(a.start)-tms(b.start));
  li.forEach((x,k)=>x.seq=k); const i=li.findIndex(x=>x.id===id), j=i+dir; if(j<0||j>=li.length) return;
  const now=Date.now(); if(itemStart(byId(DB.plan,li[i].id),LIVE)<=now||itemStart(byId(DB.plan,li[j].id),LIVE)<=now) return toast('Проект уже в работе — его место в очереди не меняется');
  const A1=li[i], B1=li[j]; [A1.seq,B1.seq]=[B1.seq,A1.seq]; const first=dir<0?A1:B1, second=dir<0?B1:A1; first.start=[A1.start,B1.start].sort()[0];
  await qCommit(work,[it.lineId],[],`Очередь ${lineName(it.lineId)}: «${projName(first.projectId)}» поставлен перед «${projName(second.projectId)}»`);
}

function qiDiff(o,n){
  const ch=[], p=projName(n.projectId);
  if(o.lineId!==n.lineId) ch.push(`линия ${lineName(o.lineId)} → ${lineName(n.lineId)}`);
  if(+o.qty!==+n.qty) ch.push(`кол-во ${N(o.qty)} → ${N(n.qty)}`);
  if(itemSpeed(o)!==itemSpeed(n)) ch.push(`скорость ${N(itemSpeed(o))} → ${N(itemSpeed(n))} шт/мин`);
  if(itemSetup(o)!==itemSetup(n)) ch.push(`наладка ${N(itemSetup(o))} → ${N(itemSetup(n))} мин`);
  if(!!o.noSetup!==!!n.noSetup) ch.push(n.noSetup?'без наладки':'с наладкой');
  if((o.notBefore||'')!==(n.notBefore||'')) ch.push(n.notBefore?`не раньше ${fdt(tms(n.notBefore))}`:'снято «не раньше»');
  if(o.start!==n.start&&n.start&&tms(n.start)<=Date.now()) ch.push(`начало ${fdt(tms(o.start))} → ${fdt(tms(n.start))}`);
  const ex=x=>A(x.extras).map(e=>`${e.kind} ${e.min} мин${e.time?' в '+e.time:''}${e.every?' каждую смену':''}`).join(', ');
  if(ex(o)!==ex(n)) ch.push(`паузы: ${ex(n)||'нет'}`);
  if((o.orderId||'')!==(n.orderId||'')) ch.push(`заказ ${byId(DB.orders,n.orderId)?.no||'—'}`);
  return `«${p}»: ${ch.join('; ')||'комментарий'}${n.note&&n.note!==o.note?' — '+n.note:''}`;
}

function shiftPlan(lineId,a,b){
  const res=[];
  DB.plan.filter(i=>i.lineId===lineId).forEach(it=>{ let run=0,setup=0,pause=0,x=Infinity,y=0;
    itemSegs(it,LIVE).forEach(([sa,sb,k])=>{ const u=Math.max(sa,a), v=Math.min(sb,b); if(v<=u) return; const m=(v-u)/60e3; if(k==='r') run+=m; else if(k==='s') setup+=m; else pause+=m; x=Math.min(x,u); y=Math.max(y,v); });
    if(run+setup+pause>0) res.push({it,run,setup,pause,x,y,qty:Math.round(run*itemSpeed(it))}); });
  return res.sort((p,q)=>p.x-q.x);
}

function qtyInMonth(it,ctx,t0,t1){ const segs=itemSegs(it,ctx).filter(x=>x[2]==='r'), tot=segs.reduce((s,x)=>s+(x[1]-x[0]),0); if(!tot) return 0; return (+it.qty||0)*segs.reduce((s,x)=>s+Math.max(0,Math.min(x[1],t1)-Math.max(x[0],t0)),0)/tot; }

function planStats(items,ctx,mk){
  const [y,m]=mk.split('-').map(Number), t0=new Date(y,m-1,1).getTime(), t1=new Date(y,m,1).getTime(), mi=monthItems(items,mk,ctx);
  let setup=0, restarts=0; mi.forEach(it=>{ const s=sched(it,ctx); setup+=s.setup; restarts+=s.restarts; });
  const late=DB.orders.filter(o=>{ const e=orderFinish(o,ctx); return e&&e>pd(o.due).getTime()+864e5; });
  const chk=planMaterialCheck(ctx);
  return {out:mi.reduce((a,it)=>a+qtyInMonth(it,ctx,t0,t1),0),setup,restarts,late,deficit:Object.values(chk).filter(c=>c.lacks.length).length,overlaps:overlapsCount(items,ctx)};
}

function renameScenario(id){ const s=byId(DB.scenarios,id); const n=prompt('Название сценария',s.name); if(n&&n.trim()) Store.put('scenarios',{...s,name:n.trim()}); }

async function setScnShift(id,lineId,n,on){
  const s=clone(byId(DB.scenarios,id)); s.lineShifts=s.lineShifts||{}; let cur=lineCfg(lineId,scnCtx(s)).shifts.filter(x=>x!==n); if(on) cur.push(n); cur.sort();

async function applyScenario(id){
  const s=byId(DB.scenarios,id), items=A(s.items), downs=A(s.downs), ls=s.lineShifts||{};
  const lsTxt=Object.entries(ls).filter(([lid,v])=>JSON.stringify(A(v).map(Number))!==JSON.stringify(lineCfg(lid,LIVE).shifts)).map(([lid,v])=>`${lineName(lid)}: смены ${A(v).join('+')}`);
  if(!confirm(`Применить сценарий «${s.name}» к действующему плану?\n\n• позиции плана будут заменены позициями сценария (${items.length})\n• простои сценария добавятся в действующий план (${downs.length})${lsTxt.length?'\n• изменится сменность: '+lsTxt.join(', '):''}\n\nИзменение попадёт в журнал плана.`)) return;

function feasCalc(f){
  const p=byId(DB.projects,f.projectId), qty=+f.qty||0; if(!p||!qty) return;
  const fc=demandForecast(), req=projectReq(p,qty), sup=DB.supplies.filter(s=>s.status!=='received'), today=iso(new Date()), lines=[]; let ready=today, impossible=false;
  Object.entries(req).forEach(([rid,need])=>{
    const x=fc[rid]; if(!x) return; const base=x.stock-x.need, supBy=d=>sup.filter(s=>s.rawId===rid&&s.date<=d).reduce((a,s)=>a+(+s.qty||0),0);
    let when=base+supBy(today)>=need?today:[...new Set(sup.filter(s=>s.rawId===rid).map(s=>s.date))].sort().find(d=>base+supBy(d)>=need), lack=0;
    if(!when){ lack=need-base-supBy('9999'); when=iso(addD(new Date(),+x.r.leadDays||0)); impossible=true; }
    if(when>ready) ready=when;
    lines.push(`<tr><td>${esc(x.r.name)}</td><td class="num">${QU(need,x.r.unit)} ${esc(x.r.unit)}</td><td class="num">${QU(Math.max(0,base+supBy('9999')),x.r.unit)}</td><td>${lack?`<span class="tag t-red">заказать ${QU(lack,x.r.unit)} → ${fdate(when)}</span>`:when===today?'<span class="tag t-green">есть</span>':`<span class="tag t-amber">с ${fdate(when)}</span>`}</td></tr>`);
  });
  const lineFree=lineEnd(p.lineId), startMs=Math.max(pd(ready).getTime(),lineFree||0,Date.now()), s=sched({id:'__feas'+Math.random(),projectId:p.id,lineId:p.lineId,qty,start:toDT(startMs)}), ok=s.end<=pd(f.due).getTime()+864e5;
  $('#feasOut').innerHTML=`<div class="card" style="padding:14px;margin-top:6px;box-shadow:none">
    <div class="stat"><span>Сырьё будет готово</span><b>${fdate(ready)}${impossible?' <span class="tag t-red">нужен дозаказ</span>':''}</b></div>
    <div class="stat"><span>${esc(lineName(p.lineId))} свободна с</span><b>${lineFree?fdt(lineFree):'сейчас'} · ${esc(shiftLabel(p.lineId))}</b></div>
    <div class="stat"><span>Работа / наладка</span><b>${Q(s.run/60,1)} ч / ${N(s.setup)} мин</b></div>
    <div class="stat"><span>Старт → окончание по календарю линии</span><b>${fdt(s.start)} → ${fdt(s.end)}</b></div>
    <div class="stat"><span>Срок ${fdate(f.due)}</span><b>${ok?'<span class="tag t-green">успеваем</span>':'<span class="tag t-red">не успеваем</span>'}</b></div>
    <div class="tw" style="margin:10px -14px -14px"><table><tr><th>Сырьё</th><th class="num">Нужно</th><th class="num">Свободно с учётом плана</th><th>Статус</th></tr>${lines.join('')}</table></div></div>`;
}

//  STOCK — склад: остатки на дату/время, резервы, прогноз, движения за период
// ═════════════════════════════════════════════
const MTYPE={in:['Приход','t-green'],out:['Расход','t-amber'],inv:['Инвентаризация','t-blue'],ship:['Отгрузка','t-gray']};
function fgStock(){ const m={}; DB.output.forEach(r=>{ m[r.projectId]=m[r.projectId]||{made:0,ship:0}; m[r.projectId].made+=+r.good||0; }); DB.moves.filter(x=>x.type==='ship').forEach(x=>{ m[x.projectId]=m[x.projectId]||{made:0,ship:0}; m[x.projectId].ship+=+x.qty||0; }); return m; }
// момент, когда движение проведено по складу
function moveTime(m){
  if(m.at&&isFinite(tms(m.at))) return tms(m.at);
  const ts=+m.ts||0;
  if(ts>1e12&&(m.runId||iso(new Date(ts))===m.date)) return ts;
  return pd(m.date).getTime()+12*H;
}
const moveDelta = m => m.type==='in'?+m.qty||0:m.type==='out'?-(+m.qty||0):m.type==='inv'?+m.qty||0:0;
const outTime = o => { let t=tms(o.endAt); if(!isFinite(t)) t=pd(o.date).getTime()+20*H; const s=+o.ts||0; return s>1e12?Math.min(t,s):t; };
let _wo=null;
function runWoAt(){ // когда тех. отчёт впервые списал сырьё
  if(_wo) return _wo; _wo={};
  DB.moves.forEach(m=>{ if(m.runId&&!m.cancelled){ const t=moveTime(m); if(!_wo[m.runId]||t<_wo[m.runId]) _wo[m.runId]=t; } });
  DB.runs.forEach(r=>{ if(r.writtenOff&&!r.cancelled&&!_wo[r.id]) _wo[r.id]=r.sec?.materials?.ts||tms(r.endAt)||0; });
  return _wo;
}
function stockAt(T){ // остаток по учёту на момент T
  const acc={}; DB.raw.forEach(r=>acc[r.id]=+r.qty||0);
  DB.moves.forEach(m=>{ if(m.rawId&&!m.cancelled&&acc[m.rawId]!=null&&moveTime(m)>T) acc[m.rawId]-=moveDelta(m); });
  return acc;
}
function reserveAt(T,detail){ // выпущено до T, но на момент T ещё не списано тех. отчётом
  const wo=runWoAt(), acc={}, list=[];
  DB.output.forEach(o=>{ if(o.resClosed||outTime(o)>T) return; const w=liveRun(o.runId)?wo[o.runId]:null; if(w&&w<=T) return;
    const req=outputReserve(o); Object.entries(req).forEach(([rid,q])=>acc[rid]=(acc[rid]||0)+q); if(detail) list.push({o,req}); });
  return detail?{acc,list}:acc;
}
function futureReserve(T,detail){ // сырьё под выпуск по действующему плану между «сейчас» и T
  const now=Date.now(), acc={}, list=[]; if(T<=now) return detail?{acc,list}:acc;
  const made={}; DB.output.forEach(o=>{ if(o.planItemId) made[o.planItemId]=(made[o.planItemId]||0)+(+o.good||0)+(+o.defect||0); });
  DB.plan.forEach(it=>{ const p=byId(DB.projects,it.projectId); if(!p) return; const run=runFor(it); if(run&&run.writtenOff) return;
    const rs=itemSegs(it).filter(x=>x[2]==='r'&&x[1]>now); const tot=rs.reduce((a,x)=>a+x[1]-Math.max(x[0],now),0); if(!tot) return;
    const part=rs.reduce((a,x)=>a+Math.max(0,Math.min(x[1],T)-Math.max(x[0],now)),0); if(!part) return;
    const rest=Math.max(0,(+it.qty||0)-(made[it.id]||0)), qty=rest*part/tot; if(qty<1) return;
    const req=projectReq(p,qty); Object.entries(req).forEach(([rid,q])=>acc[rid]=(acc[rid]||0)+q); if(detail) list.push({it,p,qty,req}); });
  return detail?{acc,list}:acc;
}
function suppliesUntil(T){ const acc={}, now=Date.now(); if(T<=now) return acc;
  DB.supplies.filter(s=>s.status!=='received'&&pd(s.date).getTime()+12*H<=T).forEach(s=>acc[s.rawId]=(acc[s.rawId]||0)+(+s.qty||0)); return acc; }
function stockSnapshot(T){
  const future=T>Date.now()+60e3, st=stockAt(Math.min(T,Date.now())), res=reserveAt(Math.min(T,Date.now())), fut=future?futureReserve(T):{}, sup=future?suppliesUntil(T):{};
  return DB.raw.map(r=>{ const s=st[r.id]||0, rs=res[r.id]||0, f=fut[r.id]||0, su=sup[r.id]||0; return {r,stock:s,res:rs,fut:f,sup:su,avail:s+su-rs-f}; });
}

      ${byCat[c].sort((a,b)=>a.r.name.localeCompare(b.r.name)).map(x=>{ const u=x.r.unit, mn=+x.r.min||0;
        return `<tr class="click" onclick="openRawChart('${x.r.id}')"><td><b>${esc(x.r.name)}</b> <span class="muted" style="font-size:11px">📈</span></td><td class="num">${QU(x.stock,u)} ${esc(u)}</td>

  modal('Отгрузка продукции',`<div class="fg"><label class="fl">Проект</label><select class="fi" name="projectId" onchange="this.form.elements.orderId.innerHTML=shipOrderOpts(this.value)">${opts(DB.projects,'',p=>`${p.name} — на складе ${N((fg[p.id]?.made||0)-(fg[p.id]?.ship||0))}`)}</select></div>
    <div class="fg"><label class="fl">Заказ</label><select class="fi" name="orderId">${shipOrderOpts(DB.projects[0]?.id)}</select></div>
    <div class="frow"><div class="fg"><label class="fl">Количество, шт</label><input class="fi" type="text" inputmode="decimal" data-num="1" min="1" name="qty"></div><div class="fg"><label class="fl">Дата</label><input class="fi" type="date" name="date" value="${iso(new Date())}"></div></div>
    <div class="fg"><label class="fl">Накладная / машина</label><input class="fi" name="doc"></div>`,
  async f=>{ if(!(+f.qty)){ toast('Укажите количество'); return false; } await Store.put('moves',{id:uid(),date:f.date,type:'ship',projectId:f.projectId,orderId:f.orderId||'',qty:+f.qty,doc:f.doc,by:state.me.name,ts:Date.now()}); toast('Отгрузка проведена'); },'Отгрузить');

function shipOrderOpts(pid){ return opts(DB.orders.filter(o=>o.projectId===pid&&orderStatus(o)!=='shipped'),'',o=>`${o.no} · ${N(o.qty)} шт · срок ${fdate(o.due)}`,'— без заказа —'); }

function renderOrders(){
  const list=[...DB.orders].sort((a,b)=>a.due.localeCompare(b.due)), s=orderStats();
  const planEnd=o=>orderFinish(o,LIVE);
  $('#content').innerHTML=`<div class="toolbar"><span class="tag t-blue">${s.work} в работе</span><span class="tag t-gray">${s.new} новых</span><span class="tag t-red">${s.overdue} просрочено</span><span class="tag t-green">${s.done+s.shipped} готово</span><div class="sp"></div>${can('edit')?`<button class="btn btn-s" onclick="openShip()">Отгрузка</button><button class="btn btn-p" onclick="openOrderModal()">+ Заказ</button>`:''}</div>
  <div class="card">${list.length?`<div class="tw flush"><table><tr><th>№</th><th>Проект</th><th class="num">Заказано</th><th>Произведено</th><th class="num">Отгружено</th><th>Срок отгрузки</th><th>По плану готово</th><th>Статус</th><th></th></tr>
  ${list.map(o=>{ const d=orderDone(o), sh=orderShipped(o), pct=Math.min(d/o.qty*100,100), st=OST[orderStatus(o)], pe=planEnd(o), late=pe&&pe>pd(o.due).getTime()+864e5, p=byId(DB.projects,o.projectId);
    return `<tr><td><b>${esc(o.no)}</b></td><td>${esc(p?.name||'—')}<div class="muted" style="font-size:12px">${esc(p?.client||'')}</div></td><td class="num">${N(o.qty)}</td>
    <td><div class="prog"><div class="track"><div class="fill" style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--brand)'}"></div></div><span style="font-size:12px;font-weight:700">${N(d)}</span></div></td><td class="num">${N(sh)}</td>
    <td>${fdate(o.due)}</td><td>${pe?`<span class="tag ${late?'t-red':'t-green'}">${fdt(pe)}</span>`:'<span class="muted">не в плане</span>'}</td><td><span class="tag ${st[1]}">${st[0]}</span></td>
    <td>${can('edit')?`<button class="btn btn-s btn-sm" onclick="openOrderModal('${o.id}')">✎</button>`:''}</td></tr>`; }).join('')}
  </table></div>`:'<div class="empty">Заказов пока нет</div>'}</div>`;
}
function openOrderModal(id){
  const o=id?byId(DB.orders,id):{no:'З-'+String(DB.orders.length+101),qty:'',due:iso(addD(new Date(),21)),projectId:DB.projects[0]?.id,note:''};
  modal(id?'Заказ':'Новый заказ',`<div class="frow"><div class="fg"><label class="fl">Номер</label><input class="fi" name="no" value="${esc(o.no)}"></div><div class="fg"><label class="fl">Срок отгрузки</label><input class="fi" type="date" name="due" value="${o.due}"></div></div>
    <div class="fg"><label class="fl">Проект</label><select class="fi" name="projectId">${opts(DB.projects,o.projectId,p=>p.name+(p.client?' · '+p.client:''))}</select></div>
    <div class="fg"><label class="fl">Количество, шт</label><input class="fi" type="text" inputmode="decimal" data-num="1" min="1" name="qty" value="${o.qty}"></div>
    <div class="fg"><label class="fl">Комментарий</label><input class="fi" name="note" value="${esc(o.note||'')}"></div>`,
  async f=>{ if(!(+f.qty)){ toast('Укажите количество'); return false; } await Store.put('orders',{...(id?o:{}),id:id||uid(),no:f.no,due:f.due,projectId:f.projectId,qty:+f.qty,note:f.note}); toast('Заказ сохранён'); },

}

//  REPORTS
// ═════════════════════════════════════════════
const GROUPS = {project:['Проект',r=>projName(r.projectId)],line:['Линия',r=>lineName(r.lineId)],operator:['Оператор',r=>r.operator||'—'],order:['Заказ',r=>byId(DB.orders,r.orderId)?.no||'Без заказа'],day:['День',r=>r.date],shift:['Смена',r=>r.shift+'-я смена']};
function reportRows(){
  const recs=filtered(inRange(state.from,state.to)), fn=GROUPS[state.groupBy][1], m={};
  recs.forEach(r=>{ const k=fn(r), x=m[k]||(m[k]={k,good:0,defect:0,setup:0,down:0,shifts:new Set()}); x.good+=+r.good||0; x.defect+=+r.defect||0; x.setup+=+r.setup||0; x.down+=+r.downtime||0; x.shifts.add(r.date+r.shift+r.lineId); });
  return Object.values(m).sort((a,b)=>state.groupBy==='day'?b.k.localeCompare(a.k):b.good-a.good);
}
function renderReports(){
  const rows=reportRows(), tot=rows.reduce((a,r)=>({good:a.good+r.good,defect:a.defect+r.defect,setup:a.setup+r.setup,down:a.down+r.down}),{good:0,defect:0,setup:0,down:0});
  $('#content').innerHTML = periodBar() + `<div class="toolbar"><span class="fl" style="margin:0">Группировать по</span><select class="sel" onchange="state.groupBy=this.value;render()">${Object.entries(GROUPS).map(([k,[l]])=>`<option value="${k}" ${state.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>${lineFilter()}<div class="sp"></div><button class="btn btn-s" onclick="exportCSV()">⬇ CSV (Excel)</button></div>
  <div class="card">${rows.length?`<div class="tw flush"><table><tr><th>${GROUPS[state.groupBy][0]}</th><th class="num">Смен</th><th class="num">Годные</th><th class="num">Брак</th><th class="num">Брак %</th><th class="num">Наладка, ч</th><th class="num">Простои, ч</th><th class="num">Выработка/смену</th></tr>
  ${rows.map(r=>`<tr><td><b>${esc(state.groupBy==='day'?fdate(r.k):r.k)}</b></td><td class="num">${r.shifts.size}</td><td class="num">${N(r.good)}</td><td class="num">${N(r.defect)}</td><td class="num">${P(r.good+r.defect?r.defect/(r.good+r.defect)*100:0)}</td><td class="num">${Q(r.setup/60,1)}</td><td class="num">${Q(r.down/60,1)}</td><td class="num">${N(r.good/Math.max(r.shifts.size,1))}</td></tr>`).join('')}
  <tfoot><tr><td>Итого</td><td></td><td class="num">${N(tot.good)}</td><td class="num">${N(tot.defect)}</td><td class="num">${P(tot.good+tot.defect?tot.defect/(tot.good+tot.defect)*100:0)}</td><td class="num">${Q(tot.setup/60,1)}</td><td class="num">${Q(tot.down/60,1)}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">Нет данных за период</div>'}</div>`;
}
function exportCSV(){
  const rows=reportRows(), head=[GROUPS[state.groupBy][0],'Смен','Годные','Брак','Брак %','Наладка ч','Простои ч'];
  const csv=[head,...rows.map(r=>[r.k,r.shifts.size,r.good,r.defect,(r.good+r.defect?r.defect/(r.good+r.defect)*100:0).toFixed(2).replace('.',','),(r.setup/60).toFixed(1).replace('.',','),(r.down/60).toFixed(1).replace('.',',')])].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=`proizvodstvo_${state.groupBy}_${state.from}_${state.to}.csv`; a.click();
}

function openUserModal(id){
  const u=id?byId(DB.members,id):{name:'',login:'',password:'',role:'operator'};
  modal(id?'Сотрудник':'Новый сотрудник',`
    <div class="fg"><label class="fl">Имя</label><input class="fi" name="name" value="${esc(u.name)}" autofocus></div>
    <div class="frow"><div class="fg"><label class="fl">Логин</label><input class="fi" name="login" value="${esc(u.login||u.id||'')}" ${id?'disabled':''} placeholder="olga" autocapitalize="off"></div>
    <div class="fg"><label class="fl">Пароль</label><input class="fi" name="password" value="${esc(u.password||'')}" placeholder="минимум 4 символа"></div></div>
    <div class="fg"><label class="fl">Роль</label><select class="fi" name="role" ${id===state.me.id?'disabled':''}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v.n} — ${v.d}</option>`).join('')}</select></div>`,
  async f=>{
    const login=(id||f.login||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
    if(!(f.name||'').trim()||!login){ toast('Нужны имя и логин (латиница, цифры)'); return false; }
    if(!id&&byId(DB.members,login)){ toast('Такой логин уже есть'); return false; }
    if((f.password||'').length<4){ toast('Пароль минимум 4 символа'); return false; }
    const rec={...(id?u:{}),id:login,login,name:f.name.trim(),password:f.password,role:id===state.me.id?u.role:f.role};
    await Store.user(rec);
    if(login===state.me.id){ state.me.name=rec.name; $('#meName').textContent=rec.name; }
    toast('Сохранено');
  });
}
async function removeMember(id){ if(!confirm('Удалить сотрудника?')) return; await Store.user(null,id); toast('Сотрудник удалён'); }

const schemeBlock = s => `<div class="scheme" data-id="${esc(s.id)}"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input class="fi sc-name" value="${esc(s.name)}" style="font-weight:800" placeholder="Название схемы, например «12 часов»">
    <span class="muted" style="font-size:12px;white-space:nowrap">${DB.lines.filter(l=>lineScheme(l.id).id===s.id).map(l=>esc(l.name)).join(', ')||'не используется'}</span>
    <button type="button" class="btn btn-s btn-sm" onclick="schemeDel(this)">✕</button></div>
  <div class="sc-rows">${A(s.shifts).map(shRow).join('')}</div>
  <button type="button" class="btn btn-s btn-sm" onclick="this.previousElementSibling.insertAdjacentHTML('beforeend',shRow({from:'07:00',to:'15:00'}));scRenum(this.closest('.scheme'))">+ Смена</button></div>`;
const shRow = (x,i) => `<div class="sh-row"><b class="sh-n">${(i??0)+1}-я</b><input class="fi sh-f" type="time" value="${x.from}"><span>—</span><input class="fi sh-t" type="time" value="${x.to}"><span class="muted sh-len" style="font-size:12px;min-width:44px"></span><button type="button" class="btn btn-s btn-sm" onclick="const s=this.closest('.scheme');this.parentNode.remove();scRenum(s)">✕</button></div>`;
function scRenum(s){ s.querySelectorAll('.sh-row').forEach((r,i)=>{ r.querySelector('.sh-n').textContent=(i+1)+'-я'; const a=hm(r.querySelector('.sh-f').value), b=hm(r.querySelector('.sh-t').value); r.querySelector('.sh-len').textContent=(((b-a+1440)%1440)||1440)/60+' ч'; }); }
function schemeDel(btn){ const s=btn.closest('.scheme'), id=s.dataset.id; if(DB.lines.some(l=>lineScheme(l.id).id===id)) return toast('Схема используется на линии — сначала переключите линию на другую схему'); if(document.querySelectorAll('.scheme').length<2) return toast('Нужна хотя бы одна схема'); s.remove(); }
const actRow = a => `<div class="act-row" data-id="${esc(a.id||'')}"><span class="sw" style="background:${ACAT[a.cat||'down'].c};width:10px;height:26px;border-radius:3px;margin:0"></span><input class="fi act-n" value="${esc(a.name||'')}" placeholder="Название"><select class="fi act-c" onchange="this.parentNode.querySelector('.sw').style.background=ACAT[this.value].c">${Object.entries(ACAT).map(([k,v])=>`<option value="${k}" ${k===(a.cat||'down')?'selected':''}>${v.n}</option>`).join('')}</select><button type="button" class="btn btn-s btn-sm" onclick="this.parentNode.remove()">✕</button></div>`;

}
function scRenumAll(){ document.querySelectorAll('.scheme').forEach(scRenum); }
async function saveSettings(){
  const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const schemes=[...document.querySelectorAll('.scheme')].map(b=>({id:b.dataset.id,name:b.querySelector('.sc-name').value.trim()||'Схема',shifts:[...b.querySelectorAll('.sh-row')].map(r=>({from:r.querySelector('.sh-f').value,to:r.querySelector('.sh-t').value})).filter(x=>x.from&&x.to)}));
  if(schemes.some(s=>!s.shifts.length)) return toast('В каждой схеме должна быть хотя бы одна смена');
  const activities=[...document.querySelectorAll('.act-row')].map(r=>({id:r.dataset.id||('a'+uid()),name:r.querySelector('.act-n').value.trim(),cat:r.querySelector('.act-c').value})).filter(a=>a.name);
  if(!activities.some(a=>a.cat==='work')) return toast('Нужен хотя бы один вид с категорией «Работа»');
  const s={...DB.settings,orgName:$('#sOrg').value.trim(),currency:$('#sCur').value,planFactor:+$('#sK').value||.85,setupTarget:+$('#sSet').value||5,defectTarget:+$('#sDef').value||2,
    workDays:[...document.querySelectorAll('.sWD:checked')].map(x=>+x.value),defectReasons:lines('#sR'),downReasons:lines('#sDR'),machineParams:lines('#sM'),shiftSchemes:schemes,activities};
  delete s.shifts;
  await Store.settings(s); toast('Настройки сохранены');
}
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'})); a.download=`proizvodstvo-backup-${iso(new Date())}.json`; a.click(); }

function modal(title,body,onSave,label='Сохранить',extra=''){
  $('#tip').style.display='none';
  $('#mTitle').textContent=title; $('#mBody').innerHTML=body; $('#mSave').textContent=label; $('#mExtra').innerHTML=extra; $('#modal').classList.add('open');
  setTimeout(()=>$('#mBody [autofocus]')?.focus(),50);
  $('#mSave').onclick=async()=>{ const b=$('#mSave'); b.disabled=true;
    try{ const f=Object.fromEntries(new FormData($('#mForm'))); if(await onSave(f)!==false){ closeModal(); render(); } }catch(e){ toast('Ошибка: '+e.message); }

function normalize(db){
  COLS.forEach(c=>db[c]=A(db[c]));
  db.projects.forEach(p=>p.stations=A(p.stations));
  db.semis.forEach(s=>{ s.items=A(s.items); s.history=A(s.history); });
  db.runs.forEach(r=>{ r.stations=A(r.stations); r.settings=A(r.settings); r.rawFact=r.rawFact||{}; r.writtenMap=r.writtenMap||{}; r.log=A(r.log); r.outputIds=A(r.outputIds); r.sec=r.sec||{}; });
  db.scenarios.forEach(s=>{ s.items=A(s.items); s.downs=A(s.downs); s.lineShifts=s.lineShifts||{}; });
  db.lines.forEach(l=>{ l.workShifts=A(l.workShifts); l.workDays=A(l.workDays); });
  Object.values(db.approved||{}).forEach(a=>{ if(a){ a.items=A(a.items); a.items.forEach(i=>i.segs=A(i.segs)); } });
  return db;
}

const downName = k => { const a=acts().find(x=>x.id===k||fbKey(x.id)===k); return a?a.name:k; };
function fbSafe(v){ if(Array.isArray(v)) return v.map(fbSafe); if(v&&typeof v==='object'){ const o={}; Object.entries(v).forEach(([k,x])=>{ if(x!==undefined) o[fbKey(k)]=fbSafe(x); }); return o; } return v; }
function applyLocal(list){
  list.forEach(x=>{
    if(x.path){ let o=DB; x.path.slice(0,-1).forEach(k=>{ o[k]=o[k]||{}; o=o[k]; }); o[x.path[x.path.length-1]]=x.val==null?undefined:clone(x.val); }
    else if(x.del) DB[x.col]=DB[x.col].filter(o=>o.id!==x.id);
    else { const obj=clone(x.obj), i=DB[x.col].findIndex(o=>o.id===obj.id); if(i>=0) DB[x.col][i]=obj; else DB[x.col].push(obj); }
  });
  normalize(DB);
}
const Store = {

}
async function doSetup(){
  const orgName=$('#sOrgN').value.trim()||'Моё производство', name=$('#sName').value.trim(), login=cleanLogin($('#sLogin').value), pass=$('#sPass').value;
  if(!name||!login) return amsg('Заполните имя и логин (латиница, цифры)');
  if(pass.length<4) return amsg('Пароль минимум 4 символа');
  try{ $('#aBtn').disabled=true;
    await fdb.ref(`${ROOT}/users/${login}`).set({id:login,login,name,password:pass,role:'admin'});
    await fdb.ref(`${ROOT}/data/settings`).set({...DEFAULT_SETTINGS,orgName});
    try{ localStorage.setItem('pdd_session',login); }catch(e){}
    openData(login);
  }catch(e){ amsg('Ошибка записи: '+e.message); $('#aBtn').disabled=false; }
}
function openData(login){
  state.mode='fb'; let first=true;
  if(orgRef) orgRef.off();
  orgRef=fdb.ref(ROOT);
  orgRef.on('value',snap=>{
    const v=snap.val()||{}, d=v.data||{}, arr=o=>Object.entries(o||{}).filter(([,x])=>x).map(([id,x])=>({...x,id}));
    const me=v.users?.[login]; if(!me){ toast('Пользователь удалён'); logout(); return; }
    const db={members:arr(v.users),settings:{...DEFAULT_SETTINGS,...(d.settings||{})},approved:d.approved||{}};
    COLS.forEach(c=>db[c]=arr(d[c]));
    // совместимость с первой версией (продукция → проекты, склад → сырьё)
    if(!db.projects.length&&d.products) db.projects=arr(d.products).map(p=>({...p,speed:80,setupMin:+p.setupNorm||60,stations:[],status:'Активный'}));
    if(!db.raw.length&&d.stock) db.raw=arr(d.stock).map(s=>({...s,cost:0}));
    db.output.forEach(r=>{ if(!r.projectId&&r.productId) r.projectId=r.productId; });
    db.orders.forEach(o=>{ if(!o.projectId&&o.productId) o.projectId=o.productId; });
    DB=normalize(db);
    state.me={id:login,name:me.name,role:me.role};
    if(first){ first=false; enterApp(); }
    else { $('#meName').textContent=me.name; $('#meRole').textContent=ROLES[me.role]?.n||''; $('#orgName').textContent=DB.settings.orgName; if(!$('#modal').classList.contains('open')) render(); }
  },err=>{ authScreen('offline','Нет доступа к базе: '+err.message); });
}
async function seedLive(){
  if(!confirm('Заполнить базу примером? Текущие данные (кроме пользователей и настроек) будут заменены.')) return;
  const g=genDemo(), up={}, o=x=>Object.fromEntries(x.map(i=>[i.id,i]));
  COLS.forEach(c=>up[c]=o(g[c])); up.approved=g.approved; up.products=null; up.stock=null;
  await fdb.ref(`${ROOT}/data`).update(fbSafe(clone(up))); toast("Пример загружен");
}
async function clearLive(){
  if(!confirm('Удалить ВСЕ данные: выпуск, план, проекты, рецептуры, сырьё, склад? Пользователи и настройки останутся.')) return;
  if(prompt('Для подтверждения напишите: УДАЛИТЬ')!=='УДАЛИТЬ') return;
  const up={approved:null,products:null,stock:null}; COLS.forEach(c=>up[c]=null);
  await fdb.ref(`${ROOT}/data`).update(up); toast('Данные очищены');
}
function logout(){
  try{ localStorage.removeItem('pdd_session'); }catch(e){}
  if(orgRef){ orgRef.off(); orgRef=null; }
  $('#app').style.display='none';
  if(fdb) authScreen(Object.keys(_users).length?'login':'setup'); else authScreen('demo');
}
async function connect(){
  authScreen('loading');
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fdb=firebase.database(); auth=firebase.auth();
    if(!auth.currentUser) await Promise.race([auth.signInAnonymously().catch(e=>console.warn('anon auth:',e.message)),wait(6000)]);
    const snap=await Promise.race([fdb.ref(ROOT+'/users').once('value'),wait(9000).then(()=>{ throw new Error('База не ответила за 9 секунд.'); })]);
    _users=snap.val()||{};
    fdb.ref(ROOT+'/users').on('value',x=>{ _users=x.val()||{}; });
    if(!Object.keys(_users).length) return authScreen('setup');
    let sess=null; try{ sess=localStorage.getItem('pdd_session'); }catch(e){}
    if(sess&&_users[sess]) return openData(sess);
    authScreen('login');
  }catch(e){ fdb=null; authScreen('offline',e.message); }
}
(function boot(){
  if(!window.firebase||!FB_CONFIG.apiKey){ authScreen('demo'); return; }
  connect();
})();
</script>
