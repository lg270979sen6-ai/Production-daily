<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Производство день за днём</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --card2:#f7f8fa; --line:#e6e9ef; --line2:#d8dde6;
  --text:#1c2230; --text2:#5b6576; --text3:#98a1b1;
  --brand:#e2462c; --brand2:#ff7a45; --brandBg:rgba(226,70,44,.09);
  --green:#1fa971; --greenBg:rgba(31,169,113,.1); --amber:#e89a12; --amberBg:rgba(232,154,18,.12);
  --blue:#3b7cf6; --blueBg:rgba(59,124,246,.1); --red:#e5484d; --redBg:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.04);
  --side:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(226,70,44,.35)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.15}
.brand-tag{font-size:11px;color:var(--text3);font-weight:600}
.auth h2{font-size:20px;font-weight:800;margin:26px 0 6px}
.auth p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5}
.fg{margin-bottom:13px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fi{width:100%;padding:10px 12px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--brand)}
.fi:disabled{background:var(--card2);color:var(--text2)}
textarea.fi{resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none;line-height:1.45}
.msg.err{display:block;background:var(--redBg);color:var(--red)}
.link{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:var(--card);border-color:var(--line2);color:var(--text)}
.btn-s:hover{border-color:var(--text3)}
.btn-d{background:var(--redBg);color:var(--red)}
.btn-g{background:var(--greenBg);color:var(--green)}
.btn-w{width:100%}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

.app{display:none;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.side .brand{padding:18px 16px 14px}
.nav{flex:1;overflow-y:auto;padding:2px 10px}
.nav-g{font-size:10.5px;font-weight:800;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;padding:13px 10px 5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:var(--text2);font-weight:600;cursor:pointer;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--brandBg);color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--redBg);color:var(--red);border-radius:6px;padding:1px 6px;font-weight:800}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.me-name{font-weight:700;font-size:13px;line-height:1.2}
.me-role{font-size:11px;color:var(--text3)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top .sp{flex:1}
.burger{display:none}
.mode{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
.mode.demo{background:var(--amberBg);color:var(--amber)}
.mode.live{background:var(--greenBg);color:var(--green)}
.content{padding:4px 28px 40px;max-width:1500px;width:100%}

.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card)}
.range{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:3px 8px}
.range input{border:0;background:none;outline:none;padding:4px 2px;font-weight:600;font-size:12.5px}
.range span{color:var(--text3)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-t{font-weight:800;font-size:15px}
.card-s{font-size:12px;color:var(--text3);font-weight:600}
.card-h .sp,.toolbar .sp{flex:1}
.kpi .kl{font-size:12px;color:var(--text2);font-weight:700}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:8px 0 6px;white-space:nowrap}
.kpi .kv small{font-size:13px;color:var(--text3);font-weight:700;letter-spacing:0}
.kd{font-size:11.5px;font-weight:700}
.kd.up{color:var(--green)} .kd.down{color:var(--red)} .kd.flat{color:var(--text3)}
.kpi.accent{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.kpi.accent .kl,.kpi.accent .kv small,.kpi.accent .kd{color:rgba(255,255,255,.9)}
.g2{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.row-gap{margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.hb-top b{font-weight:700}
.hb-top span{color:var(--text2);font-weight:600;white-space:nowrap}
.track{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px}
.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wk .b{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--brandBg)}
.wk .b.top{background:var(--brand)}
.wk small{font-size:11px;color:var(--text3);font-weight:700}
.donut{display:flex;align-items:center;gap:16px}
.dl{flex:1;min-width:0}
.dl div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.dl i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dl span{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{font-weight:800}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sh{background:var(--card2);border-radius:12px;padding:13px}
.sh .n{font-size:12px;font-weight:700;color:var(--text2)}
.sh .v{font-size:19px;font-weight:800;margin:4px 0 2px}
.sh .d{font-size:11.5px;color:var(--text3);font-weight:600}

.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.tw.flush{margin-top:-18px;border-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;background:var(--card2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr:hover td{background:var(--card2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:800;background:var(--card2)}
.ed td{padding:6px 7px;vertical-align:middle}
.ed .fi{padding:7px 8px;font-size:13px;border-radius:8px;min-width:64px}
.ed select.fi{min-width:200px} .ed.opt select.fi{min-width:0} .ed.opt .fi{min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-green{background:var(--greenBg);color:var(--green)} .t-red{background:var(--redBg);color:var(--red)}
.t-amber{background:var(--amberBg);color:var(--amber)} .t-blue{background:var(--blueBg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--text2)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog .track{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-weight:600;font-size:12.5px;outline:none}
.empty{text-align:center;padding:36px 10px;color:var(--text3);font-weight:600}
.muted{color:var(--text3)}
.hint{font-size:12.5px;color:var(--text2);line-height:1.55}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15);margin-right:6px;flex-shrink:0}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-style:normal;font-weight:800;color:rgba(0,0,0,.55)}
.stn{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--text);color:var(--card);align-items:center;justify-content:center;font-weight:800;font-size:12px}
.note{background:var(--amberBg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:800}
.log{max-height:420px;overflow:auto}
.log div{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.log div small{display:block;color:var(--text3);font-weight:700;font-size:11px}
.log div.meet{background:var(--blueBg);border-radius:8px;padding:9px 10px;border:0;margin:4px 0}

/* gantt */
.gantt{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.g-in{position:relative}
.g-head,.g-row{display:flex}
.g-lab{position:sticky;left:0;z-index:4;width:160px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:9px 12px;font-weight:700;font-size:12.5px;line-height:1.25}
.g-lab small{display:block;color:var(--text3);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lab{overflow:hidden}
.g-days{position:relative;flex-shrink:0}
.g-day{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--text3);font-weight:800;text-align:center;padding-top:5px;line-height:1.2}
.g-day.we{background:var(--card2)}
.g-day.td{color:var(--brand)}
.g-row{height:58px;border-top:1px solid var(--line)}
.g-bar{position:absolute;top:8px;height:34px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:800;padding:3px 7px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);line-height:1.3;z-index:1}
.g-bar small{display:block;font-weight:600;opacity:.9;font-size:10.5px}
.g-bar.conf{outline:2px solid var(--red);outline-offset:1px}
.g-bar.late{box-shadow:inset 0 -3px 0 var(--red),0 1px 3px rgba(0,0,0,.25)}
.g-bar.done{opacity:.55}
.g-ghost{position:absolute;top:46px;height:6px;border-radius:3px;border:1.5px dashed var(--text3);opacity:.8}
.app.full .side{transform:translateX(-100%)} .app.full .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
.app.full .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.app.full .main{margin-left:0} .app.full .burger{display:flex} .app.full .content{max-width:none;padding:4px 18px 40px}
.qt td{vertical-align:middle} .q-st{padding:5px 6px;font-size:12px;width:178px} .q-st.fix{border-color:var(--brand);background:var(--brandBg)} .qt td:nth-child(2){white-space:normal;min-width:220px} .qt td:nth-child(2) b{font-size:13px} .qt td:nth-child(8){white-space:normal;min-width:120px} .qt td:nth-child(9){white-space:normal;min-width:150px} .qt td:nth-child(9) .tag{margin:1px 0} .qt tr.q-line td{background:var(--card2);padding:9px 12px;border-top:2px solid var(--line2)} .qt tr.q-run td:first-child{box-shadow:inset 4px 0 0 var(--blue)} .qt tr.q-done{opacity:.5}
.q-arr{white-space:nowrap} .q-arr .btn{padding:3px 8px;margin-right:3px;font-size:13px} .q-arr .btn:disabled{opacity:.25}
.sg td{vertical-align:top;font-size:12px;padding:6px 8px;border-left:1px solid var(--line)} .sg th{border-left:1px solid var(--line)} .sg th.c{text-align:center}
.sg tr.sg-last td{border-bottom:2px solid var(--line2)} .sg-date{font-weight:800;white-space:nowrap;background:var(--card2);font-size:12.5px!important;line-height:1.5} .sg-today td.sg-date,.sg-today td.sg-line{color:var(--brand)}
.sg-line{font-weight:700;white-space:nowrap} .sg-pc{min-width:230px} .sg-fc{min-width:200px;background:rgba(31,169,113,.035)}
.sg-off{background:repeating-linear-gradient(135deg,rgba(120,130,150,.13) 0 4px,transparent 4px 8px);color:var(--text3);text-align:center;vertical-align:middle!important}
.sg-p,.sg-fr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer;padding:2px 0;border-radius:5px} .sg-p:hover,.sg-fr:hover{background:var(--card2)}
.sg-p .sw,.sg-fr .sw{width:8px;height:8px;margin:0;align-self:center} .sg-n{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sg-p small{width:100%;color:var(--text3);padding-left:14px}
.sg-dn{color:var(--red);font-weight:700;cursor:pointer;padding:2px 0} .sg-f.pend{border:1.5px dashed var(--amber);border-radius:7px;padding:3px 5px;margin-bottom:3px;background:var(--amberBg)}
.sg-pl{color:var(--amber);font-weight:700;margin-top:2px} .sg-miss{color:var(--red);font-weight:700} .sg-pct{font-weight:800;margin-top:3px;font-size:11.5px} .sg-pct.ok{color:var(--green)} .sg-pct.mid{color:var(--amber)} .sg-pct.bad{color:var(--red)}
.dc-day{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)} .dc-day:first-child{margin-top:0;border-top:0;padding-top:0} .dc-day.today .dc-dh b{color:var(--brand)}
.dc-dh{font-size:14px;margin-bottom:4px} .dc-ticks{position:relative;height:16px;margin-left:170px;font-size:10.5px;color:var(--text3);font-weight:700}
.dc-ticks span{position:absolute;transform:translateX(-50%)} .dc-ticks span:first-child{transform:none} .dc-ticks span:last-child{transform:translateX(-100%)}
.dc-line{display:flex;align-items:stretch;border-top:1px solid var(--line)} .dc-lab{width:170px;flex-shrink:0;font-size:12.5px;font-weight:800;padding-right:8px} .dc-lab>div{height:34px;display:flex;align-items:center;gap:6px} .dc-lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .dc-lab i{margin-left:auto;font-style:normal;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em} .dc-lab>div+div{border-top:1px dashed var(--line)}
.dc-tracks{flex:1;min-width:0} .dc-tr{position:relative;height:34px} .dc-tr+.dc-tr{border-top:1px dashed var(--line)}
.dc-seg{position:absolute;top:4px;height:26px;border-radius:5px;overflow:hidden;font-size:11px;font-weight:700;color:#fff;padding:0 5px;line-height:26px;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);z-index:1}
.dc-seg.s{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px)} .dc-seg.p{background:#98a1b1;color:#fff}
.dc-seg.pend{opacity:.6;outline:2px dashed var(--amber);outline-offset:-2px}
.dc-off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(120,130,150,.2) 0 3px,transparent 3px 7px)}

(function(){
  const DT='input[type=date],input[type=datetime-local],input[type=time]';
  const pend=new WeakSet(), lastKey=new WeakMap(); let replay=false, down=null;
  const isDT=t=>t&&t.matches&&t.matches(DT);
  function flush(t){ if(!pend.has(t)) return; pend.delete(t); replay=true; try{ t.dispatchEvent(new Event('change',{bubbles:true})); } finally{ replay=false; } }

function unitCost(kind,id,seen=new Set()){
  if(kind==='raw') return +byId(DB.raw,id)?.cost||0;
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return 0;
  const ns=new Set(seen); ns.add(id);
  return A(s.items).reduce((a,it)=>a+(+it.qty||0)*unitCost(it.kind,it.id,ns),0)/(+s.yield||1);
}
function expand(kind,id,qty,acc={},seen=new Set()){
  if(!id) return acc;
  if(kind==='raw'){ acc[id]=(acc[id]||0)+qty; return acc; }
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return acc;
  const ns=new Set(seen); ns.add(id); const f=qty/(+s.yield||1);
  A(s.items).forEach(it=>expand(it.kind,it.id,(+it.qty||0)*f,acc,ns));
  return acc;
}

  const acc={};

const _sch = new Map();

// Позиция плана: первичная наладка → работа (кол-во / скорость). Никаких автоматических добавок:

const QUALS=['Junior','Operator','Senior'], qRank=q=>QUALS.indexOf(q)+1;

function areas(){ const a=A(DB.settings?.areas).filter(x=>x&&x.id); return a.length?a:DEF_AREAS; }

// сменное задание: что по действующему плану линия должна сделать в эту смену
function shiftTasks(lineId,a,b){

    const segs=itemSegs(it), runTot=segs.filter(x=>x[2]==='r').reduce((s,x)=>s+x[1]-x[0],0); let run=0, setup=0, fa=null, fb=null;

// перевод «чч:мм» внутри смены в абсолютное время (ночная смена переходит через полночь)
function tlAbs(od,t){ const [A0]=od.win, d=new Date(A0); d.setHours(0,0,0,0); let ms=d.getTime()+hm(t)*60e3; if(ms<A0-60e3) ms+=864e5; return ms; }

    if(r.a<A0-60e3||r.b>B0+60e3) errs.push(`Интервал ${r.from}–${r.to} выходит за пределы смены`);
    if(r.a>cur+60e3) gaps.push([cur,r.a]); else if(r.a<cur-60e3) errs.push(`Интервалы накладываются около ${hhmm(r.a)}`);

// хронометраж по умолчанию — из плана смены: каждый проект своими интервалами (наладка, работа, паузы)

      const l=rows[rows.length-1]; if(l&&l.act===s.act&&l.projectId===s.projectId&&l.note===s.note&&l.to===hhmm(s.a)) l.to=hhmm(s.b); else rows.push({from:hhmm(s.a),to:hhmm(s.b),act:s.act,projectId:s.projectId,note:s.note}); cur=s.b; });

    const rows=[...document.querySelectorAll('#catRows .cat-row')], list=[], ren={};

function catDel(btn){ const row=btn.closest('.cat-row'), old=row.dataset.old; if(old&&DB.raw.some(r=>r.cat===old)) return toast('В категории есть сырьё — сначала перенесите его в другую'); row.remove(); }

function semiItemPick(i,v){
  if(v==='__newraw'){ openRawModal(null,r=>{ state.draft.items[i]={kind:'raw',id:r.id,qty:state.draft.items[i].qty||''}; render(); }); return; }
  const [kind,id]=v.split(':'); state.draft.items[i]={...state.draft.items[i],kind:kind||'raw',id:id||''}; renderSemiEdit();
}
function d_item(i,k,v){ state.draft.items[i][k]=v===''?'':+v; renderSemiEdit(); }
function d_itemAdd(){ state.draft.items.push({kind:'raw',id:'',qty:''}); renderSemiEdit(); }
function d_itemDel(i){ state.draft.items.splice(i,1); renderSemiEdit(); }
function dupSemi(){ const d=clone(state.draft); d.id=null; d.name+=' (копия)'; d.history=[]; d.ver=1; state.draft=d; renderSemiEdit(); toast('Создана копия — сохраните её'); }
function semiBack(){ const b=state.back; state.back=null; state.draft=b.draft; state.sec='projectEdit'; render(); }
async function saveSemi(){
  const d=state.draft, items=d.items.filter(it=>it.id&&+it.qty>0).map(it=>({kind:it.kind,id:it.id,qty:+it.qty}));
  if(!d.name.trim()) return toast('Введите название');
  if(!items.length) return toast('Добавьте хотя бы один ингредиент с количеством');
  const old=d.id?byId(DB.semis,d.id):null;
  const rec={...d,id:d.id||uid(),name:d.name.trim(),yield:+d.yield||1,items,updated:iso(new Date()),ver:old?.ver||1,history:A(old?.history)};
  if(old&&(JSON.stringify(A(old.items))!==JSON.stringify(items)||+old.yield!==rec.yield)){
    rec.history=[...A(old.history),{ver:old.ver||1,date:old.updated||iso(new Date()),by:old.by||'',yield:old.yield,items:A(old.items)}].slice(-20);
    rec.ver=(old.ver||1)+1;
  }
  rec.by=state.me.name;
  await Store.put('semis',rec);
  toast(old&&rec.ver>(old.ver||1)?`Сохранено как версия v${rec.ver}`:'Рецептура сохранена');
  if(state.back?.sec==='projectEdit'){ const b=state.back; if(b.oi!=null){ const st=b.draft.ops?.[b.oi]?.recipes?.[b.ri]?.stations?.[b.station]; if(st) st.semiId=rec.id; } else if(b.station!=null&&b.draft.stations[b.station]) b.draft.stations[b.station].semiId=rec.id; state.back=null; state.draft=b.draft; state.sec='projectEdit'; render(); }
  else { state.draft=clone(rec); render(); }
}

const IMG_MAX=1200, IMG_THUMB=160;
function projImages(pid){
  if(!pid) return [];
  if(state.mode!=='fb') return A((DB.images||{})[pid]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  state._img=state._img||{}; const c=state._img[pid];
  if(c===undefined){ state._img[pid]=null; fdb.ref(`${ROOT}/images/${pid}`).once('value').then(s=>{ const v=s.val()||{}; state._img[pid]=Object.entries(v).filter(([,x])=>x).map(([id,x])=>({...x,id})).sort((a,b)=>(a.ts||0)-(b.ts||0)); if(state.sec==='projectEdit') renderProjectEdit(); })
    .catch(()=>{ state._img[pid]=[]; }); return null; }
  return c;
}
function toJpeg(src,max,q){ return new Promise((res,rej)=>{ const im=new Image(); im.onerror=()=>rej(new Error('Не удалось открыть изображение (поддерживаются JPG, PNG, WebP)'));
  im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), w=Math.max(1,Math.round(im.width*k)), h=Math.max(1,Math.round(im.height*k)), c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); if(!x) return rej(new Error('Браузер не поддерживает обработку изображений')); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res({data:c.toDataURL('image/jpeg',q),w,h,ow:im.width,oh:im.height}); };
  im.src=src; }); }
const readFile=f=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error('Не удалось прочитать файл')); r.onload=()=>res(r.result); r.readAsDataURL(f); });
async function imgWrite(pid,put,delIds){
  const list=A(put), dels=A(delIds);

    await fdb.ref(`${ROOT}/images`).update(up);
    state._img=state._img||{}; let cur=A(state._img[pid]).filter(x=>!dels.includes(x.id)); list.forEach(r=>{ const i=cur.findIndex(x=>x.id===r.id); if(i>=0) cur[i]=r; else cur.push(r); }); state._img[pid]=cur;
  } else { DB.images=DB.images||{}; let cur=A(DB.images[pid]).filter(x=>!dels.includes(x.id)); list.forEach(r=>{ const i=cur.findIndex(x=>x.id===r.id); if(i>=0) cur[i]=r; else cur.push(r); }); DB.images[pid]=cur; demoSave(); }
}

function runPlanRaw(r){ // плановый расход сырья по нормам: станции + тара
  const q=(+r.qtyGood||0)+(+r.qtyDefect||0), acc={};
  A(r.stations).forEach(st=>{ const kg=stationKg(st.norm,q); Object.entries(st.rawPerKg||{}).forEach(([rid,per])=>acc[rid]=(acc[rid]||0)+per*kg); });
  if(r.tareId) acc[r.tareId]=(acc[r.tareId]||0)+q;
  return acc;
}

function runDiff(sec,o,n){
  const ch=[], lbl={planItemId:'позиция плана',lineId:'линия',startAt:'начало',endAt:'окончание',qtyGood:'годные',qtyDefect:'брак',setupFact:'наладка',speedFact:'скорость'};

    const oa=A(o?.outputIds).length, nb=A(n.outputIds).length; if(oa!==nb) ch.push(`смен в отчёте: ${oa} → ${nb}`); }
  if(sec==='settings'){ const os=Object.fromEntries(A(o?.settings).map(x=>[x.k,x.v])); A(n.settings).forEach(x=>{ if(os[x.k]!==x.v) ch.push(`${x.k}: ${os[x.k]??'—'} → ${x.v}`); });
    A(n.stations).forEach((st,i)=>{ const ob=A(o?.stations)[i]||{}; ['visc','press','nozzle'].forEach(k=>{ if(String(ob[k]??'')!==String(st[k]??'')) ch.push(`ст.${st.n} ${({visc:'вязкость',press:'давление',nozzle:'сопло'})[k]}: ${ob[k]||'—'} → ${st[k]||'—'}`); }); });
    if((o?.note||'')!==(n.note||'')) ch.push('замечания обновлены'); }

async function saveRunSection(sec){

    if(state.runDirty.prod||!dd.id){ await saveRunSection('prod'); if(state.runDirty.prod) return; }
  }

  if(sec==='prod'&&!(+d.qtyGood)&&!(+d.qtyDefect)) return toast('Укажите количество изделий или выберите отчёты за смены');

  const base=old?clone(old):{id,projectId:d.projectId,tareId:d.tareId,stations:clone(d.stations).map(s=>({...s,factKg:''})),settings:clone(d.settings),rawFact:{},writtenMap:{},writtenOff:false,log:[],sec:{},created:Date.now(),createdBy:state.me.name};

  if(sec==='settings') rec.stations=rec.stations.map((s,i)=>({...s,visc:d.stations[i]?.visc??s.visc,press:d.stations[i]?.press??s.press,nozzle:d.stations[i]?.nozzle??s.nozzle}));
  if(sec==='materials') rec.stations=rec.stations.map((s,i)=>({...s,factKg:d.stations[i]?.factKg??''}));

    if(!Object.keys(next).length) return toast('Внесите фактический расход хотя бы по одному компоненту');

        list.push({col:'moves',obj:{id:uid(),date,type:'out',rawId:rid,qty:v,projectId:rec.projectId,runId:id,note:corr?'Списание по тех. отчёту (перезапись)':'Списание по тех. отчёту',by:state.me.name,ts:now}});

      Object.keys(prev).filter(rid=>next[rid]==null).forEach(rid=>{ const r=byId(DB.raw,rid); if(r) moveNotes.push(`${r.name}: убрано (было ${QU(prev[rid],r.unit)})`); });

}

  DB.raw.forEach(x=>{ const nq=Math.round(qty[x.id]*1000)/1000; if(Math.abs(nq-(+x.qty||0))>1e-9) list.push({col:'raw',obj:{...x,qty:nq}}); });

  outs.forEach(o=>list.push({col:'output',obj:{...o,runId:heir?heir.id:''}}));
  if(heir&&outs.length) list.push({col:'runs',obj:{...heir,outputIds:outs.map(o=>o.id),log:[...A(heir.log),{ts:Date.now(),by:state.me.name,sec:'prod',text:`Смены (${outs.length}) переданы из отменённого дубля`}]}});
  list.push({col:'runs',obj:{...r,cancelled:true,cancelledAt:now,cancelledBy:state.me.name,cancelReason:why,writtenOff:false,writtenMap:{},outputIds:[],log:[...A(r.log),{ts:now,by:state.me.name,sec:'materials',text:`Отчёт отменён (${why}). Списание отменено и возвращено на склад: `+mv.map(m=>`${rawName(m.rawId)} ${QU(m.qty,byId(DB.raw,m.rawId)?.unit)}`).join(', ')}]}});

function runMismatch(r){ // проведено по складу ≠ факт отчёта
  if(!r||r.cancelled) return null; const net={}, wm=r.writtenMap||{};
  DB.moves.filter(m=>m.runId===r.id&&!m.cancelled&&m.rawId).forEach(m=>net[m.rawId]=(net[m.rawId]||0)-moveDelta(m));
  const bad=[...new Set([...Object.keys(net),...Object.keys(wm)])].filter(rid=>Math.abs((net[rid]||0)-(+wm[rid]||0))>1e-6).map(rid=>({rid,booked:net[rid]||0,should:+wm[rid]||0}));
  return bad.length?bad:null;
}
async function repairRun(id){

  const now=Date.now(), qty={}, list=[]; DB.raw.forEach(x=>qty[x.id]=+x.qty||0);
  DB.moves.filter(m=>m.runId===id&&!m.cancelled).forEach(m=>{ if(qty[m.rawId]!=null) qty[m.rawId]-=moveDelta(m); list.push({col:'moves',obj:{...m,cancelled:true,cancelledAt:now,cancelledBy:state.me.name,cancelReason:'исправление повторного списания'}}); });

  DB.raw.forEach(x=>{ const nq=Math.round(qty[x.id]*1000)/1000; if(Math.abs(nq-(+x.qty||0))>1e-9) list.push({col:'raw',obj:{...x,qty:nq}}); });
  list.push({col:'runs',obj:{...r,log:[...A(r.log),{ts:now,by:state.me.name,sec:'materials',text:'Исправлено повторное списание:\n'+bad.map(b=>`${rawName(b.rid)}: было проведено ${QU(b.booked,byId(DB.raw,b.rid)?.unit)} → ${QU(b.should,byId(DB.raw,b.rid)?.unit)}`).join('\n')}]}});

}
function runDupes(){ // похожие отчёты: тот же проект, одинаковый расход, списаны в пределах суток
  const live=DB.runs.filter(r=>r.writtenOff&&!r.cancelled), d=new Set();
  live.forEach((a,i)=>live.slice(i+1).forEach(b=>{ if(a.projectId!==b.projectId) return; const ka=JSON.stringify(Object.entries(a.writtenMap||{}).sort()), kb=JSON.stringify(Object.entries(b.writtenMap||{}).sort()); const ta=a.sec?.materials?.ts||0, tb=b.sec?.materials?.ts||0;
    if(ka===kb&&Math.abs(ta-tb)<864e5){ d.add(a.id); d.add(b.id); } }));
  return d;
}

  const work=DB.plan.map(clone), lines=new Set(), moved=[];

// сохранить изменения очереди: пересчитать цепочку на линиях и записать только изменившиеся позиции

function itemOpIx(o,ops,it){ if(it.opId){ const k=ops.findIndex(x=>x.id===it.opId); if(k>=0) return k; } return ops.findIndex(x=>x.lineId&&(opHasLine(x,it.lineId)||stageLines(o,x.lineId)?.has(it.lineId))); }
// на одной линии операции одного заказа идут строго по маршруту: «Принтинг step 2» никогда не встаёт в очереди раньше «Принтинг step 1»
function orderSeqFix(work,lineId){ const li=work.filter(i=>i.lineId===lineId).sort((a,b)=>seqOf(a)-seqOf(b)||tms(a.start)-tms(b.start)); li.forEach((x,k)=>x.seq=k); let ch=false;
  const byO={}; li.forEach(i=>{ if(i.orderId&&!isChange(i)&&!hasOutputs(i)) (byO[i.orderId]=byO[i.orderId]||[]).push(i); });
  Object.entries(byO).forEach(([oid,its])=>{ if(its.length<2) return; const o=byId(DB.orders,oid); if(!o) return; const ops=orderOps(o), slots=its.map(i=>i.seq), srt=its.slice().sort((a,b)=>(itemOpIx(o,ops,a)-itemOpIx(o,ops,b))||(a.seq-b.seq));
    srt.forEach((it,k)=>{ if(it.seq!==slots[k]){ it.seq=slots[k]; ch=true; } }); });
  return ch; }
function depPass(work,ctx){
  const changed=new Set(), byO={}; work.forEach(i=>{ if(i.orderId&&!isChange(i)) (byO[i.orderId]=byO[i.orderId]||[]).push(i); });
  Object.entries(byO).forEach(([oid,its])=>{ const o=byId(DB.orders,oid); if(!o) return; const ops=orderOps(o); if(ops.length<2) return;
    const ix=it=>itemOpIx(o,ops,it);
    its.forEach(B=>{ if(B.withId||hasOutputs(B)) return; const k=ix(B); if(k<0) return;
      if(B.pinNb===undefined) B.pinNb=/· запуск/.test(B.note||'')?'':(B.notBefore||'');
      let need=0; if(k>0){ let j=k-1,W=0; while(j>=0&&!ops[j].lineId){ if(opIsWait(ops[j])) W+=+ops[j].waitH||0; j--; }
        const prev=j>=0?its.filter(i=>i!==B&&ix(i)===j):[];
        if(prev.length){ const aS=Math.min(...prev.map(i=>sched(i,ctx).start)), aE=Math.max(...prev.map(i=>sched(i,ctx).end)), sb=sched(B,ctx), dur=Math.max(0,sb.end-sb.start); need=Math.max(aS+W*H,aE+W*H-dur); } }
      const nb=Math.max(B.pinNb?tms(B.pinNb):0,need), v=nb?toDT(nb):'';

  return changed;
}

function orEdStart(oid){ const o=byId(DB.orders,oid), p=byId(DB.projects,o.projectId); state.orEd={oid,ops:orderRouteAll(o,p).map(x=>clone(x)),skip:new Set(A(o.skipOps)),why:{...(o.skipWhy||{})}}; renderProjectEdit(); }
function orEdSet(k,f,v){ const ed=state.orEd, op=ed.ops[k]; if(f==='on'){ v?ed.skip.delete(op.id):ed.skip.add(op.id); renderProjectEdit(); return; } if(f==='why'){ ed.why[op.id]=v; return; } op[f]=v; if(f==='lineId') renderProjectEdit(); }
function orEdMove(k,d){ const s=state.orEd.ops, j=k+d; if(j<0||j>=s.length) return; [s[k],s[j]]=[s[j],s[k]]; renderProjectEdit(); }
function orEdDel(k){ state.orEd.ops.splice(k,1); renderProjectEdit(); }
function orEdAdd(){ state.orEd.ops.push({id:'OX'+uid(),name:'',lineId:'',defT:'',waitH:'',extra:true}); renderProjectEdit(); }
function orEdReset(){ const o=byId(DB.orders,state.orEd.oid), p=byId(DB.projects,o.projectId); if(!confirm('Заменить маршрут заказа текущей техкартой проекта? Операции «только для заказа» будут удалены.')) return; state.orEd.ops=A(p.ops).map(opSnap); renderProjectEdit(); }
async function orEdSave(){
  const ed=state.orEd, o=byId(DB.orders,ed.oid); const ops=ed.ops.filter(x=>(x.name||'').trim()).map(x=>({...x,name:x.name.trim()}));
  const miss=ops.filter(x=>ed.skip.has(x.id)&&!(ed.why[x.id]||'').trim()); if(miss.length) return toast('Укажите причину, почему не выполняем: '+miss.map(x=>x.name).join(', '));
  const old=orderRouteAll(o), oldSk=new Set(A(o.skipOps)), ch=[];
  ops.forEach(x=>{ const y=old.find(z=>z.id===x.id); if(!y) ch.push(`добавил «${x.name}»`); else { if(oldSk.has(x.id)!==ed.skip.has(x.id)) ch.push(`${ed.skip.has(x.id)?'убрал':'вернул'} «${x.name}»${ed.skip.has(x.id)?': '+ed.why[x.id]:''}`); ['name','lineId','waitH','defT'].forEach(f=>{ if(String(y[f]??'')!==String(x[f]??'')) ch.push(`«${x.name}»: ${({name:'название',lineId:'линия',waitH:'выдержка',defT:'цель брака'})[f]} ${f==='lineId'?lineName(y[f]):y[f]??'—'} → ${f==='lineId'?lineName(x[f]):x[f]||'—'}`); }); } });
  old.forEach(y=>{ if(!ops.some(x=>x.id===y.id)) ch.push(`удалил «${y.name}»`); });
  if(ops.filter(x=>old.some(y=>y.id===x.id)).map(x=>x.id).join()!==old.filter(y=>ops.some(x=>x.id===y.id)).map(y=>y.id).join()) ch.push('изменил порядок операций');
  if(!ch.length&&A(o.ops).length){ state.orEd=null; renderProjectEdit(); return toast('Изменений нет'); }
  const skipWhy={}; ops.forEach(x=>{ if(ed.skip.has(x.id)) skipWhy[x.id]=ed.why[x.id]; });
  await Store.put('orders',{...clone(o),ops,routeAt:Date.now(),routeBy:state.me.name,skipOps:ops.filter(x=>ed.skip.has(x.id)).map(x=>x.id),skipWhy,techOk:null,
    routeLog:[...A(o.routeLog),{ts:Date.now(),by:state.me.name,text:(ch.join('; ')||'маршрут зафиксирован')+(o.techOk?' — утверждение технолога снято':'')}]});
  state.orEd=null; toast('Маршрут заказа сохранён'); renderProjectEdit();
}

// ═════════════════════════════════════════════
//  ПЕЧЬ — линия с режимами: обжиг (~550 °C), запекание (~150 °C); перестройка режима — позиция очереди с ручной длительностью
// ═════════════════════════════════════════════
const OVM={fire:{n:'Обжиг',t:550,c:'#f08a3c'},bake:{n:'Запекание',t:150,c:'#e98fb0'}};
const isOven=l=>(typeof l==='string'?byId(DB.lines,l):l)?.kind==='oven';
const isChange=it=>it?.kind==='change';
const ovenTag=it=>{ if(isChange(it)) return `<span class="tag t-gray">⚙ перестройка → ${esc(OVM[it.mode]?.n||'')} ${it.temp?it.temp+' °C':''} · ${Q(+it.hours||0,1)} ч</span>`;
  if(!it.mode) return ''; const m=OVM[it.mode]; return `<span class="tag" style="background:${m.c}33;color:#7a3b10">${m.n} ${it.temp||m.t} °C${it.group?` · гр. ${esc(it.group)}`:''}</span>${it.withId?` <span class="tag t-blue">вместе с ${esc(projName(byId(DB.plan,it.withId)?.projectId))}</span>`:''}`; };
// проверки печи: перестройка между режимами/температурами, совместимость совместного запекания
function ovenCheck(it){
  if(!isOven(it.lineId)||isChange(it)) return [];
  const out=[], q=lineQueue(it.lineId).filter(x=>!x.withId), k=q.findIndex(x=>x.id===(it.withId||it.id));
  if(it.withId){ const ld=byId(DB.plan,it.withId);
    if(!ld) out.push(['Нет позиции «вместе с»','t-red','позиция, с которой запланировано совместное запекание, удалена']);
    else if(it.mode!=='bake'||ld.mode!=='bake') out.push(['Вместе — только запекание','t-red','совместно можно только запекать']);
    else if(!it.group||it.group!==ld.group) out.push(['Несовместимо','t-red',`группы совместимости разные: «${esc(it.group||'—')}» и «${esc(ld.group||'—')}»`]);
    else if(Math.abs((+it.temp||150)-(+ld.temp||150))>5) out.push(['Другая температура','t-red',`${it.temp} °C и ${ld.temp} °C — вместе нельзя`]); }
  const me=it.withId?byId(DB.plan,it.withId):it; if(!me) return out;
  for(let j=k-1;j>=0;j--){ const pv=q[j]; if(isChange(pv)){ if(pv.mode!==me.mode||(pv.temp&&me.temp&&Math.abs(+pv.temp-+me.temp)>10)) out.push(['Режим печи не тот','t-red',`перед этой позицией перестройка на «${esc(OVM[pv.mode]?.n||'')} ${pv.temp||''} °C», а нужно «${OVM[me.mode]?.n} ${me.temp||OVM[me.mode]?.t} °C»`]); break; }
    if(pv.mode){ if(pv.mode!==me.mode) out.push([`Нет перестройки ${OVM[pv.mode].n.toLowerCase()} → ${OVM[me.mode].n.toLowerCase()}`,'t-red',`перед этой позицией печь в режиме «${OVM[pv.mode].n} ${pv.temp||OVM[pv.mode].t} °C» — добавьте перестройку`]);
      else if(pv.temp&&me.temp&&Math.abs(+pv.temp-+me.temp)>10) out.push(['Другая температура — нужна перестройка','t-amber',`${pv.temp} °C → ${me.temp} °C`]); break; } }
  return out;
}

function qiDiff(o,n){

  if((o.notBefore||'')!==(n.notBefore||'')) ch.push(n.notBefore?`не раньше ${fdt(tms(n.notBefore))}`:'снято «не раньше»');

  DB.plan.filter(i=>i.lineId===lineId&&!isChange(i)).forEach(it=>{ let run=0,setup=0,pause=0,x=Infinity,y=0;
    const parts=[]; itemSegs(it,LIVE).forEach(([sa,sb,k,l])=>{ const u=Math.max(sa,a), v=Math.min(sb,b); if(v<=u) return; const m=(v-u)/60e3; if(k==='r') run+=m; else if(k==='s') setup+=m; else pause+=m; x=Math.min(x,u); y=Math.max(y,v); parts.push([u,v,k,l]); });

  return res.sort((p,q)=>p.x-q.x);
}

async function applyScenario(id){
  const s=byId(DB.scenarios,id), items=A(s.items), downs=A(s.downs), ls=s.lineShifts||{};
  const lsTxt=Object.entries(ls).filter(([lid,v])=>JSON.stringify(A(v).map(Number))!==JSON.stringify(lineCfg(lid,LIVE).shifts)).map(([lid,v])=>`${lineName(lid)}: смены ${A(v).join('+')}`);
  if(!confirm(`Применить сценарий «${s.name}» к действующему плану?\n\n• позиции плана будут заменены позициями сценария (${items.length})\n• простои сценария добавятся в действующий план (${downs.length})${lsTxt.length?'\n• изменится сменность: '+lsTxt.join(', '):''}\n\nИзменение попадёт в журнал плана.`)) return;
  const ids=new Set(items.map(i=>i.id)), list=[];

  downs.forEach(d=>list.push({col:'downs',obj:d}));
  Object.entries(ls).forEach(([lid,v])=>{ const l=byId(DB.lines,lid); if(l) list.push({col:'lines',obj:{...l,workShifts:A(v).map(Number)}}); });
  list.push(logEntry(`Применён сценарий «${s.name}»: ${items.length} позиций${downs.length?`, простоев ${downs.length}`:''}${lsTxt.length?', '+lsTxt.join(', '):''}`));

}

function feasCalc(f){
  const p=byId(DB.projects,f.projectId), qty=+f.qty||0; if(!p||!qty) return;
  const fc=demandForecast(), req=projectReq(p,qty), sup=DB.supplies.filter(s=>s.status!=='received'), today=iso(new Date()), lines=[]; let ready=today, impossible=false;
  Object.entries(req).forEach(([rid,need])=>{
    const x=fc[rid]; if(!x) return; const base=x.stock-x.need, supBy=d=>sup.filter(s=>s.rawId===rid&&s.date<=d).reduce((a,s)=>a+(+s.qty||0),0);
    let when=base+supBy(today)>=need?today:[...new Set(sup.filter(s=>s.rawId===rid).map(s=>s.date))].sort().find(d=>base+supBy(d)>=need), lack=0;
    if(!when){ lack=need-base-supBy('9999'); when=iso(addD(new Date(),+x.r.leadDays||0)); impossible=true; }
    if(when>ready) ready=when;
    lines.push(`<tr><td>${esc(x.r.name)}</td><td class="num">${QU(need,x.r.unit)} ${esc(x.r.unit)}</td><td class="num">${QU(Math.max(0,base+supBy('9999')),x.r.unit)}</td><td>${lack?`<span class="tag t-red">заказать ${QU(lack,x.r.unit)} → ${fdate(when)}</span>`:when===today?'<span class="tag t-green">есть</span>':`<span class="tag t-amber">с ${fdate(when)}</span>`}</td></tr>`);
  });
  const lineFree=lineEnd(p.lineId), startMs=Math.max(pd(ready).getTime(),lineFree||0,Date.now()), s=sched({id:'__feas'+Math.random(),projectId:p.id,lineId:p.lineId,qty,start:toDT(startMs)}), ok=s.end<=pd(f.due).getTime()+864e5;
  $('#feasOut').innerHTML=`<div class="card" style="padding:14px;margin-top:6px;box-shadow:none">
    <div class="stat"><span>Сырьё будет готово</span><b>${fdate(ready)}${impossible?' <span class="tag t-red">нужен дозаказ</span>':''}</b></div>
    <div class="stat"><span>${esc(lineName(p.lineId))} свободна с</span><b>${lineFree?fdt(lineFree):'сейчас'} · ${esc(shiftLabel(p.lineId))}</b></div>

function moveTime(m){

  if(ts>1e12&&(m.runId||iso(new Date(ts))===m.date)) return ts;

const moveDelta = m => m.type==='in'?+m.qty||0:m.type==='out'?-(+m.qty||0):m.type==='inv'?+m.qty||0:0;

function runWoAt(){ // когда тех. отчёт впервые списал сырьё

}
function stockAt(T){ // остаток по учёту на момент T

}

    const req=outputReserve(o); Object.entries(req).forEach(([rid,q])=>acc[rid]=(acc[rid]||0)+q); if(detail) list.push({o,req}); });

}
function futureReserve(T,detail){ // сырьё под выпуск по действующему плану между «сейчас» и T
  const now=Date.now(), acc={}, list=[]; if(T<=now) return detail?{acc,list}:acc;
  const made={}; DB.output.forEach(o=>{ if(o.planItemId) made[o.planItemId]=(made[o.planItemId]||0)+(+o.good||0)+(+o.defect||0); });
  DB.plan.forEach(it=>{ const p=byId(DB.projects,it.projectId); if(!p) return; const run=runFor(it); if(run&&run.writtenOff) return;
    const rs=itemSegs(it).filter(x=>x[2]==='r'&&x[1]>now); const tot=rs.reduce((a,x)=>a+x[1]-Math.max(x[0],now),0); if(!tot) return;

}
function suppliesUntil(T){ const acc={}, now=Date.now(); if(T<=now) return acc;
  DB.supplies.filter(s=>s.status!=='received'&&pd(s.date).getTime()+12*H<=T).forEach(s=>acc[s.rawId]=(acc[s.rawId]||0)+(+s.qty||0)); return acc; }

}

  recs.forEach(r=>{ const k=fn(r), x=m[k]||(m[k]={k,good:0,defect:0,setup:0,down:0,shifts:new Set()}); x.good+=+r.good||0; x.defect+=+r.defect||0; x.setup+=+r.setup||0; x.down+=+r.downtime||0; x.shifts.add(r.date+r.shift+r.lineId); });
  return Object.values(m).sort((a,b)=>state.groupBy==='day'?b.k.localeCompare(a.k):b.good-a.good);
}
function renderReports(){
  const rows=reportRows(), tot=rows.reduce((a,r)=>({good:a.good+r.good,defect:a.defect+r.defect,setup:a.setup+r.setup,down:a.down+r.down}),{good:0,defect:0,setup:0,down:0});
  $('#content').innerHTML = periodBar() + `<div class="toolbar"><span class="fl" style="margin:0">Группировать по</span><select class="sel" onchange="state.groupBy=this.value;render()">${Object.entries(GROUPS).map(([k,[l]])=>`<option value="${k}" ${state.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>${lineFilter()}<div class="sp"></div><button class="btn btn-s" onclick="exportCSV()">⬇ CSV (Excel)</button></div>

function exportCSV(){

// часы смены для оплаты: длина смены минус обед; ночные — пересечение с ночным интервалом
function payHours(){ const s=DB.settings||{}; return {brk:s.payBreakMin??60, nf:s.nightFrom||'22:00', nt:s.nightTo||'06:00'}; }
function shiftPay(r){
  const [a,b]=shiftWindow(r.date,r.shift,r.lineId), ph=payHours(), len=(b-a)/H, paid=Math.max(0,len-(len>6?ph.brk/60:0));
  let night=0; for(let d=addD(pd(r.date),-1); d.getTime()<b; d=addD(d,1)){ const na=d.getTime()+hm(ph.nf)*60e3; let nb=d.getTime()+hm(ph.nt)*60e3; if(nb<=na) nb+=864e5; night+=Math.max(0,Math.min(b,nb)-Math.max(a,na))/H; }
  return {len,paid,night:Math.min(night,paid)};
}
function rosterHours(sid,days){ const set=new Set(days); let n=0,paid=0,night=0; DB.roster.forEach(r=>{ if(r.staffId!==sid||!set.has(r.date)||r.absence||!r.lineId) return; const x=shiftPay(r); n++; paid+=x.paid; night+=x.night; }); return {n,paid,night}; }
function shiftClosed(r){ return DB.output.some(o=>o.date===r.date&&(r.lineId==='*'||o.lineId===r.lineId)&&+o.shift===+r.shift&&o.approved!==false); }
function rosterFact(sid,days){ const set=new Set(days), now=Date.now(); let n=0,paid=0,night=0,open=0,planN=0; const abs=[], openList=[];
  DB.roster.forEach(r=>{ if(r.staffId!==sid||!set.has(r.date)) return; if(r.absence){ abs.push(r.absence); return; } if(!r.lineId) return; planN++;
    if(shiftClosed(r)){ const x=shiftPay(r); n++; paid+=x.paid; night+=x.night; } else if(shiftWindow(r.date,r.shift,r.lineId)[1]<=now){ open++; openList.push(`${fdate(r.date)} ${esc(lineShort(byId(DB.lines,r.lineId)))}·${r.shift}`); } });
  return {n,paid,night,open,openList,planN,abs}; }
async function setRoster(d,sid,v,n,mine){
  const id=fbKey(d+'_'+sid);
  if(!v&&n&&!mine){ render(); return; }
  if(!v){ await Store.batch([{col:'roster',id,del:true}]); return; }
  const [a,b]=v.split('|');
  if(a==='abs'){ await Store.batch([{col:'roster',obj:{id,date:d,staffId:sid,lineId:'',shift:0,absence:b,by:state.me.name}}]); return; }
  const [l1,l2]=a.split('+');
  await Store.batch([{col:'roster',obj:{id,date:d,staffId:sid,lineId:l1,alt:l2||'',shift:+b,by:state.me.name}}]);
}
async function rosterCopyWeek(){
  const list=[]; const have=new Set(DB.roster.map(r=>r.date+'|'+r.staffId));
  for(let d=pd(state.rsFrom); iso(d)<=state.rsTo; d=addD(d,1)){ const ds=iso(d), src=iso(addD(d,-7));
    DB.roster.filter(r=>r.date===src&&r.lineId).forEach(r=>{ if(have.has(ds+'|'+r.staffId)) return; if(!dayShifts(r.lineId,ds,LIVE).includes(+r.shift)) return; const id=fbKey(ds+'_'+r.staffId); list.push({col:'roster',obj:{...r,id,date:ds,by:state.me.name}}); have.add(ds+'|'+r.staffId); }); }
  if(!list.length) return toast('Нечего копировать — дни уже заполнены или неделю назад было пусто');
  await Store.batch(list); toast(`Заполнено назначений: ${list.length}`);
}

function normalize(db){
  COLS.forEach(c=>db[c]=A(db[c])); db.images=db.images&&typeof db.images==='object'?db.images:{}; db.audit=A(db.audit).map(e=>({...e,items:A(e.items).map(i=>({...i,ch:A(i.ch)}))}));
  db.projects.forEach(p=>p.stations=A(p.stations));
  db.semis.forEach(s=>{ s.items=A(s.items); s.history=A(s.history); });
  db.runs.forEach(r=>{ r.stations=A(r.stations); r.settings=A(r.settings); r.rawFact=r.rawFact||{}; r.writtenMap=r.writtenMap||{}; r.log=A(r.log); r.outputIds=A(r.outputIds); r.sec=r.sec||{}; });
  db.scenarios.forEach(s=>{ s.items=A(s.items); s.downs=A(s.downs); s.lineShifts=s.lineShifts||{}; });
  db.lines.forEach(l=>{ l.workShifts=A(l.workShifts); l.workDays=A(l.workDays); });
  Object.values(db.approved||{}).forEach(a=>{ if(a){ a.items=A(a.items); a.items.forEach(i=>i.segs=A(i.segs)); } });
  return db;
}

function fbSafe(v){ if(Array.isArray(v)) return v.map(fbSafe); if(v&&typeof v==='object'){ const o={}; Object.entries(v).forEach(([k,x])=>{ if(x!==undefined) o[fbKey(k)]=fbSafe(x); }); return o; } return v; }
function applyLocal(list){
  list.forEach(x=>{
    if(x.path){ let o=DB; x.path.slice(0,-1).forEach(k=>{ o[k]=o[k]||{}; o=o[k]; }); o[x.path[x.path.length-1]]=x.val==null?undefined:clone(x.val); }
    else if(x.del) DB[x.col]=DB[x.col].filter(o=>o.id!==x.id);
    else { const obj=clone(x.obj), i=DB[x.col].findIndex(o=>o.id===obj.id); if(i>=0) DB[x.col][i]=obj; else DB[x.col].push(obj); }
  });
  normalize(DB); _factMap=null; _calMap=null; _sch.clear();
}

function audItems(list){
  return list.filter(x=>x.col!=='planLog').map(x=>{
    if(x.path) return {col:x.path[0],op:x.val==null?'del':'set',name:x.path.slice(1).join(' / ')};
    const id=x.obj?x.obj.id:x.id, old=byId(A(DB[x.col]),id);
    if(x.del) return old?{col:x.col,op:'del',name:audName(x.col,old)}:null;
    if(!old) return {col:x.col,op:'add',name:audName(x.col,x.obj)};
    const ch=audDiff(old,x.obj); return ch.length?{col:x.col,op:'upd',name:audName(x.col,x.obj),ch}:null;
  }).filter(Boolean);
}

}

const Store = {
  async put(col,obj){ return this.batch([{col,obj}]); },
  async del(col,id){ return this.batch([{col,id,del:true}]); },
  async batch(list){
    const aud=audItems(list);
    applyLocal(list);
    if(state.mode==='fb'){ const up={}; list.forEach(x=>{ if(x.path) up[x.path.map(fbKey).join('/')]=x.val==null?null:fbSafe(clone(x.val)); else up[`${x.col}/${fbKey(x.obj?x.obj.id:x.id)}`]=x.del?null:fbSafe(clone(x.obj)); });
      if(!$('#modal').classList.contains('open')) render(); return fdb.ref(`${ROOT}/data`).update(up).then(()=>audit(aud)).catch(e=>{ toast(/permission/i.test(e.message||'')?'Нет прав на это действие — изменение отменено':'Ошибка записи: '+e.message); throw e; }); }
    audit(aud); demoSave(); render();
  },
  async settings(s){
    const ch=audDiff(DB.settings,s), aud=ch.length?[{col:'settings',op:'upd',name:'Настройки',ch}]:[];
    if(state.mode==='fb'){ DB.settings=clone(s); return fdb.ref(`${ROOT}/data/settings`).set(fbSafe(clone(s))).then(()=>audit(aud)).catch(e=>{ toast(authErr(e)); throw e; }); }
    DB.settings=s; audit(aud); demoSave(); $('#orgName').textContent=s.orgName; render();
  },
  async user(u,delId){
    if(u){ const i=DB.members.findIndex(m=>m.id===u.id); if(i>=0) DB.members[i]=u; else DB.members.push(u); } else DB.members=DB.members.filter(m=>m.id!==delId);
    demoSave(); render();
  },
};

    if(!st) await fdb.ref(`${ROOT}/data/settings`).set(fbSafe({...DEFAULT_SETTINGS,orgName})); else if(!st.orgName) await fdb.ref(`${ROOT}/data/settings/orgName`).set(orgName);
    try{ localStorage.removeItem('pdd_session'); }catch(e){}
    _setupBusy=false; openData(uid);
  }catch(e){ _setupBusy=false; amsg(authErr(e)); $('#aBtn').disabled=false; }
}
async function onAuth(u){
  if(_setupBusy) return;
  if(!u||u.isAnonymous){ if(u) await auth.signOut().catch(()=>{});
    let has=true; try{ has=(await fdb.ref(`${ROOT}/logins`).limitToFirst(1).once('value')).exists(); }catch(e){}
    return authScreen(has?'login':'setup'); }
  let me=null; try{ me=(await fdb.ref(`${ROOT}/users/${u.uid}`).once('value')).val(); }catch(e){}
  if(!me) return authScreen('denied','Для этого аккаунта нет доступа к производству. Обратитесь к администратору.');
  if(me.active===false) return authScreen('denied','Ваш доступ отключён администратором.');
  openData(u.uid);
}
function openData(uid){
  state.mode='fb'; let first=true, data=null, users=null;
  if(_dataRef) _dataRef.off(); if(_usersRef) _usersRef.off();
  const arr=o=>Object.entries(o||{}).filter(([,x])=>x).map(([id,x])=>({...x,id}));
  const apply=()=>{
    if(!data||!users) return;
    const me=users[uid]; if(!me||me.active===false){ toast('Доступ отключён'); logout(); return; }
    const d=data, db={members:arr(users).filter(u=>u.login),settings:{...DEFAULT_SETTINGS,...(d.settings||{})},approved:d.approved||{}};
    COLS.forEach(c=>db[c]=arr(d[c]));
    if(!db.projects.length&&d.products) db.projects=arr(d.products).map(p=>({...p,speed:80,setupMin:+p.setupNorm||60,stations:[],status:'Активный'}));
    if(!db.raw.length&&d.stock) db.raw=arr(d.stock).map(s=>({...s,cost:0}));
    db.output.forEach(r=>{ if(!r.projectId&&r.productId) r.projectId=r.productId; });
    db.orders.forEach(o=>{ if(!o.projectId&&o.productId) o.projectId=o.productId; });
    DB=normalize(db);
    state.me={id:uid,name:me.name,role:me.role,login:me.login,email:me.email,personId:me.personId||''};
    if(me.role==='admin'&&!(d.settings&&d.settings.projTabs)&&!state._ptInit){ state._ptInit=1; fdb.ref(`${ROOT}/data/settings/projTabs`).set(ptMatrix()).catch(()=>{}); }
    if(first){ first=false; enterApp(); probeSecurity(); audit([{col:'session',op:'login',name:'вход в программу'}]); }
    else { $('#meName').textContent=me.name; $('#meRole').textContent=ROLES[me.role]?.n||''; $('#orgName').textContent=DB.settings.orgName; if(!$('#modal').classList.contains('open')) render(); }
  };
  const fail=err=>authScreen('offline','Нет доступа к базе: '+err.message);
  _dataRef=fdb.ref(`${ROOT}/data`); _dataRef.on('value',s=>{ data=s.val()||{}; apply(); },fail);
  _usersRef=fdb.ref(`${ROOT}/users`); _usersRef.on('value',s=>{ users=s.val()||{}; apply(); },fail);
}
// проверка: закрыта ли база для посторонних (читаем без входа через отдельное подключение)
async function probeSecurity(){
  try{ const app=firebase.apps.find(a=>a.name==='probe')||firebase.initializeApp(FB_CONFIG,'probe');
    await Promise.race([app.database().ref(`${ROOT}/data/settings`).once('value'),wait(8000).then(()=>{ throw new Error('timeout'); })]); _secure=false;
  }catch(e){ _secure=/permission/i.test(e.message||e.code||'')?true:null; }
  if(state.sec==='staff'||state.sec==='settings') render(); buildNav();
}
const secBanner=()=>state.mode==='fb'&&_secure===false&&can('admin')?`<div class="msg err" style="display:block;margin-bottom:14px"><b>⚠ База открыта для всех.</b> Пароли работают, но данные можно прочитать без входа. Примените правила безопасности для блока <b>"prod"</b> в Firebase (Realtime Database → Rules) — инструкция в разделе «Сотрудники и доступы».</div>`:'';
// создание учётной записи в Firebase Auth через отдельное подключение (текущий вход не сбрасывается)
async function createAuthUser(email,pass){
  const app=firebase.apps.find(a=>a.name==='creator')||firebase.initializeApp(FB_CONFIG,'creator'), a=app.auth();
  try{ await a.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){}
  const c=await a.createUserWithEmailAndPassword(email,pass); const uid=c.user.uid; await a.signOut().catch(()=>{}); return uid;
}
async function seedLive(){
  if(!confirm('Заполнить базу примером? Текущие данные (кроме пользователей и настроек) будут заменены.')) return;
  const g=genDemo(), up={}, o=x=>Object.fromEntries(x.map(i=>[i.id,i]));
  COLS.forEach(c=>up[c]=o(g[c])); up.approved=g.approved; up.products=null; up.stock=null;
  try{ await fdb.ref(`${ROOT}/data`).update(fbSafe(clone(up))); toast("Пример загружен"); }catch(e){ toast(authErr(e)); }
}
async function clearLive(){
  if(!confirm('Удалить ВСЕ данные: выпуск, план, проекты, рецептуры, сырьё, склад, персонал, график? Учётные записи и настройки останутся.')) return;
  if(prompt('Для подтверждения напишите: УДАЛИТЬ')!=='УДАЛИТЬ') return;
  const up={approved:null,products:null,stock:null}; COLS.forEach(c=>up[c]=null);
  try{ await fdb.ref(`${ROOT}/data`).update(up); toast('Данные очищены'); }catch(e){ toast(authErr(e)); }
}
async function logout(){
  try{ localStorage.removeItem('pdd_session'); }catch(e){}
  if(_dataRef){ _dataRef.off(); _dataRef=null; } if(_usersRef){ _usersRef.off(); _usersRef=null; }
  $('#app').style.display='none';
  if(state.mode==='demo'&&!fdb){ authScreen('demo'); return; }
  if(auth&&auth.currentUser){ await auth.signOut().catch(()=>{}); return; } // onAuth покажет вход
  if(fdb) onAuth(null); else authScreen('demo');
}
let _authSub=null;
async function connect(){
  authScreen('loading');
  try{
    if(!firebase.apps.find(a=>a.name==='[DEFAULT]')) firebase.initializeApp(FB_CONFIG);
    fdb=firebase.database(); auth=firebase.auth();
    if(_authSub) _authSub();
    _authSub=auth.onAuthStateChanged(u=>{ onAuth(u).catch(e=>authScreen('offline',e.message)); });
  }catch(e){ fdb=null; authScreen('offline',e.message); }
}
// смена своего пароля
function openMyPassword(){
  if(state.mode!=='fb') return toast('В демо пароли не используются');
  modal('Сменить пароль',`<div class="fg"><label class="fl">Текущий пароль</label><input class="fi" name="cur" type="password" autocomplete="current-password" autofocus></div>
    <div class="frow"><div class="fg"><label class="fl">Новый пароль (мин. 6)</label><input class="fi" name="n1" type="password" autocomplete="new-password"></div><div class="fg"><label class="fl">Повторите</label><input class="fi" name="n2" type="password" autocomplete="new-password"></div></div>`,
  async f=>{ if((f.n1||'').length<6){ toast('Минимум 6 символов'); return false; } if(f.n1!==f.n2){ toast('Пароли не совпадают'); return false; }
    try{ const u=auth.currentUser; await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,f.cur)); await u.updatePassword(f.n1); audit([{col:'users',op:'pwd',name:`${state.me.login} · сам себе`}]); toast('Пароль изменён'); }
    catch(e){ toast(authErr(e)); return false; } },'Сменить');
}
(function boot(){
  if(/[?&#]demo\b/.test(location.search+location.hash)){ startDemo(); return; }
  if(!window.firebase||!FB_CONFIG.apiKey){ authScreen('demo'); return; }
  connect();
})();
</script>
