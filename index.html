<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Производство день за днём</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --card2:#f7f8fa; --line:#e6e9ef; --line2:#d8dde6;
  --text:#1c2230; --text2:#5b6576; --text3:#98a1b1;
  --brand:#e2462c; --brand2:#ff7a45; --brandBg:rgba(226,70,44,.09);
  --green:#1fa971; --greenBg:rgba(31,169,113,.1); --amber:#e89a12; --amberBg:rgba(232,154,18,.12);
  --blue:#3b7cf6; --blueBg:rgba(59,124,246,.1); --red:#e5484d; --redBg:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.04);
  --side:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --card:#171b23; --card2:#1d222c; --line:#262c38; --line2:#323a48;
  --text:#eef1f6; --text2:#a5aebd; --text3:#6b7485; --brandBg:rgba(226,70,44,.16); --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(226,70,44,.35)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.15}
.brand-tag{font-size:11px;color:var(--text3);font-weight:600}
.auth h2{font-size:20px;font-weight:800;margin:26px 0 6px}
.auth p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5}
.fg{margin-bottom:13px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fi{width:100%;padding:10px 12px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--brand)}
.fi:disabled{background:var(--card2);color:var(--text2)}
textarea.fi{resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none;line-height:1.45}
.msg.err{display:block;background:var(--redBg);color:var(--red)}
.link{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:var(--card);border-color:var(--line2);color:var(--text)}
.btn-s:hover{border-color:var(--text3)}
.btn-d{background:var(--redBg);color:var(--red)}
.btn-g{background:var(--greenBg);color:var(--green)}
.btn-w{width:100%}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

.app{display:none;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.side .brand{padding:18px 16px 14px}
.nav{flex:1;overflow-y:auto;padding:2px 10px}
.nav-g{font-size:10.5px;font-weight:800;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;padding:13px 10px 5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:var(--text2);font-weight:600;cursor:pointer;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--brandBg);color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--redBg);color:var(--red);border-radius:6px;padding:1px 6px;font-weight:800}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.me-name{font-weight:700;font-size:13px;line-height:1.2}
.me-role{font-size:11px;color:var(--text3)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top .sp{flex:1}
.burger{display:none}
.mode{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
.mode.demo{background:var(--amberBg);color:var(--amber)}
.mode.live{background:var(--greenBg);color:var(--green)}
.content{padding:4px 28px 40px;max-width:1500px;width:100%}

.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card)}
.range{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:3px 8px}
.range input{border:0;background:none;outline:none;padding:4px 2px;font-weight:600;font-size:12.5px}
.range span{color:var(--text3)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-t{font-weight:800;font-size:15px}
.card-s{font-size:12px;color:var(--text3);font-weight:600}
.card-h .sp,.toolbar .sp{flex:1}
.kpi .kl{font-size:12px;color:var(--text2);font-weight:700}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:8px 0 6px;white-space:nowrap}
.kpi .kv small{font-size:13px;color:var(--text3);font-weight:700;letter-spacing:0}
.kd{font-size:11.5px;font-weight:700}
.kd.up{color:var(--green)} .kd.down{color:var(--red)} .kd.flat{color:var(--text3)}
.kpi.accent{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.kpi.accent .kl,.kpi.accent .kv small,.kpi.accent .kd{color:rgba(255,255,255,.9)}
.g2{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.row-gap{margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.hb-top b{font-weight:700}
.hb-top span{color:var(--text2);font-weight:600;white-space:nowrap}
.track{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px}
.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wk .b{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--brandBg)}
.wk .b.top{background:var(--brand)}
.wk small{font-size:11px;color:var(--text3);font-weight:700}
.donut{display:flex;align-items:center;gap:16px}
.dl{flex:1;min-width:0}
.dl div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.dl i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dl span{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{font-weight:800}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sh{background:var(--card2);border-radius:12px;padding:13px}
.sh .n{font-size:12px;font-weight:700;color:var(--text2)}
.sh .v{font-size:19px;font-weight:800;margin:4px 0 2px}
.sh .d{font-size:11.5px;color:var(--text3);font-weight:600}

.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.tw.flush{margin-top:-18px;border-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;background:var(--card2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr:hover td{background:var(--card2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:800;background:var(--card2)}
.ed td{padding:6px 7px;vertical-align:middle}
.ed .fi{padding:7px 8px;font-size:13px;border-radius:8px;min-width:64px}
.ed select.fi{min-width:200px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-green{background:var(--greenBg);color:var(--green)} .t-red{background:var(--redBg);color:var(--red)}
.t-amber{background:var(--amberBg);color:var(--amber)} .t-blue{background:var(--blueBg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--text2)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog .track{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-weight:600;font-size:12.5px;outline:none}
.empty{text-align:center;padding:36px 10px;color:var(--text3);font-weight:600}
.muted{color:var(--text3)}
.hint{font-size:12.5px;color:var(--text2);line-height:1.55}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15);margin-right:6px;flex-shrink:0}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-style:normal;font-weight:800;color:rgba(0,0,0,.55)}
.stn{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--text);color:var(--card);align-items:center;justify-content:center;font-weight:800;font-size:12px}
.note{background:var(--amberBg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:800}
.log{max-height:420px;overflow:auto}
.log div{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.log div small{display:block;color:var(--text3);font-weight:700;font-size:11px}
.log div.meet{background:var(--blueBg);border-radius:8px;padding:9px 10px;border:0;margin:4px 0}

/* gantt */
.gantt{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.g-in{position:relative}
.g-head,.g-row{display:flex}
.g-lab{position:sticky;left:0;z-index:4;width:160px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:9px 12px;font-weight:700;font-size:12.5px;line-height:1.25}
.g-lab small{display:block;color:var(--text3);font-weight:600;font-size:11px}
.g-days{position:relative;flex-shrink:0}
.g-day{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--text3);font-weight:800;text-align:center;padding-top:5px;line-height:1.2}
.g-day.we{background:var(--card2)}
.g-day.td{color:var(--brand)}
.g-row{height:58px;border-top:1px solid var(--line)}
.g-bar{position:absolute;top:8px;height:34px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:800;padding:3px 7px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);line-height:1.3;z-index:1}
.g-bar small{display:block;font-weight:600;opacity:.9;font-size:10.5px}
.g-bar.conf{outline:2px solid var(--red);outline-offset:1px}
.g-bar.late{box-shadow:inset 0 -3px 0 var(--red),0 1px 3px rgba(0,0,0,.25)}
.g-bar.done{opacity:.55}
.g-ghost{position:absolute;top:46px;height:6px;border-radius:3px;border:1.5px dashed var(--text3);opacity:.8}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}

.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:60;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.modal-c{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-c.wide{max-width:820px}
.modal-c h3{font-size:18px;font-weight:800;margin-bottom:18px;display:flex;align-items:center}
.modal-c h3 .sp{flex:1}
.modal-f{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-f .sp{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--text);color:var(--card);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;transition:transform .3s;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--card);font-size:12px;font-weight:600;padding:8px 10px;border-radius:9px;z-index:98;display:none;line-height:1.5;white-space:nowrap}
.scrim{display:none}

@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.g2,.g3,.g11{grid-template-columns:1fr}.k4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .side{transform:translateX(-100%)} .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0} .burger{display:flex}
  .top{padding:12px 16px 10px} .top h1{font-size:19px} .content{padding:4px 16px 30px}
  .kpis{grid-template-columns:repeat(2,1fr)} .range{margin-left:0;width:100%;justify-content:center}
  .shifts{grid-template-columns:1fr} .top .hide-m{display:none} .frow3{grid-template-columns:1fr 1fr}
  .g-lab{width:110px}
}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">ПД</div><div><div class="brand-name">Производство день за днём</div><div class="brand-tag">выпуск · планы · рецептуры · склад</div></div></div>
    <div id="authBody"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">ПД</div><div><div class="brand-name">Производство день за днём</div><div class="brand-tag" id="orgName"></div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="av" id="meAv">?</div>
      <div style="flex:1;min-width:0"><div class="me-name" id="meName"></div><div class="me-role" id="meRole"></div></div>
      <button class="icon-btn" title="Выйти" onclick="logout()"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn burger" onclick="toggleSide(true)"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="pageTitle">Дашборд</h1>
      <div class="sp"></div>
      <span class="mode" id="modeTag"></span>
      <select class="sel hide-m" id="roleSwitch" style="display:none" onchange="demoRole(this.value)" title="Посмотреть интерфейс глазами роли"></select>
      <button class="btn btn-p" id="quickAdd" onclick="openOutputModal()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-m">Внести выпуск</span></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-c" id="modalC">
    <h3><span id="mTitle"></span><span class="sp"></span><button class="icon-btn" onclick="closeModal()">✕</button></h3>
    <form id="mForm" onsubmit="event.preventDefault();document.getElementById('mSave').click()"><div id="mBody"></div></form>
    <div class="modal-f"><span id="mExtra"></span><span class="sp"></span><button class="btn btn-s" onclick="closeModal()">Отмена</button><button class="btn btn-p" id="mSave">Сохранить</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
// ═════════════════════════════════════════════
//  CONFIG — тот же Firebase, что у FinFlow (открытый режим для демо).
//  Всё приложение живёт в ветке /prod и не трогает другие данные.
// ═════════════════════════════════════════════
const FB_CONFIG = {
  apiKey: "AIzaSyBZ1b6yf1WQbhZ7lhIbeYw_fKc4k88mmFc",
  authDomain: "family-budget-32149.firebaseapp.com",

function unitCost(kind,id,seen=new Set()){
  if(kind==='raw') return +byId(DB.raw,id)?.cost||0;
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return 0;
  const ns=new Set(seen); ns.add(id);
  return A(s.items).reduce((a,it)=>a+(+it.qty||0)*unitCost(it.kind,it.id,ns),0)/(+s.yield||1);
}
function expand(kind,id,qty,acc={},seen=new Set()){
  if(!id) return acc;
  if(kind==='raw'){ acc[id]=(acc[id]||0)+qty; return acc; }
  const s=byId(DB.semis,id); if(!s||seen.has(id)) return acc;
  const ns=new Set(seen); ns.add(id); const f=qty/(+s.yield||1);
  A(s.items).forEach(it=>expand(it.kind,it.id,(+it.qty||0)*f,acc,ns));
  return acc;
}
function semiContains(semiId,target,seen=new Set()){
  const s=byId(DB.semis,semiId); if(!s||seen.has(semiId)) return false; seen.add(semiId);
  return A(s.items).some(it=>it.kind==='semi'&&(it.id===target||semiContains(it.id,target,seen)));
}
// потребность проекта: сырьё (через рецептуры станций) + тара 1 шт на изделие
function projectReq(p,qty,withTare=true){
  const acc={};
  A(p.stations).forEach(st=>{ if(st.semiId&&+st.norm) expand('semi',st.semiId,(+st.norm)*qty/1e6,acc); });
  if(withTare&&p.tareId) acc[p.tareId]=(acc[p.tareId]||0)+qty;
  return acc;
}
const stationKg = (norm,qty) => (+norm||0)*(+qty||0)/1e6;
function projectCost1000(p){ return A(p.stations).reduce((a,st)=>a+stationKg(st.norm,1000)*unitCost('semi',st.semiId),0); }
function projectKg1000(p){ return A(p.stations).reduce((a,st)=>a+stationKg(st.norm,1000),0); }
const semiName = id => byId(DB.semis,id)?.name || '—';
const semiColor = id => byId(DB.semis,id)?.color || '#ddd';
function stationDots(p){ return `<span class="dots">${A(p.stations).map((st,i)=>`<i style="background:${semiColor(st.semiId)}" data-tip="${i+1}: ${esc(semiName(st.semiId))}"></i>`).join('')}</span>`; }

// ═════════════════════════════════════════════
//  METRICS — план берётся из утверждённого плана месяца, иначе из мощности линий
// ═════════════════════════════════════════════
function planDay(ds,lineId){
  const ap=DB.approved?.[ds.slice(0,7)], lf=lineId||state.lineF;
  if(ap&&A(ap.items).length){
    const d0=pd(ds).getTime(), d1=d0+864e5; let s=0;
    A(ap.items).forEach(it=>{ if(lf&&it.lineId!==lf) return; const a=tms(it.start), b=a+(+it.hours||0)*H, ov=Math.max(0,Math.min(b,d1)-Math.max(a,d0)); if(ov&&+it.hours) s+=(+it.qty||0)*ov/((+it.hours)*H); });
    return s;
  }
  const wd=pd(ds).getDay(); if(!(DB.settings.workDays||[1,2,3,4,5]).includes(wd)) return 0;
  const k=DB.settings.planFactor??0.85;
  return DB.lines.filter(l=>!lf||l.id===lf).reduce((s,l)=>s+(+l.cap||0)*(+l.shifts||1)*k,0);
}
function planRange(f,t,lineId){ let s=0; for(let d=pd(f); iso(d)<=t; d=addD(d,1)) s+=planDay(iso(d),lineId); return s; }
function metrics(recs,f,t){
  const good=recs.reduce((s,r)=>s+(+r.good||0),0), defect=recs.reduce((s,r)=>s+(+r.defect||0),0);
  const down=recs.reduce((s,r)=>s+(+r.downtime||0),0), setup=recs.reduce((s,r)=>s+(+r.setup||0),0);
  const shiftsN=new Set(recs.map(r=>r.date+'|'+r.shift+'|'+r.lineId)).size, shiftMin=(DB.settings.shiftHours||8)*60, plan=planRange(f,t);
  return {good,defect,down,setup,shiftsN,plan, planPct:plan?good/plan*100:0, defPct:good+defect?defect/(good+defect)*100:0,
    perShift:shiftsN?good/shiftsN:0, setupPct:shiftsN?setup/(shiftsN*shiftMin)*100:0, avail:shiftsN?(1-(down+setup)/(shiftsN*shiftMin))*100:0};
}
function delta(cur,prev,lowerBetter){
  if(!prev) return `<div class="kd flat">нет данных за пред. период</div>`;
  const d=(cur-prev)/prev*100, good=lowerBetter?d<0:d>0;
  if(Math.abs(d)<0.5) return `<div class="kd flat">≈ как в пред. периоде</div>`;
  return `<div class="kd ${good?'up':'down'}">${d>0?'▲':'▼'} ${P(Math.abs(d),0)} к пред. периоду</div>`;
}
function orderDone(o){ return DB.output.filter(r=>r.orderId===o.id).reduce((s,r)=>s+(+r.good||0),0); }
function orderShipped(o){ return DB.moves.filter(m=>m.type==='ship'&&m.orderId===o.id).reduce((s,m)=>s+(+m.qty||0),0); }
function orderStatus(o){ if(orderShipped(o)>=o.qty) return 'shipped'; const d=orderDone(o); if(d>=o.qty) return 'done'; if(o.due<iso(new Date())) return 'overdue'; return d>0?'work':'new'; }
function orderStats(){ const s={shipped:0,done:0,overdue:0,work:0,new:0}; DB.orders.forEach(o=>s[orderStatus(o)]++); return s; }
const OST = {shipped:['Отгружен','t-green'],done:['Произведён','t-green'],overdue:['Просрочен','t-red'],work:['В работе','t-blue'],new:['Новый','t-gray']};

//  MATERIALS — прогноз остатков и проверка позиций плана
// ═════════════════════════════════════════════
function activePlanReq(){ // позиции плана, которые ещё будут потреблять сырьё
  const now=Date.now();
  return DB.plan.map(it=>{ const p=byId(DB.projects,it.projectId); if(!p) return null; const a=tms(it.start), b=endMs(it); if(b<=now) return null;
    const frac=a>=now?1:(b-now)/Math.max(1,b-a); return {it,p,d:a>=now?it.start.slice(0,10):iso(new Date()),req:projectReq(p,(+it.qty||0)*frac)}; })
    .filter(Boolean).sort((x,y)=>x.it.start.localeCompare(y.it.start));
}
function demandForecast(){
  const rows={};
  DB.raw.forEach(r=>rows[r.id]={r,stock:+r.qty||0,need:0,incoming:0,events:[]});
  activePlanReq().forEach(({it,d,req})=>Object.entries(req).forEach(([rid,q])=>{ if(rows[rid]){ rows[rid].need+=q; rows[rid].events.push({d,q:-q,it}); } }));
  DB.supplies.filter(s=>s.status!=='received').forEach(s=>{ if(rows[s.rawId]){ rows[s.rawId].incoming+=+s.qty||0; rows[s.rawId].events.push({d:s.date,q:+s.qty||0}); } });
  Object.values(rows).forEach(x=>{
    x.events.sort((a,b)=>a.d.localeCompare(b.d)||b.q-a.q);
    let bal=x.stock; x.deficitDate=null; x.maxLack=0;
    x.events.forEach(e=>{ bal+=e.q; if(bal<-1e-6){ if(!x.deficitDate) x.deficitDate=e.d; x.maxLack=Math.max(x.maxLack,-bal); } });
    x.end=bal;
  });
  return rows;
}
function planMaterialCheck(){
  const sup=DB.supplies.filter(s=>s.status!=='received'), used={}, res={};
  const supBy=(rid,d)=>sup.filter(s=>s.rawId===rid&&s.date<=d).reduce((a,s)=>a+(+s.qty||0),0);
  activePlanReq().forEach(({it,d,req})=>{
    const lacks=[];
    Object.entries(req).forEach(([rid,need])=>{
      const base=(+byId(DB.raw,rid)?.qty||0)-(used[rid]||0);
      if(base+supBy(rid,d)<need-1e-6){
        const when=[...new Set(sup.filter(s=>s.rawId===rid).map(s=>s.date))].sort().find(dd=>base+supBy(rid,dd)>=need-1e-6)||null;
        lacks.push({rid,need,lack:need-base-supBy(rid,d),when});
      }
      used[rid]=(used[rid]||0)+need;
    });
    res[it.id]={lacks,ready:lacks.length?(lacks.every(l=>l.when)?lacks.map(l=>l.when).sort().pop():null):d};
  });
  return res;
}
function matTag(chk){
  if(!chk) return '<span class="tag t-gray">выполнено</span>';
  if(!chk.lacks.length) return '<span class="tag t-green">сырьё есть</span>';
  const tip=chk.lacks.map(l=>`${esc(rawName(l.rid))}: не хватает ${Q(l.lack)} ${esc(byId(DB.raw,l.rid)?.unit||'')}${l.when?' (поставка '+fdate(l.when)+')':''}`).join('<br>');
  return chk.ready?`<span class="tag t-amber" data-tip="${tip}">дефицит · будет ${fdate(chk.ready)}</span>`:`<span class="tag t-red" data-tip="${tip}">дефицит · нет поставки</span>`;
}

function buckets(f,t){
  const n=span(f,t), mode=n<=62?'day':n<=400?'week':'month', out=[]; let cur=null;
  for(let d=pd(f); iso(d)<=t; d=addD(d,1)){
    const s=iso(d); let key,label;
    if(mode==='day'){ key=s; label=n<=14?WD[(d.getDay()+6)%7]+' '+d.getDate():String(d.getDate()); }
    else if(mode==='week'){ const m=addD(d,-((d.getDay()+6)%7)); key=iso(m); label=fdate(key); }
    else { key=s.slice(0,7); label=MON[d.getMonth()]; }
    if(!cur||cur.key!==key){ cur={key,label,from:s,to:s,good:0,defect:0,plan:0}; out.push(cur); }
    cur.to=s; cur.plan+=planDay(s);
  }
  const map={}; out.forEach(b=>{ for(let d=pd(b.from); iso(d)<=b.to; d=addD(d,1)) map[iso(d)]=b; });
  filtered(inRange(f,t)).forEach(r=>{ const b=map[r.date]; if(b){ b.good+=+r.good||0; b.defect+=+r.defect||0; } });
  return {mode,data:out};
}
function barChart(el,{data}){
  const W=Math.max(el.clientWidth,280), Hh=270, pl=44, pr=8, pt=12, pb=28, iw=W-pl-pr, ih=Hh-pt-pb;
  const max=Math.max(1,...data.map(d=>Math.max(d.good+d.defect,d.plan)))*1.1;
  const y=v=>pt+ih-(v/max)*ih, bw=iw/data.length, gap=Math.min(bw*.28,10), step=Math.ceil(data.length/(iw/44));
  let s=`<svg width="${W}" height="${Hh}">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--text3)" font-weight="600">${short(v)}</text>`; }
  data.forEach((d,i)=>{
    const x=pl+i*bw+gap/2, w=Math.max(bw-gap,1), yg=y(d.good), yd=y(d.good+d.defect);
    s+=`<rect x="${x}" y="${yg}" width="${w}" height="${pt+ih-yg}" rx="${Math.min(3,w/3)}" fill="var(--brand)"/>`;
    if(d.defect) s+=`<rect x="${x}" y="${yd}" width="${w}" height="${yg-yd}" fill="var(--amber)"/>`;
    if(i%step===0) s+=`<text x="${x+w/2}" y="${Hh-9}" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">${esc(d.label)}</text>`;
    const period=d.from===d.to?fdate(d.from):fdate(d.from)+' — '+fdate(d.to);
    s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="<b>${period}</b><br>Годные: ${N(d.good)} шт<br>Брак: ${N(d.defect)} шт<br>План: ${N(d.plan)} шт${d.plan?' · '+P(d.good/d.plan*100,0):''}"/>`;
  });
  s+=`<polyline points="${data.map((d,i)=>`${pl+i*bw+bw/2},${y(d.plan)}`).join(' ')}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55" style="pointer-events:none"/>`;
  el.innerHTML=s+'</svg>';
}
function donut(parts,unit='шт брака'){
  const total=parts.reduce((s,p)=>s+p.v,0); if(!total) return `<div class="empty">Нет данных</div>`;
  const r=62, c=2*Math.PI*r; let off=0;
  const segs=parts.map((p,i)=>{ const len=p.v/total*c, seg=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="${esc(p.k)}: ${N(p.v)}"/>`; off+=len; return seg; }).join('');
  return `<div class="donut"><svg width="160" height="160" style="flex-shrink:0">${segs}<text x="80" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">${short(total)}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="var(--text3)" font-weight="600">${unit}</text></svg>
  <div class="dl">${parts.map((p,i)=>`<div><i style="background:${COLORS[i%COLORS.length]}"></i><span>${esc(p.k)}</span><b>${P(p.v/total*100,0)}</b></div>`).join('')}</div></div>`;
}
const groupSum = (recs,keyFn,valFn=r=>+r.defect||0) => { const m={}; recs.forEach(r=>{ const k=keyFn(r); m[k]=(m[k]||0)+valFn(r); }); return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v); };

async function saveSemi(){

  const rec={...d,id:d.id||uid(),name:d.name.trim(),yield:+d.yield||1,items,updated:iso(new Date()),ver:old?.ver||1,history:A(old?.history)};
  if(old&&(JSON.stringify(A(old.items))!==JSON.stringify(items)||+old.yield!==rec.yield)){
    rec.history=[...A(old.history),{ver:old.ver||1,date:old.updated||iso(new Date()),by:old.by||'',yield:old.yield,items:A(old.items)}].slice(-20);

  else { state.draft=clone(rec); render(); }
}

function runTotals(r){
  const q=(+r.qtyGood||0)+(+r.qtyDefect||0); let plan=0, fact=0;
  A(r.stations).forEach(st=>{ const pk=stationKg(st.norm,q); plan+=pk; if(st.factKg!==''&&st.factKg!=null) fact+=+st.factKg; });
  return {plan,fact};
}
function openRun(pid,rid){
  const p=byId(DB.projects,pid); if(!p) return toast('Проект не найден');
  if(rid){ state.draft=clone(byId(DB.runs,rid)); state.draft.stations=A(state.draft.stations); state.draft.settings=A(state.draft.settings); }
  else {
    const last=lastRun(pid), t=iso(new Date());
    state.draft={id:null,projectId:pid,lineId:p.lineId,dateFrom:t,dateTo:t,qtyGood:'',qtyDefect:'',setupFact:'',speedFact:'',note:'',writtenOff:false,
      settings:A(last?.settings).length?A(last.settings).map(x=>({k:x.k,v:x.v})):(DB.settings.machineParams||[]).map(k=>({k,v:''})),
      stations:A(p.stations).filter(st=>st.semiId).map((st,i)=>{ const s=byId(DB.semis,st.semiId), ls=A(last?.stations).find(x=>x.n===i+1&&x.semiId===st.semiId);

          visc:ls?.visc??st.visc??'',press:ls?.press??st.press??'',nozzle:ls?.nozzle??st.nozzle??'',factKg:''}; })};

function pullJournal(){
  const d=state.draft, recs=DB.output.filter(r=>r.projectId===d.projectId&&r.date>=d.dateFrom&&r.date<=d.dateTo&&(!d.lineId||r.lineId===d.lineId));
  if(!recs.length) return toast('В журнале нет записей по этому проекту за эти даты');
  const g=recs.reduce((a,r)=>a+(+r.good||0),0), df=recs.reduce((a,r)=>a+(+r.defect||0),0), su=recs.reduce((a,r)=>a+(+r.setup||0),0), dn=recs.reduce((a,r)=>a+(+r.downtime||0),0);
  const runMin=recs.length*(DB.settings.shiftHours||8)*60-su-dn;
  Object.assign(d,{qtyGood:g,qtyDefect:df,setupFact:su,speedFact:runMin>0?Math.round((g+df)/runMin):''});
  renderRunEdit(); toast(`Подтянуто ${recs.length} смен из журнала`);
}
async function saveRun(){
  const d=state.draft; if(!(+d.qtyGood)&&!(+d.qtyDefect)) return toast('Укажите количество изделий');
  const rec={...d,id:d.id||uid(),qtyGood:+d.qtyGood||0,qtyDefect:+d.qtyDefect||0,setupFact:+d.setupFact||0,speedFact:+d.speedFact||0,settings:d.settings.filter(x=>x.k||x.v),by:state.me.name,ts:Date.now()};
  await Store.put('runs',rec); state.draft=clone(rec); state.draft.stations=A(rec.stations); state.draft.settings=A(rec.settings); render(); toast('Тех. отчёт сохранён');
}
async function writeOffRun(){
  const d=state.draft, q=(+d.qtyGood||0)+(+d.qtyDefect||0), use={};
  if(!q) return toast('Нет количества изделий');
  d.stations.forEach(st=>{ const kg=st.factKg!==''&&st.factKg!=null?+st.factKg:stationKg(st.norm,q); Object.entries(st.rawPerKg||{}).forEach(([rid,per])=>use[rid]=(use[rid]||0)+per*kg); });
  const noFact=d.stations.some(st=>st.factKg===''||st.factKg==null);
  if(!confirm(`Списать со склада сырьё по ${noFact?'факту (где не внесён — по норме)':'факту'}? ${Object.keys(use).length} позиций. Это действие создаст движения по складу.`)) return;
  const list=[];
  Object.entries(use).forEach(([rid,qty])=>{ const r=byId(DB.raw,rid); if(!r) return;
    list.push({col:'raw',obj:{...r,qty:Math.round(((+r.qty||0)-qty)*1000)/1000}});

function monthItems(items,mk){ const [y,m]=mk.split('-').map(Number), t0=new Date(y,m-1,1).getTime(), t1=new Date(y,m,1).getTime(); return items.filter(it=>tms(it.start)<t1&&endMs(it)>t0); }

function gantt(items,opt={}){
  const [y,m]=state.planMonth.split('-').map(Number), days=new Date(y,m,0).getDate(), t0=new Date(y,m-1,1).getTime(), t1=new Date(y,m,1).getTime();
  const HW=2, DW=24*HW, W=days*DW, now=Date.now(), td=iso(new Date());
  const head=`<div class="g-head"><div class="g-lab" style="height:36px"></div><div class="g-days" style="width:${W}px;height:36px">${Array.from({length:days},(_,i)=>{ const dt=new Date(y,m-1,i+1), we=[0,6].includes(dt.getDay());
    return `<div class="g-day ${we?'we':''} ${iso(dt)===td?'td':''}" style="left:${i*DW}px;width:${DW}px">${i+1}<br><span style="font-weight:600">${WD[(dt.getDay()+6)%7]}</span></div>`; }).join('')}</div></div>`;
  const pos=it=>{ const a=tms(it.start), b=a+(+it.hours||0)*H; if(b<=t0||a>=t1) return null; const L=Math.max(a,t0), R=Math.min(b,t1); return {a,b,left:(L-t0)/H*HW,w:Math.max(3,(R-L)/H*HW)}; };
  const rows=DB.lines.map(l=>{
    const li=items.filter(i=>i.lineId===l.id).sort((a,b)=>a.start.localeCompare(b.start)); let prevEnd=0; const conf=new Set();
    li.forEach((it,k)=>{ const a=tms(it.start); if(a<prevEnd-60e3){ conf.add(it.id); if(li[k-1]) conf.add(li[k-1].id); } prevEnd=Math.max(prevEnd,endMs(it)); });
    const hrs=li.reduce((s,it)=>{ const q=pos(it); return s+(q?(Math.min(q.b,t1)-Math.max(q.a,t0))/H:0); },0);
    const bars=li.map(it=>{ const q=pos(it); if(!q) return ''; const p=byId(DB.projects,it.projectId), o=byId(DB.orders,it.orderId), late=o&&q.b>pd(o.due).getTime()+864e5, ck=opt.chk?.[it.id];
      const tip=`<b>${esc(p?.name||'—')}</b><br>${esc(lineName(it.lineId))}<br>${fdt(q.a)} → ${fdt(q.b)} · ${Q(it.hours,1)} ч<br>${N(it.qty)} шт${o?`<br>Заказ ${esc(o.no)} · срок ${fdate(o.due)}${late?' — НЕ УСПЕВАЕМ':''}`:''}${ck&&ck.lacks.length?'<br>⚠ дефицит сырья':''}${it.note?'<br>'+esc(it.note):''}`;
      return `<div class="g-bar ${conf.has(it.id)?'conf':''} ${late?'late':''} ${q.b<now?'done':''}" style="left:${q.left}px;width:${q.w}px;background:${pColor(p)}" data-tip="${tip.replace(/"/g,'&quot;')}" ${opt.editable?`onclick="openPlanItem('${it.id}')"`:''}>${ck&&ck.lacks.length?'⚠ ':''}${esc(p?.name||'—')}<small>${N(it.qty)} шт · ${Q(it.hours,0)} ч</small></div>`; }).join('');
    const ghosts=A(opt.ghost).filter(i=>i.lineId===l.id).map(it=>{ const q=pos(it); return q?`<div class="g-ghost" style="left:${q.left}px;width:${q.w}px" data-tip="Утверждено: ${esc(projName(it.projectId))}<br>${fdt(q.a)} → ${fdt(q.b)}"></div>`:''; }).join('');
    return `<div class="g-row"><div class="g-lab">${esc(l.name)}<small>${Q(hrs,0)} ч · загрузка ${P(hrs/(days*24)*100,0)}</small></div><div class="g-days" style="width:${W}px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:${DW}px 100%">${ghosts}${bars}</div></div>`;
  }).join('');
  const nowX=now>t0&&now<t1?`<div class="g-now" style="left:${160+(now-t0)/H*HW}px"></div>`:'';
  return `<div class="gantt"><div class="g-in" style="width:${W+160}px">${head}${rows}${nowX}</div></div>`;
}
function planTable(items,chk,editable){

function planCalc(projChanged,hintOnly){
  const F0=$('#mForm'); if(!F0) return; const F=F0.elements, p=byId(DB.projects,F.projectId.value);
  if(projChanged&&p){ F.lineId.value=p.lineId; F.orderId.innerHTML=opts(DB.orders.filter(o=>o.projectId===p.id),'',o=>o.no+' · срок '+fdate(o.due),'— без заказа —'); }
  const h=planHours(p,+F.qty.value); if(!hintOnly) F.hours.value=Math.round(h*10)/10;
  $('#planHint').textContent=p?`Расчёт: наладка ${N(p.setupMin)} мин + ${N(F.qty.value)} шт ÷ ${N(p.speed)} шт/мин = ${Q(h,1)} ч`:'';
}
function planAfterPrev(id){ const F=$('#mForm').elements, e=lineEnd(F.lineId.value,id); if(!e) return toast('На этой линии ещё нет позиций'); F.start.value=toDT(e); }
function planDiff(o,n){
  const p=projName(n.projectId);
  if(!o) return `Добавил «${p}» на ${lineName(n.lineId)}: ${fdt(tms(n.start))}, ${N(n.qty)} шт (${Q(n.hours,1)} ч)`;
  const ch=[];
  if(o.projectId!==n.projectId) ch.push(`проект «${projName(o.projectId)}» → «${p}»`);
  if(o.lineId!==n.lineId) ch.push(`линия ${lineName(o.lineId)} → ${lineName(n.lineId)}`);
  if(o.start!==n.start) ch.push(`старт ${fdt(tms(o.start))} → ${fdt(tms(n.start))}`);
  if(+o.qty!==+n.qty) ch.push(`кол-во ${N(o.qty)} → ${N(n.qty)}`);
  if(+o.hours!==+n.hours) ch.push(`длительность ${Q(o.hours,1)} → ${Q(n.hours,1)} ч`);
  return `«${p}»: ${ch.join('; ')||'комментарий'}${n.note&&n.note!==o.note?' — '+n.note:''}`;
}

function planCompare(mk,ap,cur){
  const [y,m]=mk.split('-').map(Number), f=iso(new Date(y,m-1,1)), t=iso(new Date(y,m,0)), t0=new Date(y,m-1,1).getTime(), t1=new Date(y,m,1).getTime();
  const inM=it=>{ const a=tms(it.start), b=endMs(it), ov=Math.max(0,Math.min(b,t1)-Math.max(a,t0)); return (+it.qty||0)*(b>a?ov/(b-a):0); };
  const rows={}; const add=(pid,k,v)=>{ rows[pid]=rows[pid]||{a:0,c:0,f:0}; rows[pid][k]+=v; };
  A(ap?.items).forEach(it=>add(it.projectId,'a',inM(it))); cur.forEach(it=>add(it.projectId,'c',inM(it)));
  DB.output.filter(r=>r.date>=f&&r.date<=t).forEach(r=>add(r.projectId,'f',+r.good||0));
  const list=Object.entries(rows).sort((a,b)=>b[1].a-a[1].a), T=list.reduce((s,[,r])=>({a:s.a+r.a,c:s.c+r.c,f:s.f+r.f}),{a:0,c:0,f:0});
  return `<div class="grid kpis k4"><div class="card kpi accent"><div class="kl">Утверждённый план</div><div class="kv">${N(T.a)} <small>шт</small></div><div class="kd">${ap?'утверждён '+fts(ap.at):'не утверждён'}</div></div>
    <div class="card kpi"><div class="kl">Действующий план</div><div class="kv">${N(T.c)} <small>шт</small></div><div class="kd ${T.c>=T.a?'up':'down'}">${T.a?(T.c>=T.a?'+':'')+P((T.c/T.a-1)*100,1)+' к утверждённому':''}</div></div>
    <div class="card kpi"><div class="kl">Факт (журнал выпуска)</div><div class="kv">${N(T.f)} <small>шт</small></div><div class="kd flat">${T.a?P(T.f/T.a*100,0)+' от утверждённого':''}</div></div>
    <div class="card kpi"><div class="kl">Изменений плана</div><div class="kv">${DB.planLog.filter(x=>new Date(x.ts).getMonth()===m-1&&new Date(x.ts).getFullYear()===y&&x.kind!=='meeting').length}</div><div class="kd flat">оперативок: ${DB.planLog.filter(x=>x.kind==='meeting'&&new Date(x.ts).getMonth()===m-1).length}</div></div></div>
  <div class="card"><div class="card-h"><div class="card-t">По проектам</div><div class="card-s">количество в пределах месяца</div></div>${list.length?`<div class="tw"><table><tr><th>Проект</th><th class="num">Утверждено</th><th class="num">Действующий</th><th class="num">Откл. плана</th><th class="num">Факт</th><th>Выполнение утверждённого</th></tr>
  ${list.map(([pid,r])=>{ const pct=r.a?r.f/r.a*100:0; return `<tr><td><span class="sw" style="background:${pColor(byId(DB.projects,pid))}"></span>${esc(projName(pid))}</td><td class="num">${N(r.a)}</td><td class="num">${N(r.c)}</td><td class="num">${r.a?(r.c>=r.a?'+':'')+N(r.c-r.a):'—'}</td><td class="num"><b>${N(r.f)}</b></td>
    <td><div class="prog"><div class="track"><div class="fill" style="width:${Math.min(pct,100)}%;background:${pct>=100?'var(--green)':'var(--brand)'}"></div></div><span style="font-size:12px;font-weight:700">${r.a?P(pct,0):'вне плана'}</span></div></td></tr>`; }).join('')}
  <tfoot><tr><td>Итого</td><td class="num">${N(T.a)}</td><td class="num">${N(T.c)}</td><td class="num">${T.a?(T.c>=T.a?'+':'')+N(T.c-T.a):''}</td><td class="num">${N(T.f)}</td><td>${T.a?P(T.f/T.a*100,0):''}</td></tr></tfoot></table></div>`:'<div class="empty">Нет данных за месяц</div>'}</div>`;

function feasCalc(f){
  const p=byId(DB.projects,f.projectId), qty=+f.qty||0; if(!p||!qty) return;
  const fc=demandForecast(), req=projectReq(p,qty), sup=DB.supplies.filter(s=>s.status!=='received'), today=iso(new Date());
  const lines=[]; let ready=today, impossible=false, orderBy=null;
  Object.entries(req).forEach(([rid,need])=>{
    const x=fc[rid]; if(!x) return; const base=x.stock-x.need;
    const dates=[...new Set(sup.filter(s=>s.rawId===rid).map(s=>s.date))].sort();
    const supBy=d=>sup.filter(s=>s.rawId===rid&&s.date<=d).reduce((a,s)=>a+(+s.qty||0),0);
    let when=base+supBy(today)>=need?today:dates.find(d=>base+supBy(d)>=need);
    let lack=0; if(!when){ lack=need-base-supBy('9999'); const ld=iso(addD(new Date(),+x.r.leadDays||0)); when=ld; impossible=true; orderBy=orderBy&&orderBy>ld?orderBy:ld; }
    if(when>ready) ready=when;
    lines.push(`<tr><td>${esc(x.r.name)}</td><td class="num">${Q(need,2)} ${esc(x.r.unit)}</td><td class="num">${Q(Math.max(0,base+supBy('9999')),2)}</td><td>${lack?`<span class="tag t-red">заказать ${Q(lack,1)} → ${fdate(when)}</span>`:when===today?'<span class="tag t-green">есть</span>':`<span class="tag t-amber">с ${fdate(when)}</span>`}</td></tr>`);
  });
  const hours=planHours(p,qty), lineFree=lineEnd(p.lineId), startMs=Math.max(pd(ready).getTime()+8*H,lineFree||0,Date.now()), finish=startMs+hours*H, ok=finish<=pd(f.due).getTime()+864e5;
  $('#feasOut').innerHTML=`<div class="card" style="padding:14px;margin-top:6px;box-shadow:none">
    <div class="stat"><span>Сырьё будет готово</span><b>${fdate(ready)}${impossible?' <span class="tag t-red">нужен дозаказ</span>':''}</b></div>
    <div class="stat"><span>Линия ${esc(lineName(p.lineId))} свободна с</span><b>${lineFree?fdt(lineFree):'сейчас'}</b></div>
    <div class="stat"><span>Время производства</span><b>${Q(hours,1)} ч</b></div>
    <div class="stat"><span>Реальный старт → окончание</span><b>${fdt(startMs)} → ${fdt(finish)}</b></div>
    <div class="stat"><span>Срок ${fdate(f.due)}</span><b>${ok?'<span class="tag t-green">успеваем</span>':'<span class="tag t-red">не успеваем</span>'}</b></div>
    <div class="tw" style="margin:10px -14px -14px"><table><tr><th>Сырьё</th><th class="num">Нужно</th><th class="num">Свободно с учётом плана</th><th>Статус</th></tr>${lines.join('')}</table></div></div>`;
}

const GROUPS = {project:['Проект',r=>projName(r.projectId)],line:['Линия',r=>lineName(r.lineId)],operator:['Оператор',r=>r.operator||'—'],order:['Заказ',r=>byId(DB.orders,r.orderId)?.no||'Без заказа'],day:['День',r=>r.date],shift:['Смена',r=>r.shift+'-я смена']};
function reportRows(){
  const recs=filtered(inRange(state.from,state.to)), fn=GROUPS[state.groupBy][1], m={};
  recs.forEach(r=>{ const k=fn(r), x=m[k]||(m[k]={k,good:0,defect:0,setup:0,down:0,shifts:new Set()}); x.good+=+r.good||0; x.defect+=+r.defect||0; x.setup+=+r.setup||0; x.down+=+r.downtime||0; x.shifts.add(r.date+r.shift+r.lineId); });
  return Object.values(m).sort((a,b)=>state.groupBy==='day'?b.k.localeCompare(a.k):b.good-a.good);
}
function renderReports(){
  const rows=reportRows(), tot=rows.reduce((a,r)=>({good:a.good+r.good,defect:a.defect+r.defect,setup:a.setup+r.setup,down:a.down+r.down}),{good:0,defect:0,setup:0,down:0});
  $('#content').innerHTML = periodBar() + `<div class="toolbar"><span class="fl" style="margin:0">Группировать по</span><select class="sel" onchange="state.groupBy=this.value;render()">${Object.entries(GROUPS).map(([k,[l]])=>`<option value="${k}" ${state.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>${lineFilter()}<div class="sp"></div><button class="btn btn-s" onclick="exportCSV()">⬇ CSV (Excel)</button></div>
  <div class="card">${rows.length?`<div class="tw flush"><table><tr><th>${GROUPS[state.groupBy][0]}</th><th class="num">Смен</th><th class="num">Годные</th><th class="num">Брак</th><th class="num">Брак %</th><th class="num">Наладка, ч</th><th class="num">Простои, ч</th><th class="num">Выработка/смену</th></tr>
  ${rows.map(r=>`<tr><td><b>${esc(state.groupBy==='day'?fdate(r.k):r.k)}</b></td><td class="num">${r.shifts.size}</td><td class="num">${N(r.good)}</td><td class="num">${N(r.defect)}</td><td class="num">${P(r.good+r.defect?r.defect/(r.good+r.defect)*100:0)}</td><td class="num">${Q(r.setup/60,1)}</td><td class="num">${Q(r.down/60,1)}</td><td class="num">${N(r.good/Math.max(r.shifts.size,1))}</td></tr>`).join('')}
  <tfoot><tr><td>Итого</td><td></td><td class="num">${N(tot.good)}</td><td class="num">${N(tot.defect)}</td><td class="num">${P(tot.good+tot.defect?tot.defect/(tot.good+tot.defect)*100:0)}</td><td class="num">${Q(tot.setup/60,1)}</td><td class="num">${Q(tot.down/60,1)}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">Нет данных за период</div>'}</div>`;
}
function exportCSV(){
  const rows=reportRows(), head=[GROUPS[state.groupBy][0],'Смен','Годные','Брак','Брак %','Наладка ч','Простои ч'];

function normalize(db){
  COLS.forEach(c=>db[c]=A(db[c]));
  db.projects.forEach(p=>p.stations=A(p.stations));
  db.semis.forEach(s=>{ s.items=A(s.items); s.history=A(s.history); });
  db.runs.forEach(r=>{ r.stations=A(r.stations); r.settings=A(r.settings); });
  Object.values(db.approved||{}).forEach(a=>{ if(a) a.items=A(a.items); });
  return db;
}
const Store = {
  async put(col,obj){
    if(state.mode==='fb') return fdb.ref(`${ROOT}/data/${col}/${obj.id}`).set(clone(obj));
    const i=DB[col].findIndex(x=>x.id===obj.id); if(i>=0) DB[col][i]=obj; else DB[col].push(obj); demoSave(); render();
  },
  async del(col,id){
    if(state.mode==='fb') return fdb.ref(`${ROOT}/data/${col}/${id}`).remove();
    DB[col]=DB[col].filter(x=>x.id!==id); demoSave(); render();
  },
  async batch(list){
    if(state.mode==='fb'){ const up={}; list.forEach(x=>{ if(x.path) up[x.path.join('/')]=x.val==null?null:clone(x.val); else up[`${x.col}/${x.obj?x.obj.id:x.id}`]=x.del?null:clone(x.obj); }); return fdb.ref(`${ROOT}/data`).update(up); }
    list.forEach(x=>{
      if(x.path){ let o=DB; x.path.slice(0,-1).forEach(k=>{ o[k]=o[k]||{}; o=o[k]; }); o[x.path.at(-1)]=x.val; }
      else if(x.del) DB[x.col]=DB[x.col].filter(o=>o.id!==x.id);
      else { const i=DB[x.col].findIndex(o=>o.id===x.obj.id); if(i>=0) DB[x.col][i]=x.obj; else DB[x.col].push(x.obj); }
    }); demoSave(); render();
  },
  async settings(s){
    if(state.mode==='fb') return fdb.ref(`${ROOT}/data/settings`).set(s);
    DB.settings=s; demoSave(); $('#orgName').textContent=s.orgName; render();
  },
  async user(u,delId){
    if(state.mode==='fb') return u?fdb.ref(`${ROOT}/users/${u.id}`).set(u):fdb.ref(`${ROOT}/users/${delId}`).remove();
    if(u){ const i=DB.members.findIndex(m=>m.id===u.id); if(i>=0) DB.members[i]=u; else DB.members.push(u); } else DB.members=DB.members.filter(m=>m.id!==delId);
    demoSave(); render();
  },
};

  projects.forEach((p,i)=>{ [0,1].forEach(k=>orders.push({id:'O'+on,no:'З-'+(on++),projectId:p.id,qty:0,due:iso(addD(m0,10+k*14+i*2)),note:''})); });
  // действующий и утверждённый план на текущий месяц
  const approvedItems=[]; let pn=0;
  lines.forEach(l=>{
    const ps=projects.filter(p=>p.lineId===l.id); let t=m0.getTime()+6*H, k=0;
    while(t<mEnd.getTime()-12*H){
      const p=ps[k%ps.length], qty=Math.round((140+rnd()*260))*1000, hours=Math.round(planHours(p,qty)*10)/10;
      const o=orders.filter(o=>o.projectId===p.id).find(o=>!approvedItems.some(a=>a.orderId===o.id));
      approvedItems.push({id:'PL'+(pn++),projectId:p.id,lineId:l.id,orderId:o?.id||'',qty,start:toDT(t),hours,note:''});
      t+=hours*H+Math.round(rnd()*4)*H; k++;
    }
  });
  const plan=clone(approvedItems), planLog=[]; const logAt=(d,h,by,text,kind)=>planLog.push({id:'LG'+planLog.length,ts:new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,Math.floor(rnd()*30)).getTime(),by,text,kind});
  logAt(addD(m0,-2),15,'Администратор',`Утвердил план на ${monthLabel(monthKey(now))}: ${approvedItems.length} позиций`);
  // корректировки после оперативок
  const l1=plan.filter(x=>x.lineId==='L1'), l2=plan.filter(x=>x.lineId==='L2');
  if(l1.length>3){ const shiftFrom=l1[2]; l1.slice(2).forEach(x=>x.start=toDT(tms(x.start)+14*H)); const d=pd(shiftFrom.start.slice(0,10));
    logAt(d,9,'Ольга Петренко','Оперативка: Линия 1 — замена форсунки ст.5 и чистка камеры, сдвиг на 14 ч. Заказчик предупреждён.','meeting');
    logAt(d,9,'Ольга Петренко',`«${projects.find(p=>p.id===shiftFrom.projectId).name}» и далее на Линии 1: старт ${fdt(tms(shiftFrom.start)-14*H)} → ${fdt(tms(shiftFrom.start))} (+14 ч)`); }
  if(l2.length>2){ const x=l2[1], old=x.qty; x.qty=Math.round(old*1.2/1000)*1000; x.hours=Math.round(planHours(projects.find(p=>p.id===x.projectId),x.qty)*10)/10;
    l2.slice(2).forEach(y=>y.start=toDT(tms(y.start)+(x.hours-approvedItems.find(a=>a.id===x.id).hours)*H));
    logAt(pd(x.start.slice(0,10)),9,'Марина Коваль',`«${projects.find(p=>p.id===x.projectId).name}»: кол-во ${N(old)} → ${N(x.qty)} (клиент увеличил заказ)`); }
  logAt(now,9,'Ольга Петренко','Оперативка: план на сегодня без изменений. Золото Au-7 заканчивается — снабжению ускорить поставку.','meeting');
  // журнал выпуска: 180 дней, 3 смены
  const ops=['Иванов А.','Петренко О.','Коваль М.','Сидорук В.','Мельник Т.','Бондар Р.','Шевчук Л.'];
  const reasons=DEFAULT_SETTINGS.defectReasons, rw=[26,20,18,12,10,8,6];
  const reason=()=>{ let x=rnd()*100; for(let i=0;i<rw.length;i++){ if((x-=rw[i])<0) return reasons[i]; } return reasons[0]; };
  const output=[], cur={};
  for(let d=addD(now,-180); iso(d)<=T; d=addD(d,1)){
    const s=iso(d), age=(now-d)/864e5;
    lines.forEach(l=>{
      for(let sh=1; sh<=3; sh++){
        const mid=new Date(d.getFullYear(),d.getMonth(),d.getDate(),[10,18,26][sh-1]).getTime(); if(mid>now.getTime()) continue;
        const pi=plan.find(x=>x.lineId===l.id&&tms(x.start)<=mid&&endMs(x)>mid);
        let p, orderId='';
        if(pi){ p=projects.find(q=>q.id===pi.projectId); orderId=pi.orderId; }
        else if(s>=iso(m0)) continue; // в текущем месяце работаем только по плану
        else { const ps=projects.filter(q=>q.lineId===l.id&&q.status==='Активный'); p=(!cur[l.id]||rnd()<.25)?pick(ps):projects.find(q=>q.id===cur[l.id]); }
        let setup=0; if(cur[l.id]!==p.id){ setup=Math.round(p.setupMin*(.85+rnd()*(.4+age/180*.9))); cur[l.id]=p.id; }
        setup=Math.min(setup,400);
        const brk=rnd()<.03, down=brk?90+Math.round(rnd()*150):Math.round(rnd()*rnd()*50), runMin=Math.max(0,480-setup-down);
        const good=Math.round(p.speed*runMin*(.82+rnd()*.14)), defect=Math.round(good*(.006+rnd()*rnd()*.045));
        output.push({id:'R'+output.length,date:s,shift:sh,lineId:l.id,projectId:p.id,orderId,good,defect,reason:defect?reason():'',setup,downtime:down,operator:pick(ops),ts:d.getTime()+sh});
      }
    });
  }
  orders.forEach(o=>{ const inPlan=plan.filter(x=>x.orderId===o.id).reduce((a,x)=>a+x.qty,0); const done=output.filter(r=>r.orderId===o.id).reduce((a,r)=>a+r.good,0); o.qty=Math.max(20000,Math.round((inPlan||done||60000)*(.95+rnd()*.1)/1000)*1000); });
  // тех. отчёты наработок (прошлые месяцы)
  const runs=[], moves=[];
  projects.filter(p=>p.status==='Активный').forEach((p,pi)=>{
    [70,35].forEach((back,k)=>{
      const df=iso(addD(now,-back-pi)), dt=iso(addD(now,-back-pi+2)), good=Math.round((150+rnd()*150))*1000, defect=Math.round(good*.018), q=good+defect;
      const stations=A(p.stations).map((s0,i)=>{ const s=semis.find(x=>x.id===s0.semiId); const plan=s0.norm*q/1e6; return {n:i+1,semiId:s.id,name:s.name,color:s.color,ver:s.id==='S2'&&k===0?1:(s.ver||1),rawPerKg:{},norm:s0.norm,visc:s0.visc,press:s0.press,nozzle:s0.nozzle,factKg:R2(plan*(.96+rnd()*.14))}; });
      runs.push({id:'RN'+runs.length,projectId:p.id,lineId:p.lineId,dateFrom:df,dateTo:dt,qtyGood:good,qtyDefect:defect,setupFact:Math.round(p.setupMin*(1.1+rnd()*.5)),speedFact:Math.round(p.speed*(.9+rnd()*.08)),
        settings:DEFAULT_SETTINGS.machineParams.map((kk,j)=>({k:kk,v:[String(p.speed),'85','45','6,0','24','45','60'][j]})),stations,note:k?'':'Первая наработка после смены поставщика пигмента — вязкость пришлось поднять на 1–2 с.',writtenOff:true,by:'Ольга Петренко',ts:pd(dt).getTime()});
    });
  });
  // поставки
  const supplies=[
    {id:'SP1',rawId:'R7',qty:12,date:iso(addD(now,6)),supplier:'MetaFX',status:'ordered',note:'Заказ MF-2231'},
    {id:'SP2',rawId:'R4',qty:25,date:iso(addD(now,9)),supplier:'PigmentPro',status:'ordered',note:''},
    {id:'SP3',rawId:'R15',qty:200000,date:iso(addD(now,1)),supplier:'GlassWorks',status:'ordered',note:'2 фуры'},
    {id:'SP6',rawId:'R15',qty:200000,date:iso(addD(now,2)),supplier:'GlassWorks',status:'ordered',note:'2 фуры'},
    {id:'SP7',rawId:'R14',qty:200000,date:iso(addD(now,2)),supplier:'GlassWorks',status:'ordered',note:''},
    {id:'SP4',rawId:'R1',qty:400,date:iso(addD(now,-12)),supplier:'ChemCoat',status:'received',receivedQty:400,receivedDate:iso(addD(now,-12)),note:''},
    {id:'SP5',rawId:'R14',qty:300000,date:iso(addD(now,-8)),supplier:'GlassWorks',status:'received',receivedQty:300000,receivedDate:iso(addD(now,-8)),note:''}];
  moves.push({id:'MV1',date:iso(addD(now,-12)),type:'in',rawId:'R1',qty:400,cost:8.4,doc:'ТН-4411',note:'Приёмка поставки · ChemCoat',by:'Администратор',ts:1});
  moves.push({id:'MV2',date:iso(addD(now,-8)),type:'in',rawId:'R14',qty:300000,cost:.18,doc:'ТН-9020',note:'Приёмка поставки · GlassWorks',by:'Администратор',ts:2});
  moves.push({id:'MV3',date:iso(addD(now,-5)),type:'inv',rawId:'R10',qty:-6,note:'было 266, стало 260',by:'Ольга Петренко',ts:3});
  orders.filter(o=>o.due<T).forEach((o,i)=>moves.push({id:'MV'+(10+i),date:o.due,type:'ship',projectId:o.projectId,orderId:o.id,qty:Math.min(o.qty,orderDoneLocal(o)),doc:'ТТН-'+(500+i),by:'Администратор',ts:10+i}));
  function orderDoneLocal(o){ return output.filter(r=>r.orderId===o.id).reduce((a,r)=>a+r.good,0); }
  const members=[{id:'admin',login:'admin',name:'Администратор',password:'1234',role:'admin'},{id:'olga',login:'olga',name:'Ольга Петренко',password:'1234',role:'master'},{id:'andriy',login:'andriy',name:'Андрей Иванов',password:'1234',role:'operator'},{id:'marina',login:'marina',name:'Марина Коваль',password:'1234',role:'technologist'}];
  const db={lines,projects,raw,semis,orders,output,runs,plan,planLog,supplies,moves:moves.filter(m=>m.qty>0||m.type==='inv'),members,approved:{[monthKey(now)]:{at:addD(m0,-2).getTime()+15*H,by:'Администратор',items:approvedItems}},settings:{...DEFAULT_SETTINGS}};
  // снимок состава рецептур в тех. отчётах
  const keep=DB; DB=normalize(clone(db)); db.runs.forEach(r=>r.stations.forEach(s=>s.rawPerKg=expand('semi',s.semiId,1))); DB=keep;
  return db;
}
function demoSave(){ if(state.mode!=='demo') return; try{ localStorage.setItem('pdd_demo_v3',JSON.stringify(DB)); }catch(e){} }
function resetDemo(){ if(!confirm('Сбросить демо-данные к исходным?')) return; try{ localStorage.removeItem('pdd_demo_v3'); }catch(e){} DB=normalize(genDemo()); render(); toast('Демо-данные сброшены'); }
function startDemo(){
  state.mode='demo';
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('pdd_demo_v3')||'null'); }catch(e){}
  DB=normalize(saved&&saved.plan?saved:genDemo());
  state.me={...DB.members[0]}; enterApp();
}

// ═════════════════════════════════════════════
//  FIREBASE — открытый режим (как FinFlow): логин/пароль
// ═════════════════════════════════════════════
let _users={};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function authScreen(kind,info){
  const b=$('#authBody'); $('#auth').style.display='flex'; $('#app').style.display='none';
  const demoLink=`<div style="text-align:center;margin-top:14px"><button class="link" onclick="startDemo()">Открыть локальное демо без базы</button></div>`;
  if(kind==='loading') b.innerHTML=`<p class="sub" style="margin-top:26px">Подключение к базе…</p>`;
  if(kind==='demo') b.innerHTML=`<h2>Добро пожаловать</h2><p class="sub">Откроется демо-режим с тестовыми данными — можно всё потрогать, ничего не сломается.</p><button class="btn btn-p btn-w" onclick="startDemo()">Открыть демо →</button>`;
  if(kind==='offline') b.innerHTML=`<h2>Нет связи с базой</h2><p class="sub">${esc(info||'')}<br>Проверьте интернет и попробуйте ещё раз.</p><button class="btn btn-p btn-w" onclick="connect()">Повторить</button>${demoLink}`;
  if(kind==='setup') b.innerHTML=`<h2>Первый запуск</h2><p class="sub">В базе ещё нет пользователей. Создайте администратора — он заведёт остальных сотрудников.</p><div class="msg" id="aMsg"></div>
    <div class="fg"><label class="fl">Название предприятия</label><input class="fi" id="sOrgN" placeholder="Моё производство"></div>
    <div class="fg"><label class="fl">Ваше имя</label><input class="fi" id="sName"></div>
    <div class="frow"><div class="fg"><label class="fl">Логин</label><input class="fi" id="sLogin" placeholder="admin" autocapitalize="off"></div><div class="fg"><label class="fl">Пароль</label><input class="fi" id="sPass" type="password"></div></div>
    <button class="btn btn-p btn-w" onclick="doSetup()" id="aBtn">Создать и войти →</button>${demoLink}`;
  if(kind==='login') b.innerHTML=`<h2>Вход</h2><p class="sub">Логин и пароль выдаёт администратор.</p><div class="msg" id="aMsg"></div>
    <div class="fg"><label class="fl">Логин</label><input class="fi" id="aLogin" autocapitalize="off" autocomplete="username"></div>
    <div class="fg"><label class="fl">Пароль</label><input class="fi" id="aPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-p btn-w" onclick="doLogin()" id="aBtn">Войти</button>${demoLink}`;
  setTimeout(()=>b.querySelector('input')?.focus(),50);
}
const amsg=t=>{ const m=$('#aMsg'); if(m){ m.textContent=t; m.className='msg err'; } };
const cleanLogin=v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
function doLogin(){
  const l=cleanLogin($('#aLogin').value), u=_users[l];
  if(!u||String(u.password)!==$('#aPass').value) return amsg('Неверный логин или пароль');
  try{ localStorage.setItem('pdd_session',l); }catch(e){}
  openData(l);
}
async function doSetup(){
  const orgName=$('#sOrgN').value.trim()||'Моё производство', name=$('#sName').value.trim(), login=cleanLogin($('#sLogin').value), pass=$('#sPass').value;
  if(!name||!login) return amsg('Заполните имя и логин (латиница, цифры)');
  if(pass.length<4) return amsg('Пароль минимум 4 символа');
  try{ $('#aBtn').disabled=true;
    await fdb.ref(`${ROOT}/users/${login}`).set({id:login,login,name,password:pass,role:'admin'});
    await fdb.ref(`${ROOT}/data/settings`).set({...DEFAULT_SETTINGS,orgName});
    try{ localStorage.setItem('pdd_session',login); }catch(e){}
    openData(login);
  }catch(e){ amsg('Ошибка записи: '+e.message); $('#aBtn').disabled=false; }
}
function openData(login){
  state.mode='fb'; let first=true;
  if(orgRef) orgRef.off();
  orgRef=fdb.ref(ROOT);
  orgRef.on('value',snap=>{
    const v=snap.val()||{}, d=v.data||{}, arr=o=>Object.entries(o||{}).filter(([,x])=>x).map(([id,x])=>({...x,id}));
    const me=v.users?.[login]; if(!me){ toast('Пользователь удалён'); logout(); return; }
    const db={members:arr(v.users),settings:{...DEFAULT_SETTINGS,...(d.settings||{})},approved:d.approved||{}};
    COLS.forEach(c=>db[c]=arr(d[c]));
    // совместимость с первой версией (продукция → проекты, склад → сырьё)
    if(!db.projects.length&&d.products) db.projects=arr(d.products).map(p=>({...p,speed:80,setupMin:+p.setupNorm||60,stations:[],status:'Активный'}));
    if(!db.raw.length&&d.stock) db.raw=arr(d.stock).map(s=>({...s,cost:0}));
    db.output.forEach(r=>{ if(!r.projectId&&r.productId) r.projectId=r.productId; });
    db.orders.forEach(o=>{ if(!o.projectId&&o.productId) o.projectId=o.productId; });
    DB=normalize(db);
    state.me={id:login,name:me.name,role:me.role};
    if(first){ first=false; enterApp(); }
    else { $('#meName').textContent=me.name; $('#meRole').textContent=ROLES[me.role]?.n||''; $('#orgName').textContent=DB.settings.orgName; if(!$('#modal').classList.contains('open')) render(); }
  },err=>{ authScreen('offline','Нет доступа к базе: '+err.message); });
}
async function seedLive(){
  if(!confirm('Заполнить базу примером? Текущие данные (кроме пользователей и настроек) будут заменены.')) return;
  const g=genDemo(), up={}, o=x=>Object.fromEntries(x.map(i=>[i.id,i]));
  COLS.forEach(c=>up[c]=o(g[c])); up.approved=g.approved; up.products=null; up.stock=null;
  await fdb.ref(`${ROOT}/data`).update(clone(up)); toast('Пример загружен');
}
async function clearLive(){
  if(!confirm('Удалить ВСЕ данные: выпуск, план, проекты, рецептуры, сырьё, склад? Пользователи и настройки останутся.')) return;
  if(prompt('Для подтверждения напишите: УДАЛИТЬ')!=='УДАЛИТЬ') return;
  const up={approved:null,products:null,stock:null}; COLS.forEach(c=>up[c]=null);
  await fdb.ref(`${ROOT}/data`).update(up); toast('Данные очищены');
}
function logout(){
  try{ localStorage.removeItem('pdd_session'); }catch(e){}
  if(orgRef){ orgRef.off(); orgRef=null; }
  $('#app').style.display='none';
  if(fdb) authScreen(Object.keys(_users).length?'login':'setup'); else authScreen('demo');
}
async function connect(){
  authScreen('loading');
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fdb=firebase.database(); auth=firebase.auth();
    if(!auth.currentUser) await Promise.race([auth.signInAnonymously().catch(e=>console.warn('anon auth:',e.message)),wait(6000)]);
    const snap=await Promise.race([fdb.ref(ROOT+'/users').once('value'),wait(9000).then(()=>{ throw new Error('База не ответила за 9 секунд.'); })]);
    _users=snap.val()||{};
    fdb.ref(ROOT+'/users').on('value',x=>{ _users=x.val()||{}; });
    if(!Object.keys(_users).length) return authScreen('setup');
    let sess=null; try{ sess=localStorage.getItem('pdd_session'); }catch(e){}
    if(sess&&_users[sess]) return openData(sess);
    authScreen('login');
  }catch(e){ fdb=null; authScreen('offline',e.message); }
}
(function boot(){
  if(!window.firebase||!FB_CONFIG.apiKey){ authScreen('demo'); return; }
  connect();
})();
</script>
